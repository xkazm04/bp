  // ═══════════════════════════════════════════════════════════════════════
  // INTERACTION: camera, levels, pointer, keys, filters, selection
  // ═══════════════════════════════════════════════════════════════════════
  let raf = 0;
  let anim = null;
  let dragMoved = false;

  function kMin() { return Math.min(fitView().k * 0.6, 0.12); }
  /** Moves the camera; the one transformed group and the paper grid update on the next frame. */
  function setCam(c, fromUser) {
    state.cam = { x: c.x, y: c.y, k: Math.max(kMin(), Math.min(K_MAX, c.k)) };
    if (fromUser) { state.touched = true; anim = null; }
    if (!raf) raf = requestAnimationFrame(commit);
  }
  function setCamNow(c) { setCam(c); commit(); }
  const gridEls = {};
  let lastK = 0;
  let zoomTimer = 0;
  /** Applies the camera: world transform, ruled paper, scale readout and the level of detail. */
  function commit() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    const { x, y, k } = state.cam;
    world.setAttribute('transform', 'translate(' + r2(x) + ',' + r2(y) + ') scale(' + k.toFixed(5) + ')');
    if (lastK && Math.abs(k - lastK) > 1e-6 && (anim || pointers.size || wheelActive)) {
      plan.classList.add('zooming');
      clearTimeout(zoomTimer);
      plan.classList.remove('relettered');
      zoomTimer = setTimeout(() => {
        plan.classList.remove('zooming');
        plan.classList.add('relettered');
        setTimeout(() => plan.classList.remove('relettered'), 220);
      }, anim ? 60 : 150);
    }
    lastK = k;
    // ruled paper: minor 25 units, major 125 units, thinned out when dense
    let step = 25 * k;
    while (step < 7) step *= 5;
    const major = step * 5;
    if (!gridEls.minor) {
      gridEls.minor = $('#p-grid-minor'); gridEls.major = $('#p-grid-major');
      gridEls.pm = $('#pg-minor'); gridEls.pM = $('#pg-major');
    }
    [[gridEls.minor, gridEls.pm, step], [gridEls.major, gridEls.pM, major]].forEach(([pat, path, st]) => {
      const w = r2(st);
      pat.setAttribute('width', w);
      pat.setAttribute('height', w);
      pat.setAttribute('patternTransform', 'translate(' + r2(((x % st) + st) % st) + ',' + r2(((y % st) + st) % st) + ')');
      path.setAttribute('d', 'M0 .5H' + w + 'M.5 0V' + w);
    });
    updateScale(k);
    const lv = k < LV.SHEET ? 0 : k < LV.ROOM ? 1 : k < LV.DETAIL ? 2 : 3;
    if (lv !== state.level) {
      plan.classList.remove('lv0', 'lv1', 'lv2', 'lv3');
      plan.classList.add('lv' + lv);
      state.level = lv;
      $('#lvl-name').textContent = LV_NAMES[lv].toUpperCase();
    }
    if (lv === 0) WINGS.forEach((w) => {
      const p = w.plate;
      let s = 1 / k;
      const maxW = w.rect.w * 0.9;
      const maxH = w.rect.h * 0.8;
      s = Math.min(s, maxW / p.pw, maxH / p.ph);
      p.g.setAttribute('transform', 'translate(' + r2(p.cx) + ',' + r2(p.cy) + ') scale(' + s.toFixed(4) + ')');
    });
    if (state.sel && state.sel.type === 'feature') drawLinks();
  }

  /** Drawing scale: 1 world unit = 20 mm; a CSS pixel is 0.2646 mm. */
  let scaleKey = '';
  let barW = 180;
  function updateScale(k) {
    const n = 75.6 / k;
    const mag = Math.pow(10, Math.floor(Math.log10(n)) - 1);
    const label = '1:' + Math.round(n / mag) * mag;
    const key = label + '|' + Math.round(k * 400);
    if (key === scaleKey) return;
    scaleKey = key;
    $('#lvl-scale').textContent = 'SCALE ' + label;
    $('#tb-scale-v').textContent = label;
    $('#foot-scale').textContent = label;
    const pxPerM = 50 * k;
    const nice = [0.5, 1, 2, 5, 10, 20, 50, 100];
    const svg = $('#scalebar');
    const avail = Math.max(120, barW - 20);
    let m = nice[0];
    nice.forEach((v) => { if (v * pxPerM <= avail) m = v; });
    const L = m * pxPerM;
    let s = '';
    for (let i = 0; i < 4; i++) s += '<rect x="' + r2(2 + i * L / 4) + '" y="2" width="' + r2(L / 4) + '" height="5" fill="' + (i % 2 ? 'var(--paper)' : 'var(--ink)') + '" stroke="var(--ink)" stroke-width="1"/>';
    s += '<text x="2" y="19" font-family="var(--f-mono)" font-size="9" fill="var(--ink-2)">0</text><text x="' + r2(2 + L) + '" y="19" text-anchor="end" font-family="var(--f-mono)" font-size="9" fill="var(--ink-2)">' + m + ' M</text>';
    svg.innerHTML = s;
  }

  /** Unobstructed part of the stage, in stage pixels, accounting for open panels. */
  function visibleArea() {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const a = { x: 0, y: 0, w: vw, h: vh };
    const insp = $('#inspector');
    if (!insp.classList.contains('closed')) {
      if (isPhone()) {
        const stageTop = viewport.getBoundingClientRect().top;
        const top = $('#app').clientHeight - insp.offsetHeight - stageTop;
        a.h = Math.max(120, Math.min(vh, top));
      } else {
        a.w = Math.max(200, vw - (insp.offsetWidth - $('#strip').offsetWidth));
      }
    }
    return a;
  }
  function camForBox(box, area, pad) {
    const k = Math.min((area.w - 2 * pad) / box.w, (area.h - 2 * pad) / box.h);
    return { k, x: area.x + area.w / 2 - (box.x + box.w / 2) * k, y: area.y + area.h / 2 - (box.y + box.h / 2) * k };
  }
  function fitView() {
    const ph = isPhone();
    const va = visibleArea();
    const area = { x: va.x, y: va.y, w: va.w || 800, h: (va.h || 600) - (ph ? 0 : 44) };
    const pad = ph ? 8 : 16;
    const c1 = camForBox(PLAN.ext, area, pad);
    if (c1.k >= LV.SHEET) return c1;
    // dimension strings are not lettered on a key plan, so frame the building itself
    const b = { x: -G.ext - 12, y: -G.ext - 12, w: PLAN.W + 2 * G.ext + 24, h: PLAN.H + 2 * G.ext + 24 };
    const c2 = camForBox(b, area, pad);
    const k = Math.min(c2.k, LV.SHEET - 0.002);
    return { k, x: area.x + area.w / 2 - (b.x + b.w / 2) * k, y: area.y + area.h / 2 - (b.y + b.h / 2) * k };
  }
  function fit(animate) {
    state.touched = false;
    const c = fitView();
    if (animate) flyCam(c); else setCamNow(c);
  }
  function flyCam(target, ms) {
    hideTip();
    if (reduceMotion()) { anim = null; setCamNow(target); return; }
    const from = Object.assign({}, state.cam);
    const area = visibleArea();
    const ax = area.x + area.w / 2;
    const ay = area.y + area.h / 2;
    const w0 = { x: (ax - from.x) / from.k, y: (ay - from.y) / from.k };
    const w1 = { x: (ax - target.x) / target.k, y: (ay - target.y) / target.k };
    const t0 = performance.now();
    const dur = ms || 520;
    const token = {};
    anim = token;
    (function step(now) {
      if (anim !== token) return;
      const t = Math.min(1, (now - t0) / dur);
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const k = Math.exp(Math.log(from.k) + (Math.log(target.k) - Math.log(from.k)) * e);
      const wx = w0.x + (w1.x - w0.x) * e;
      const wy = w0.y + (w1.y - w0.y) * e;
      setCam({ k, x: ax - wx * k, y: ay - wy * k });
      if (t < 1) requestAnimationFrame(step);
      else { anim = null; commit(); }
    })(t0);
  }
  function flyToRect(r, pad) {
    state.touched = true;
    flyCam(camForBox({ x: r.x - pad, y: r.y - pad, w: r.w + 2 * pad, h: r.h + 2 * pad }, visibleArea(), 12));
  }
  function flyToFeature(id, minK) {
    const rec = FX.get(id);
    if (!rec) return;
    const area = visibleArea();
    const k = Math.max(state.cam.k, minK || LV.DETAIL + 0.08);
    const k2 = Math.min(k, K_MAX, area.w / 260, area.h / 220 + 0.6);
    const cx = rec.x + G.cw / 2;
    const cy = rec.y + G.ch / 2;
    state.touched = true;
    flyCam({ k: k2, x: area.x + area.w / 2 - cx * k2, y: area.y + area.h / 2 - cy * k2 });
  }
  function zoomAt(px, py, factor) {
    const { x, y, k } = state.cam;
    const nk = Math.max(kMin(), Math.min(K_MAX, k * factor));
    const f = nk / k;
    setCam({ k: nk, x: px - (px - x) * f, y: py - (py - y) * f }, true);
  }
  function zoomCenter(factor) {
    const a = visibleArea();
    const { x, y, k } = state.cam;
    const nk = Math.max(kMin(), Math.min(K_MAX, k * factor));
    const px = a.x + a.w / 2;
    const py = a.y + a.h / 2;
    state.touched = true;
    flyCam({ k: nk, x: px - (px - x) * nk / k, y: py - (py - y) * nk / k }, 260);
  }

  // pointer: drag to pan, pinch to zoom, click to select
  const pointers = new Map();
  let pinch = null;
  let downTarget = null;
  let downAt = null;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    anim = null;
    try { viewport.setPointerCapture(e.pointerId); } catch (err) { /* pointer already released */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) { downTarget = e.target; downAt = { x: e.clientX, y: e.clientY }; dragMoved = false; }
    if (pointers.size === 2) {
      const [a, b] = Array.from(pointers.values());
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      dragMoved = true;
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) { hoverTip(e); return; }
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const rect = viewport.getBoundingClientRect();
    if (pointers.size >= 2 && pinch) {
      const [a, b] = Array.from(pointers.values());
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const c = state.cam;
      const nk = Math.max(kMin(), Math.min(K_MAX, c.k * d / pinch.d));
      const f = nk / c.k;
      const px = pinch.mx - rect.left;
      const py = pinch.my - rect.top;
      setCam({ k: nk, x: px - (px - c.x) * f + (mx - pinch.mx), y: py - (py - c.y) * f + (my - pinch.my) }, true);
      pinch = { d, mx, my };
      return;
    }
    if (!dragMoved && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 5) return;
    if (!dragMoved) { dragMoved = true; viewport.classList.add('panning'); hideTip(); }
    setCam({ k: state.cam.k, x: state.cam.x + (e.clientX - prev.x), y: state.cam.y + (e.clientY - prev.y) }, true);
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) {
      viewport.classList.remove('panning');
      if (!dragMoved && e.type === 'pointerup') handleTap(downTarget);
      setTimeout(() => { dragMoved = false; }, 0);
    }
  }
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('pointerleave', hideTip);
  let wheelActive = false;
  let wheelTimer = 0;
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    hideTip();
    wheelActive = true;
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => { wheelActive = false; }, 160);
    const rect = viewport.getBoundingClientRect();
    let dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
    dy = Math.max(-120, Math.min(120, dy));
    const factor = Math.exp(-dy * (e.ctrlKey ? 0.012 : 0.0022));
    anim = null;
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, factor);
  }, { passive: false });

  function handleTap(target) {
    if (!target || !target.closest) return;
    const fxEl = target.closest('[data-fid]');
    if (fxEl) { selectFeature(fxEl.getAttribute('data-fid'), { fly: false }); return; }
    const zone = target.closest('.zone-hdr, .plate-g');
    if (zone) return;
    const roomEl = target.closest('[data-room]');
    if (roomEl) { selectModule(roomEl.getAttribute('data-room'), true); return; }
    clearSelection();
  }

  // hover tooltip (fine pointers, before names are lettered on the plan)
  const tip = $('#tip');
  function hoverTip(e) {
    if (e.pointerType !== 'mouse' || state.level >= 3 || anim) { hideTip(); return; }
    const fxEl = e.target.closest && e.target.closest('[data-fid]');
    if (!fxEl || (state.sel && state.sel.id === fxEl.getAttribute('data-fid'))) { hideTip(); return; }
    const rec = FX.get(fxEl.getAttribute('data-fid'));
    const f = rec.f;
    tip.innerHTML = '<div class="t1">' + rec.tag + ' · ' + esc(rec.room.code) + ' ' + esc(rec.room.m.name.toUpperCase()) + '</div><div class="t2">' + esc(f.name) + '</div><div class="t3">' + esc(STATUS_LABEL[f.status].toUpperCase()) + ' · ' + LENS[state.lens].short + ' ' + pct(BP.lensValue(f, state.lens)) + (rec.trust ? ' · ▲ ' + (f.review === 'changes' ? 'CHANGES REQUESTED' : 'AWAITING REVIEW') : '') + '</div>';
    tip.hidden = false;
    const r = viewport.getBoundingClientRect();
    let x = e.clientX - r.left + 16;
    let y = e.clientY - r.top + 16;
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    if (x + tw > r.width - 8) x = e.clientX - r.left - tw - 12;
    if (y + th > r.height - 8) y = e.clientY - r.top - th - 12;
    tip.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
    tip.style.left = '0';
    tip.style.top = '0';
  }
  function hideTip() { tip.hidden = true; }

  // lens switching: a quick sheet flip
  function setLens(id) {
    if (!LENS[id] || id === state.lens) return;
    const apply = () => {
      state.lens = id;
      LENSES.forEach((l) => plan.classList.toggle('lens-' + l.id, l.id === id));
      refreshLensText();
      updateChrome();
      if (state.sel) renderInspector();
    };
    if (reduceMotion()) { apply(); return; }
    plan.classList.add('flip');
    setTimeout(() => { apply(); requestAnimationFrame(() => plan.classList.remove('flip')); }, 150);
  }

  // filters and search: non-matching fixtures dim, matches get a highlight frame
  function filterActive() { return state.statuses.size > 0 || state.query.trim() !== ''; }
  function applyFilters() {
    const active = filterActive();
    const q = state.query.trim();
    const filter = { statuses: state.statuses, query: q };
    let n = 0;
    const roomHits = new Map();
    FX.forEach((rec) => {
      const m = BP.matches(rec.f, filter);
      if (m) n += 1;
      rec.match = m;
      rec.el.classList.toggle('dim', active && !m);
      rec.el.classList.toggle('match', !!q && m);
      if (m) roomHits.set(rec.room.m.id, true);
    });
    ROOMS.forEach((room, id) => room.lblEl.classList.toggle('dimroom', active && !roomHits.has(id)));
    $('#search-count').textContent = q ? n + ' FOUND' : '';
    $$('.chip-set').forEach((set) => set.classList.toggle('filtering', state.statuses.size > 0));
    $$('.chip').forEach((c) => c.setAttribute('aria-pressed', String(state.statuses.has(c.getAttribute('data-status')))));
    return n;
  }
  function firstMatch() {
    for (const rec of FX.values()) if (rec.match) return rec;
    return null;
  }

  function setTrust(on) {
    state.trust = on;
    plan.classList.toggle('trust', on);
    $('#trust-toggle').setAttribute('aria-pressed', String(on));
    refreshLensText();
  }

  // selection
  function clearLinks() { layers.links.textContent = ''; }
  function drawLinks() {
    clearLinks();
    if (!state.sel || state.sel.type !== 'feature') return;
    const rec = FX.get(state.sel.id);
    const k = state.cam.k;
    const head = 7 / Math.max(k, 0.35);
    const showTags = state.level === 1;
    // a point on the square around a symbol (half-size h), on the ray toward (px, py)
    const edge = (c, px, py, h) => {
      const dx = px - c.cx; const dy = py - c.cy;
      const t = h / (Math.max(Math.abs(dx), Math.abs(dy)) || 1);
      return [c.cx + dx * t, c.cy + dy * t];
    };
    const one = (from, to, cls, tagRec) => {
      const dx = to.cx - from.cx; const dy = to.cy - from.cy;
      const len = Math.hypot(dx, dy) || 1;
      const bend = Math.min(150, len * 0.2);
      const mx = (from.cx + to.cx) / 2 - dy / len * bend;
      const my = (from.cy + to.cy) / 2 + dx / len * bend;
      const [x1, y1] = edge(from, mx, my, 22);
      const [tx, ty] = edge(to, mx, my, 24);
      el('path', { d: 'M' + r2(x1) + ',' + r2(y1) + 'Q' + r2(mx) + ',' + r2(my) + ' ' + r2(tx) + ',' + r2(ty), class: 'lnk ' + cls }, layers.links);
      el('circle', { cx: r2(x1), cy: r2(y1), r: r2(2.6 / Math.max(k, 0.35)), class: 'lnk-head' }, layers.links);
      const ang = Math.atan2(ty - my, tx - mx);
      const hx = (a) => r2(tx - head * Math.cos(ang + a));
      const hy = (a) => r2(ty - head * Math.sin(ang + a));
      el('path', { d: 'M' + r2(tx) + ',' + r2(ty) + 'L' + hx(0.42) + ',' + hy(0.42) + 'L' + hx(-0.42) + ',' + hy(-0.42) + 'Z', class: 'lnk-head' }, layers.links);
      if (showTags) {
        const fs = 10.5 / k;
        const w = fs * 3.9;
        const h = fs * 1.55;
        // seat the tag in the cell's lower half, which carries no lettering at sheet level
        const lx = tagRec.x + G.cw / 2;
        const ly = tagRec.y + 64;
        el('rect', { x: r2(lx - w / 2), y: r2(ly - h / 2), width: r2(w), height: r2(h), class: 'lnk-tag' }, layers.links);
        txt(layers.links, lx, ly + fs * 0.36, tagRec.tag, 't-lnk', { style: 'font-size:' + r2(fs) + 'px' });
      }
    };
    BP.dependencies(rec.f).forEach((d) => { const t = FX.get(d.id); one(rec, t, 'dep-out', t); });
    BP.dependents(rec.f).forEach((d) => { const s = FX.get(d.id); one(s, rec, 'dep-in', s); });
  }
  function markSelection() {
    FX.forEach((rec) => rec.el.classList.remove('sel', 'rel'));
    ROOMS.forEach((room) => room.el.classList.remove('room-sel'));
    plan.classList.remove('has-sel');
    if (!state.sel) return;
    if (state.sel.type === 'feature') {
      const rec = FX.get(state.sel.id);
      rec.el.classList.add('sel');
      BP.dependencies(rec.f).concat(BP.dependents(rec.f)).forEach((d) => FX.get(d.id).el.classList.add('rel'));
      plan.classList.add('has-sel');
      // keep the selected fixture on top of its neighbours
      layers.fx.appendChild(rec.el);
    } else {
      ROOMS.get(state.sel.id).el.classList.add('room-sel');
    }
  }
  function selectFeature(id, opts) {
    const rec = FX.get(id);
    if (!rec) return;
    hideTip();
    state.sel = { type: 'feature', id };
    markSelection();
    openInspector();
    renderInspector();
    drawLinks();
    const o = opts || {};
    if (o.fly) flyToFeature(id);
    else ensureVisible(rec);
  }
  function ensureVisible(rec) {
    const a = visibleArea();
    const { x, y, k } = state.cam;
    const sx = rec.x * k + x;
    const sy = rec.y * k + y;
    const sw = G.cw * k;
    const sh = G.ch * k;
    if (sx >= a.x + 8 && sy >= a.y + 8 && sx + sw <= a.x + a.w - 8 && sy + sh <= a.y + a.h - 8) return;
    const nx = Math.min(Math.max(sx, a.x + 24), a.x + a.w - sw - 24);
    const ny = Math.min(Math.max(sy, a.y + 24), a.y + a.h - sh - 24);
    state.touched = true;
    flyCam({ k, x: x + (nx - sx), y: y + (ny - sy) }, 320);
  }
  function selectModule(id, fly) {
    const room = ROOMS.get(id);
    if (!room) return;
    state.sel = { type: 'module', id };
    markSelection();
    clearLinks();
    openInspector();
    renderInspector();
    if (fly) setTimeout(() => flyToRect(room, 30), 30);
  }
  function clearSelection() {
    if (!state.sel) { closeInspector(); return; }
    state.sel = null;
    markSelection();
    clearLinks();
    closeInspector();
  }

  // keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
    if (e.key === 'Escape') {
      if (typing && e.target.value) { e.target.value = ''; state.query = ''; applyFilters(); return; }
      if (typing) { e.target.blur(); return; }
      if (!$('#strip').classList.contains('closed') && isPhone()) { setNotes(false); return; }
      clearSelection();
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    const lens = LENSES.find((l) => l.key === e.key);
    if (lens) { setLens(lens.id); e.preventDefault(); return; }
    switch (e.key) {
      case '+': case '=': zoomCenter(1.4); break;
      case '-': case '_': zoomCenter(1 / 1.4); break;
      case '0': fit(true); break;
      case '/': e.preventDefault(); $('#search').focus(); break;
      case 'r': case 'R': setTrust(!state.trust); break;
      case 't': case 'T': cycleTheme(); break;
      case 'l': case 'L': if (isPhone()) setNotes($('#strip').classList.contains('closed')); else toggleLegend(); break;
      case 'ArrowLeft': setCam({ k: state.cam.k, x: state.cam.x + 80, y: state.cam.y }, true); break;
      case 'ArrowRight': setCam({ k: state.cam.k, x: state.cam.x - 80, y: state.cam.y }, true); break;
      case 'ArrowUp': setCam({ k: state.cam.k, x: state.cam.x, y: state.cam.y + 80 }, true); break;
      case 'ArrowDown': setCam({ k: state.cam.k, x: state.cam.x, y: state.cam.y - 80 }, true); break;
      default: return;
    }
  });

  // ═══════════════════════════════════════════════════════════════════════
  // PANELS: toolbar, sheet column, legend, keynotes, title block, inspector
  // ═══════════════════════════════════════════════════════════════════════
  /** Small inline SVG for a status symbol, using the canvas classes. */
  function symSvg(status, w, h) {
    const W = w || 22; const H = h || 18;
    const s = Math.min(W, H) - 6;
    const x = (W - s) / 2; const y = (H - s) / 2;
    let out = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><rect x="' + x + '" y="' + y + '" width="' + s + '" height="' + s + '" class="sym ' + symClass(status) + '"/>';
    if (status === 'blocked') out += '<path d="M' + (x - 2) + ',' + (y - 2) + 'L' + (x + s + 2) + ',' + (y + s + 2) + 'M' + (x + s + 2) + ',' + (y - 2) + 'L' + (x - 2) + ',' + (y + s + 2) + '" class="redx" style="stroke-width:1.8"/>';
    return out + '</svg>';
  }
  function tickSvg(st) {
    const p = tickPaths([[st]], 3, 2, 14, 9, 0, 0);
    return '<svg viewBox="0 0 20 13" aria-hidden="true">' + (p.f ? '<path d="' + p.f + '" class="tk-f"/>' : '') + (p.o ? '<path d="' + p.o + '" class="tk-o"/>' : '') + (p.b ? '<path d="' + p.b + '" class="tk-b"/>' : '') + (p.n ? '<path d="' + p.n + '" class="tk-n"/>' : '') + '</svg>';
  }
  function dimBarSvg(v, on) {
    const x1 = 4 + v * 92;
    return '<svg viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true"><path d="M4,3V14M96,3V14" stroke="var(--ink-3)" stroke-width="1" vector-effect="non-scaling-stroke"/><path d="M4,9H' + r2(x1) + '" stroke="' + (on ? 'var(--sel)' : 'var(--ink)') + '" stroke-width="' + (on ? 2.4 : 1.6) + '" vector-effect="non-scaling-stroke"/><path d="M' + r2(x1) + ',9H96" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/><path d="M' + r2(x1) + ',4V14" stroke="' + (on ? 'var(--sel)' : 'var(--ink)') + '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
  }

  function buildChrome() {
    const P = BP.product;
    $('#brand-ver').textContent = 'v' + P.version;
    // sheet tabs (toolbar + phone footer)
    [['#sheets-bar', true], ['#sheets-foot', false]].forEach(([sel, desk]) => {
      $(sel).innerHTML = LENSES.map((l) => '<button type="button" class="sheet-tab" data-lens="' + l.id + '" aria-pressed="' + (l.id === state.lens) + '" title="' + l.discipline + ' sheet · ' + l.name + ' lens (' + l.key + ')"><span class="no">' + l.sheet + '</span><span class="nm">' + (desk ? l.name : l.short) + '</span>' + (desk ? '<kbd>' + l.key + '</kbd>' : '') + '</button>').join('');
    });
    $$('[data-lens]').forEach((b) => b.addEventListener('click', () => setLens(b.getAttribute('data-lens'))));
    // status chips: schedule rows on desktop, a chip strip on phone
    const roll = productRoll;
    const chipHtml = BP.STATUS_ORDER.map((s) => '<button type="button" class="chip" data-status="' + s + '" aria-pressed="false">' + symSvg(s) + '<span><span class="l1">' + esc(STATUS_LABEL[s]) + '</span><span class="l2">' + esc(STATUS_TERMS[s]) + '</span></span><span class="c">' + roll.byStatus[s] + '</span></button>').join('');
    $('#chips-strip').innerHTML = chipHtml;
    $('#chips-row').innerHTML = chipHtml;
    $$('.chip').forEach((c) => c.addEventListener('click', () => {
      const s = c.getAttribute('data-status');
      if (state.statuses.has(s)) state.statuses.delete(s); else state.statuses.add(s);
      applyFilters();
    }));
    $('#att-n').innerHTML = roll.attention + '<small>of ' + roll.count + '</small>';
    $('#rev-n').innerHTML = TRUST_COUNT + '<small>agent work</small>';
    $('#trust-n').textContent = TRUST_COUNT;
    // keynotes
    const kn = [];
    FX.forEach((rec) => {
      if (!rec.keynote) return;
      const f = rec.f;
      const why = f.status === 'blocked' ? f.blockedReason : (f.note || 'Reviewer asked for changes.');
      kn.push('<li><button type="button" data-goto="' + f.id + '"><span class="kn-n">' + rec.keynote + '</span><span><span class="kn-t"><b>' + rec.tag + '</b>' + esc(f.name) + '</span><span class="kn-d"><em>' + (f.status === 'blocked' ? 'BLOCKED' : 'CHANGES REQUESTED') + '</em> · ' + esc(why) + '</span></span></button></li>');
    });
    $('#keynotes').innerHTML = kn.join('');
    // title block
    $('#tb-proj').textContent = P.name.toUpperCase();
    $('#tb-sub').textContent = P.tagline + ' · v' + P.version + ' → v' + P.nextVersion;
    $('#tb-date').textContent = BP.data.meta.asOf;
    // phone summary line
    $('#foot-sum').innerHTML = '<b>' + esc(P.name.toUpperCase()) + ' ' + esc(P.version) + '</b> · ' + DIMS.map((d) => d.short.toUpperCase() + ' ' + Math.round(roll.dims[d.id] * 100)).join(' · ') + ' · <span class="att">▲' + roll.attention + '</span>';
    // delegated clicks
    document.addEventListener('click', (e) => {
      const go = e.target.closest && e.target.closest('[data-goto]');
      if (go) { if (isPhone()) setNotes(false); selectFeature(go.getAttribute('data-goto'), { fly: true }); return; }
      const gm = e.target.closest && e.target.closest('[data-gomod]');
      if (gm) { selectModule(gm.getAttribute('data-gomod'), true); return; }
      const act = e.target.closest && e.target.closest('[data-act]');
      if (act) {
        const a = act.getAttribute('data-act');
        if (a === 'zoom-in') zoomCenter(1.4);
        else if (a === 'zoom-out') zoomCenter(1 / 1.4);
        else if (a === 'fit') fit(true);
      }
    });
    $('#trust-toggle').addEventListener('click', () => setTrust(!state.trust));
    $('#theme-toggle').addEventListener('click', cycleTheme);
    $('#legend-toggle').addEventListener('click', toggleLegend);
    $('#legend-btn').addEventListener('click', () => setNotes($('#strip').classList.contains('closed')));
    $('#strip-close').addEventListener('click', () => setNotes(false));
    $('#scrim').addEventListener('click', () => setNotes(false));
    $('#insp-close').addEventListener('click', clearSelection);
    const search = $('#search');
    search.addEventListener('input', () => { state.query = search.value; applyFilters(); });
    search.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      state.query = search.value;
      applyFilters();
      const m = firstMatch();
      if (m) { flyToFeature(m.f.id, LV.ROOM + 0.25); search.blur(); }
    });
  }

  function updateChrome() {
    const L = LENS[state.lens];
    $$('[data-lens]').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-lens') === state.lens)));
    $('#tb-title').innerHTML = esc(L.title.split(' · ')[0]) + '<br>' + esc(L.name);
    $('#tb-num').textContent = L.sheet;
    $('#comp-aside').textContent = 'sheet ' + L.sheet;
    $('#legend-aside').textContent = L.sheet + ' · ' + L.discipline;
    const roll = productRoll;
    $('#comp').innerHTML = DIMS.map((d) => {
      const on = state.lens === d.id;
      return '<div class="comp-row' + (on ? ' on' : '') + '"><span class="k">' + d.short.toUpperCase() + '</span>' + dimBarSvg(roll.dims[d.id], on) + '<span class="v">' + pct(roll.dims[d.id]) + '</span></div>';
    }).join('') + '<div class="comp-row' + (state.lens === 'overall' ? ' on' : '') + '"><span class="k">OVR</span>' + dimBarSvg(roll.overall, state.lens === 'overall') + '<span class="v">' + pct(roll.overall) + '</span></div>';
    renderLegend();
  }

  function lg(svg, t, d) {
    return '<div class="lg"><svg viewBox="0 0 40 26" aria-hidden="true">' + svg + '</svg><span class="t">' + t + (d ? '<span class="d">' + d + '</span>' : '') + '</span></div>';
  }
  function renderLegend() {
    const sq = (cls, extra) => '<rect x="10" y="4" width="18" height="18" class="sym ' + cls + '"/>' + (extra || '');
    let h = '<div class="lg-sec">Construction status</div>';
    h += lg(sq('sym-live'), 'Live', 'Existing construction: heavy outline, solid poche');
    h += lg(sq('sym-ready'), 'Ready', 'Built, awaiting release: light fill');
    h += lg(sq('sym-build'), 'In build', 'New construction: amber hatch');
    h += lg(sq('sym-plan'), 'Planned', 'Future work: dashed, no fill');
    h += lg(sq('sym-block', '<path d="M7,1L31,25M31,1L7,25" class="redx" style="stroke-width:1.8"/>'), 'Blocked', 'Redline X with a leader to its keynote');
    const L = state.lens;
    h += '<div class="lg-sec">' + LENS[L].sheet + ' · ' + LENS[L].discipline + ' layer</div>';
    if (L === 'overall') {
      h += lg('<path d="' + tickPaths([['done', 'done', 'partial', 'todo'], ['done', 'partial', 'todo', 'na'], ['partial', 'todo', 'blocked', 'todo']], 4, 3, 6, 4.6, 2.4, 2.6).f + '" class="tk-f"/><path d="' + tickPaths([['done', 'done', 'partial', 'todo'], ['done', 'partial', 'todo', 'na'], ['partial', 'todo', 'blocked', 'todo']], 4, 3, 6, 4.6, 2.4, 2.6).o + '" class="tk-o"/><path d="' + tickPaths([['done', 'done', 'partial', 'todo'], ['done', 'partial', 'todo', 'na'], ['partial', 'todo', 'blocked', 'todo']], 4, 3, 6, 4.6, 2.4, 2.6).b + '" class="tk-b"/><path d="' + tickPaths([['done', 'done', 'partial', 'todo'], ['done', 'partial', 'todo', 'na'], ['partial', 'todo', 'blocked', 'todo']], 4, 3, 6, 4.6, 2.4, 2.6).n + '" class="tk-n"/>', 'Fixture schedule', 'Rows Dev, Ops, Biz; four facets each');
      h += lg('<path d="' + tickPaths([['done']], 6, 8, 12, 9, 0, 0).f + '" class="tk-f"/><path d="' + tickPaths([['partial']], 22, 8, 12, 9, 0, 0).f + tickPaths([['partial']], 22, 8, 12, 9, 0, 0).o + '" class="tk-f" style="stroke:var(--ink-2);stroke-width:.8"/>', 'Done · Partial', 'Filled tick · half-filled tick');
      h += lg('<path d="' + tickPaths([['todo']], 6, 8, 12, 9, 0, 0).o + '" class="tk-o"/><path d="' + tickPaths([['blocked']], 22, 8, 12, 9, 0, 0).b + '" class="tk-b"/>', 'To do · Blocked', 'Open tick · red tick; a dash marks n/a');
    } else if (L === 'dev') {
      h += lg('<path d="M10,22V4H28V22Z" class="frame-fill" style="clip-path:inset(40% 0 0 0)"/><path d="M10,4H28V22H10Z" class="frame"/><path d="M10,4L28,22M28,4L10,22" class="brace"/><rect x="8" y="2" width="4" height="4" class="col"/><rect x="26" y="2" width="4" height="4" class="col"/><rect x="8" y="20" width="4" height="4" class="col"/><rect x="26" y="20" width="4" height="4" class="col"/>', 'Braced bay', 'Tests done: X-bracing. Hatch rises with dev completion');
      h += lg('<path d="M10,22L28,4" class="brace"/><path d="M10,4H28V22H10Z" class="frame"/>', 'Single brace', 'Tests partial');
      h += lg('<path d="M16,4H34L28,22H10Z" class="frame unbraced"/>', 'Unbraced, racked', 'No tests yet: the frame leans');
      h += lg('<path d="M20,2V24" class="grid-line" style="vector-effect:none"/><circle cx="20" cy="13" r="8" class="grid-bub"/><text x="20" y="16.5" class="t-grid" style="font-size:10px">1</text>', 'Column line', 'Structural grid on the zone walls');
    } else if (L === 'ops') {
      h += lg('<path d="M4,6H36M4,6V24" class="trunk"/><rect x="0" y="2" width="8" height="8" class="riser"/>', 'Riser and trunk', 'Each room feeds its fixtures');
      h += lg('<circle cx="12" cy="13" r="8" class="outlet on"/><path d="M28,5A8,8 0 0 0 28,21Z" class="half"/><circle cx="28" cy="13" r="8" class="outlet" style="fill:none"/>', 'Deployed · Staging', 'Solid outlet · half outlet on a dashed drop');
      h += lg('<circle cx="20" cy="13" r="8" class="outlet off"/>', 'Unpowered', 'Not deployed: open outlet, no run');
      h += lg('<path d="M2,13H38" class="branch"/><circle cx="9" cy="13" r="4" class="ft done"/><path d="M20,8L25,13L20,18L15,13Z" class="ft partial"/><rect x="28" y="9" width="8" height="8" class="ft"/>', 'Fittings', 'Observability ○, security review ◇, runbook □');
    } else {
      h += lg('<rect x="2" y="3" width="36" height="20" class="wash-hi" style="stroke:var(--ink);stroke-width:1"/>', 'In use', 'Room wash: adoption at or above half');
      h += lg('<rect x="2" y="3" width="36" height="20" class="wash-mid" style="stroke:var(--ink);stroke-width:1"/>', 'Partly adopted', 'Adoption between 30 and 50%');
      h += lg('<rect x="2" y="3" width="36" height="20" class="wash-lo" style="stroke:var(--ink);stroke-width:1"/>', 'Low adoption', 'Below 30%: program unproven');
      h += lg('<path d="M20,13L20,3A10,10 0 0 1 30,13Z" class="q done"/><path d="M20,13L30,13A10,10 0 0 1 20,23Z" class="q partial"/><circle cx="20" cy="13" r="10" class="datum"/><path d="M7,13h26M20,0v26" class="datum-x"/>', 'Program datum', 'Quarters: value ↗, docs ↘, packaging ↙, adoption ↖');
      h += lg('<rect x="2" y="9" width="36" height="7" class="gauge-o"/><rect x="2" y="9" width="24" height="7" class="gauge-f"/>', 'Usage gauge', 'Share of merchants using it');
    }
    if (L !== 'overall') h += lg('<path d="M2,5H38M2,21H38" class="room-wall" style="opacity:.42"/><path d="M2,9H38M2,17H38" class="room-wall-in" style="opacity:.42"/>', 'Screened base', 'Walls drawn faint so this layer reads first');
    h += '<div class="lg-sec">Annotations</div>';
    h += lg('<circle cx="20" cy="13" r="8" class="kn-c"/><text x="20" y="16.4" class="t-kn" style="font-size:9.5px">3</text>', 'Redline keynote', 'Needs attention: blocked or changes requested');
    h += lg('<rect x="12" y="5" width="16" height="16" class="sym sym-build"/><path d="M9,12V3H17M23,3H31V12M31,15V24H23M17,24H9V15" class="att-mark" style="stroke-width:1.8"/>', 'Redline corners', 'A reviewer asked for changes');
    h += lg('<path d="' + cloudD(4, 3, 32, 20, 8) + '" class="cloud"/><path d="M20,7L26,18H14Z" class="delta"/><text x="20" y="16.6" class="t-delta" style="font-size:6.4px">A</text>', 'Revision cloud', 'AI review overlay: agent (A) or pair (P) work awaiting a human. Filled ▲ = changes requested');
    h += lg('<path d="M3,20H37" class="dim-line"/><path d="M3,20H26" class="dim-line" style="stroke-width:2"/><path d="M0,23l6,-6M23,23l6,-6M34,23l6,-6" class="dim-tick"/>', 'Dimension string', 'Zone completion measured along its wall');
    h += lg('<path d="M4,20Q20,0 34,14" class="lnk"/><path d="M4,24Q22,12 34,22" class="lnk dep-in"/>', 'References', 'Solid: depends on. Dashed: required by');
    h += lg('<circle cx="20" cy="13" r="10" class="rtag"/><text x="20" y="16" class="t-rtag" style="font-size:7.5px">C-03</text>', 'Room tag', 'Zone letter and room number');
    h += lg('<rect x="2" y="9" width="14" height="8" class="sym sym-live" style="stroke-width:.8"/><rect x="16" y="9" width="8" height="8" class="sym sym-build" style="stroke-width:.8"/><rect x="24" y="9" width="10" height="8" class="sym sym-plan" style="stroke-width:.8"/><rect x="2" y="9" width="36" height="8" class="zbar-o"/>', 'Zone status bar', 'Share of the zone\'s fixtures by status');
    $('#legend').innerHTML = h;
  }

  function toggleLegend() {
    state.legendOpen = !state.legendOpen;
    $('#legend-toggle').setAttribute('aria-expanded', String(state.legendOpen));
    $('#legend').hidden = !state.legendOpen;
  }
  function setNotes(open) {
    if (!isPhone()) return;
    $('#strip').classList.toggle('closed', !open);
    $('#strip').setAttribute('aria-hidden', String(!open));
    $('#legend-btn').setAttribute('aria-expanded', String(open));
    $('#scrim').classList.toggle('on', open);
    if (open) clearSelection();
  }

  // theme: system > light > dark
  const THEME_ICONS = {
    system: '<circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 2.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/>',
    light: '<circle cx="9" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 1.5v2.3M9 14.2v2.3M1.5 9h2.3M14.2 9h2.3M3.7 3.7l1.6 1.6M12.7 12.7l1.6 1.6M3.7 14.3l1.6-1.6M12.7 5.3l1.6-1.6" stroke="currentColor" stroke-width="1.4"/>',
    dark: '<path d="M13.8 11.6A6.2 6.2 0 0 1 6.4 4.2a6.2 6.2 0 1 0 7.4 7.4z" fill="currentColor"/>',
  };
  function applyTheme() {
    if (state.theme === 'system') ROOT.removeAttribute('data-theme');
    else ROOT.setAttribute('data-theme', state.theme);
    $('#theme-icon').innerHTML = THEME_ICONS[state.theme];
    const lbl = { system: 'AUTO', light: 'LIGHT', dark: 'DARK' }[state.theme];
    $('#theme-lbl').textContent = lbl;
    $('#theme-toggle').setAttribute('aria-label', 'Theme: ' + (state.theme === 'system' ? 'follows system' : state.theme) + '. Click to change (T)');
  }
  function cycleTheme() {
    state.theme = { system: 'light', light: 'dark', dark: 'system' }[state.theme];
    try { localStorage.setItem('bp-cyanotype-theme', state.theme); } catch (err) { /* storage unavailable */ }
    applyTheme();
  }

  // inspector
  function openInspector() {
    const insp = $('#inspector');
    insp.classList.remove('closed');
    insp.setAttribute('aria-hidden', 'false');
  }
  function closeInspector() {
    const insp = $('#inspector');
    insp.classList.add('closed');
    insp.setAttribute('aria-hidden', 'true');
  }
  function refBtn(f, rel) {
    const rec = FX.get(f.id);
    return '<button type="button" class="ref" data-goto="' + f.id + '">' + symSvg(f.status, 18, 14) + '<span class="nm"><span class="see">SEE ' + rec.tag + '</span> ' + esc(f.name) + '</span><span class="rm">' + rec.room.code + (rel ? '' : '') + '</span></button>';
  }
  function renderInspector() {
    const body = $('#insp-body');
    if (!state.sel) return;
    if (state.sel.type === 'feature') {
      const rec = FX.get(state.sel.id);
      const f = rec.f;
      const room = rec.room;
      const wing = room.wing;
      const rel = f.release ? BP.release(f.release) : null;
      const team = BP.team(f.owner);
      $('#insp-kick').textContent = 'Fixture schedule · ' + LENS[state.lens].sheet;
      let h = '<div class="ins-title"><div class="ins-callout" aria-hidden="true"><span>' + rec.tag.slice(2) + '</span><small>' + room.code + '</small></div><div><div class="crumb">ZONE ' + wing.letter + ' · <button type="button" data-gomod="' + room.m.id + '" aria-label="Open room ' + esc(room.m.name) + '">' + esc(wing.d.name.toUpperCase()) + ' › ' + room.code + ' ' + esc(room.m.name.toUpperCase()) + '</button></div><h2 class="ins-name">' + esc(f.name) + '</h2><div class="crumb">' + rec.tag + ' · ' + esc(f.id) + '</div></div></div>';
      h += '<p class="ins-sum">' + esc(f.summary) + '</p>';
      if (f.blockedReason) h += '<div class="rl-note"><div class="h"><span class="kn-n">' + rec.keynote + '</span>BLOCKED</div><p>' + esc(f.blockedReason) + '</p></div>';
      else if (f.review === 'changes') h += '<div class="rl-note"><div class="h"><span class="kn-n">' + rec.keynote + '</span>CHANGES REQUESTED</div><p>' + esc(f.note || 'A reviewer asked for changes to the latest work.') + '</p></div>';
      if (f.note && f.review !== 'changes') h += '<div class="pl-note"><div class="h">NOTE</div><p>' + esc(f.note) + '</p></div>';
      const reviewTxt = { approved: 'Approved', pending: 'Pending', changes: 'Changes requested', none: 'Not reviewed' }[f.review];
      h += '<div class="kv">';
      h += '<div><span class="k">Status</span><span class="v">' + symSvg(f.status, 18, 16) + esc(STATUS_LABEL[f.status]) + '</span></div>';
      h += '<div><span class="k">Priority</span><span class="v">' + esc(f.priority) + '</span></div>';
      h += '<div><span class="k">Release</span><span class="v">' + (rel ? esc(rel.label) + ' <small>' + esc(rel.state) + ' · ' + esc(rel.date) + '</small>' : 'Unscheduled') + '</span></div>';
      h += '<div><span class="k">Owner</span><span class="v">' + esc(team ? team.name : f.owner) + ' <small>' + (team && team.kind === 'agent' ? 'agent crew' : 'human squad') + '</small></span></div>';
      h += '<div><span class="k">Built by</span><span class="v">' + esc(f.builtBy === 'pair' ? 'Pair (agent + human)' : f.builtBy === 'agent' ? 'Agent' : 'Human') + '</span></div>';
      h += '<div><span class="k">Human review</span><span class="v' + '">' + (rec.trust ? '<span class="warn">▲ ' + esc(reviewTxt) + '</span>' : esc(reviewTxt)) + '</span></div>';
      h += '<div><span class="k">Updated</span><span class="v">' + esc(f.updatedAt) + '</span></div>';
      h += '<div><span class="k">' + LENS[state.lens].short + ' score</span><span class="v">' + pct(BP.lensValue(f, state.lens)) + '</span></div>';
      h += '</div>';
      h += '<h3 class="ins-h">Fixture schedule <span>overall ' + pct(BP.featureScore(f)) + '</span></h3><table class="ruled"><tbody>';
      DIMS.forEach((d) => {
        h += '<tr class="dh"><th colspan="3">' + esc(d.label) + '<span class="q">' + pct(BP.dimScore(f, d.id)) + '</span></th></tr>';
        d.facets.forEach((fc) => {
          const st = f.dims[d.id][fc.id];
          h += '<tr><td class="fl">' + esc(fc.label) + '</td><td class="mk">' + tickSvg(st) + '</td><td class="st ' + st + '">' + esc(FACET_LABEL[st]) + '</td></tr>';
        });
      });
      h += '</tbody></table>';
      const m = f.metrics;
      const mv = (v, suf) => (v == null ? '<span class="v none">—</span>' : '<span class="v">' + v + suf + '</span>');
      h += '<h3 class="ins-h">Metrics</h3><div class="metrics"><div><span class="k">TEST COVERAGE</span>' + mv(m.coverage, '%') + '</div><div><span class="k">UPTIME 30D</span>' + mv(m.uptime, '%') + '</div><div><span class="k">ADOPTION</span>' + mv(m.adoption, '%') + '</div></div>';
      const deps = BP.dependencies(f);
      const dnts = BP.dependents(f);
      h += '<h3 class="ins-h">References <span>' + deps.length + ' in · ' + dnts.length + ' out</span></h3>';
      h += '<div class="ref-h">Depends on</div><div class="refs">' + (deps.length ? deps.map((d) => refBtn(d)).join('') : '<div class="ref-empty">No dependencies.</div>') + '</div>';
      h += '<div class="ref-h">Required by</div><div class="refs">' + (dnts.length ? dnts.map((d) => refBtn(d)).join('') : '<div class="ref-empty">Nothing depends on this yet.</div>') + '</div>';
      body.innerHTML = h;
    } else {
      const room = ROOMS.get(state.sel.id);
      const m = room.m;
      const roll = room.roll;
      const team = BP.team(m.owner);
      $('#insp-kick').textContent = 'Room schedule · ' + LENS[state.lens].sheet;
      let h = '<div class="ins-title"><div class="ins-callout" aria-hidden="true"><span>' + room.code.split('-')[1] + '</span><small>ZONE ' + room.wing.letter + '</small></div><div><div class="crumb">ZONE ' + room.wing.letter + ' · ' + esc(room.wing.d.name.toUpperCase()) + '</div><h2 class="ins-name">' + esc(m.name) + '</h2><div class="crumb">' + room.code + ' · ' + esc(m.code) + ' · ' + esc(team ? team.name : m.owner) + ' · ' + esc(m.surfaces.join(', ')) + '</div></div></div>';
      h += '<p class="ins-sum">' + esc(m.summary) + '</p>';
      h += '<div class="mod-sum">' + BP.STATUS_ORDER.map((s) => '<div>' + symSvg(s, 18, 16) + '<span class="c">' + roll.byStatus[s] + '</span><span class="k">' + esc(STATUS_LABEL[s]) + '</span></div>').join('') + '</div>';
      h += '<h3 class="ins-h">Completion <span>overall ' + pct(roll.overall) + '</span></h3><div class="comp">' + DIMS.map((d) => '<div class="comp-row' + (state.lens === d.id ? ' on' : '') + '"><span class="k">' + d.short.toUpperCase() + '</span>' + dimBarSvg(roll.dims[d.id], state.lens === d.id) + '<span class="v">' + pct(roll.dims[d.id]) + '</span></div>').join('') + '</div>';
      const nTrust = room.cells.filter((c) => c.trust).length;
      h += '<div class="redlines"><div><span class="k">ATTENTION</span><span class="v">' + roll.attention + '</span></div><div><span class="k">AWAITING REVIEW</span><span class="v">' + nTrust + '<small>agent work</small></span></div></div>';
      h += '<h3 class="ins-h">Fixtures <span>' + room.n + ' · ' + LENS[state.lens].short + ' score</span></h3><div class="refs">';
      room.cells.forEach((rec) => {
        const f = rec.f;
        h += '<button type="button" class="ref" data-goto="' + f.id + '">' + symSvg(f.status, 18, 14) + '<span class="nm"><span class="see">' + rec.tag + '</span> ' + esc(f.name) + (rec.keynote ? ' <span class="kn-n" style="display:inline-block;width:15px;height:15px;line-height:15px;font-size:8.5px;vertical-align:1px">' + rec.keynote + '</span>' : '') + '</span><span class="rm">' + pct(BP.lensValue(f, state.lens)) + '</span></button>';
      });
      h += '</div>';
      body.innerHTML = h;
    }
    body.scrollTop = 0;
  }

  // ═══════════════════════════════════════════════════════════════════════
  // BOOT
  // ═══════════════════════════════════════════════════════════════════════
  function build() {
    FX.forEach((rec) => { rec.el = null; });
    ROOMS.clear();
    computeLayout();
    renderAll();
    markSelection();
    applyFilters();
    plan.classList.toggle('trust', state.trust);
    commit();
  }
  function boot() {
    try { const t = localStorage.getItem('bp-cyanotype-theme'); if (t === 'light' || t === 'dark' || t === 'system') state.theme = t; } catch (err) { /* storage unavailable */ }
    applyTheme();
    buildChrome();
    build();
    updateChrome();
    if (isPhone()) { $('#strip').classList.add('closed'); $('#strip').setAttribute('aria-hidden', 'true'); }
    fit(false);
    let wasPhone = isPhone();
    barW = $('#scalebar').clientWidth || 180;
    window.addEventListener('resize', () => {
      barW = $('#scalebar').clientWidth || barW;
      scaleKey = '';
      const ph = isPhone();
      if (ph !== wasPhone) {
        $('#strip').classList.toggle('closed', ph);
        $('#scrim').classList.remove('on');
        wasPhone = ph;
      }
      $('#search').placeholder = ph ? 'Find' : 'Find fixture';
      // a tall screen gets a tall plan: rebuild when the orientation class flips
      if ((targetAspect() < 1) !== PLAN.portrait) { build(); state.touched = false; }
      if (!state.touched) fit(false); else setCamNow(state.cam);
    });
    $('#search').placeholder = isPhone() ? 'Find' : 'Find fixture';
    // Test and demo hooks.
    window.__bp = {
      select: (id) => selectFeature(id, { fly: true }),
      module: (id) => selectModule(id, true),
      lens: setLens,
      trust: setTrust,
      zoomTo: (k) => { const a = visibleArea(); const c = state.cam; const px = a.w / 2; const py = a.h / 2; setCam({ k, x: px - (px - c.x) * k / c.k, y: py - (py - c.y) * k / c.k }, true); commit(); },
      flyRoom: (id) => flyToRect(ROOMS.get(id), 24),
      flyZone: (id) => flyToRect(WINGS.find((w) => w.d.id === id).rect, 16),
      flyFeature: (id, k) => flyToFeature(id, k),
      state: () => ({ lens: state.lens, k: state.cam.k, level: state.level, sel: state.sel }),
    };
  }
  let booted = false;
  let fontsSettled = false;
  function start() {
    if (booted) return;
    booted = true;
    fontsSettled = !document.fonts || document.fonts.status === 'loaded';
    boot();
  }
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, new Promise((res) => setTimeout(res, 1500))]).then(start);
  if (document.fonts && document.fonts.addEventListener) {
    // fonts that arrive after boot change text widths: re-letter the plan once
    document.fonts.addEventListener('loadingdone', () => {
      if (!booted || fontsSettled) return;
      fontsSettled = true;
      build();
      if (!state.touched) fit(false);
    });
  }
})();
</script>
</body>
</html>
