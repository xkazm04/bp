<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyanotype Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one drawing sheet. The plan fills the stage, a ruled sheet column on the right carries the schedule, legend, keynotes and title block, and the four lenses flip between sheets of the set (A-101, S-201, M-301, B-401). */
:root {
  /* paper and ink: whiteprint (diazo) */
  --paper: #f1f5f8;
  --paper-2: #e6edf2;
  --paper-3: #d6e1ea;
  --ink: #12284a;
  --ink-2: #33598a;
  --ink-3: #6a83a1;
  --ink-4: #a8b9cb;
  --poche: #234470;
  --tint: rgba(35, 68, 112, 0.17);
  --tint-2: rgba(35, 68, 112, 0.06);
  --grid-minor: rgba(18, 40, 74, 0.05);
  --grid-major: rgba(18, 40, 74, 0.1);
  --hatch: #4b6c95;
  --plate: rgba(241, 245, 248, 0.94);
  /* colored pencil on the print */
  --red: #c3301c;
  --red-wash: rgba(195, 48, 28, 0.1);
  --amber: #b06d06;
  --amber-wash: rgba(176, 109, 6, 0.13);
  --sel: #0a62c8;
  --sel-wash: rgba(10, 98, 200, 0.11);
  --clear: rgba(0, 0, 0, 0);
  --shadow: rgba(12, 28, 52, 0.2);
  /* lettering */
  --f-letter: 'Saira Condensed', 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif;
  --f-text: 'Barlow Semi Condensed', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --strip-w: 292px;
  --bar-h: 54px;
  --insp-w: 404px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* cyanotype: Prussian-blue paper, chalk linework */
    --paper: #0c2a4b;
    --paper-2: #09223f;
    --paper-3: #143a63;
    --ink: #e7f0f7;
    --ink-2: #9dcbe7;
    --ink-3: #6f9bbf;
    --ink-4: #3d6890;
    --poche: #c9deee;
    --tint: rgba(157, 203, 231, 0.25);
    --tint-2: rgba(157, 203, 231, 0.08);
    --grid-minor: rgba(190, 222, 245, 0.055);
    --grid-major: rgba(190, 222, 245, 0.11);
    --hatch: #9dcbe7;
    --plate: rgba(12, 42, 75, 0.94);
    --red: #ff7f6c;
    --red-wash: rgba(255, 127, 108, 0.16);
    --amber: #f2c25a;
    --amber-wash: rgba(242, 194, 90, 0.16);
    --sel: #79e4ff;
    --sel-wash: rgba(121, 228, 255, 0.15);
    --shadow: rgba(0, 8, 20, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c2a4b;
  --paper-2: #09223f;
  --paper-3: #143a63;
  --ink: #e7f0f7;
  --ink-2: #9dcbe7;
  --ink-3: #6f9bbf;
  --ink-4: #3d6890;
  --poche: #c9deee;
  --tint: rgba(157, 203, 231, 0.25);
  --tint-2: rgba(157, 203, 231, 0.08);
  --grid-minor: rgba(190, 222, 245, 0.055);
  --grid-major: rgba(190, 222, 245, 0.11);
  --hatch: #9dcbe7;
  --plate: rgba(12, 42, 75, 0.94);
  --red: #ff7f6c;
  --red-wash: rgba(255, 127, 108, 0.16);
  --amber: #f2c25a;
  --amber-wash: rgba(242, 194, 90, 0.16);
  --sel: #79e4ff;
  --sel-wash: rgba(121, 228, 255, 0.15);
  --shadow: rgba(0, 8, 20, 0.5);
  color-scheme: dark;
}

/* ── Shell ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-text); font-size: 14px; line-height: 1.35; overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: var(--clear); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) var(--strip-w); grid-template-rows: var(--bar-h) minmax(0, 1fr); grid-template-areas: "bar bar" "stage strip"; overflow: hidden; }

/* ── Toolbar: drawing-set header ───────────────────────────────────────── */
#bar { grid-area: bar; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 3px double var(--ink); background: var(--paper); min-width: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand-txt { display: flex; flex-direction: column; line-height: 1; }
.brand-kick { font: 500 10px/1 var(--f-mono); letter-spacing: .16em; color: var(--ink-3); }
.brand-name { font: 700 19px/1.05 var(--f-letter); letter-spacing: .1em; text-transform: uppercase; margin-top: 3px; }
.brand-name b { font: 500 11px var(--f-mono); letter-spacing: .04em; color: var(--ink-2); margin-left: 4px; }
.sheets { display: flex; align-items: stretch; gap: 0; min-width: 0; border: 1px solid var(--ink); }
.sheet-tab { display: flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px; border-right: 1px solid var(--ink); color: var(--ink); white-space: nowrap; transition: background-color .15s, color .15s; }
.sheet-tab:last-child { border-right: 0; }
.sheet-tab .no { font: 600 11.5px var(--f-mono); letter-spacing: .02em; }
.sheet-tab .nm { font: 600 13px var(--f-letter); letter-spacing: .12em; text-transform: uppercase; }
.sheet-tab kbd { font: 500 9.5px var(--f-mono); color: var(--ink-3); border: 1px solid var(--ink-4); padding: 0 3px; line-height: 13px; }
.sheet-tab:hover { background: var(--tint-2); }
.sheet-tab[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.sheet-tab[aria-pressed="true"] kbd { color: var(--paper); border-color: var(--paper); opacity: .7; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.search { position: relative; display: flex; align-items: center; height: 32px; border: 1px solid var(--ink); background: var(--paper); min-width: 0; }
.search svg { width: 15px; height: 15px; margin: 0 6px 0 8px; flex: none; }
.search input { border: 0; background: none; outline: none; width: 190px; min-width: 0; height: 30px; font: 500 13px var(--f-mono); color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
.search:focus-within { outline: 2px solid var(--sel); outline-offset: 1px; }
.search .count { font: 600 10.5px var(--f-mono); color: var(--sel); padding: 0 6px; white-space: nowrap; }
.search kbd { font: 500 10px var(--f-mono); color: var(--ink-3); border: 1px solid var(--ink-4); padding: 0 4px; margin-right: 6px; line-height: 15px; }
.tbtn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; border: 1px solid var(--ink); font: 600 12.5px var(--f-letter); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: var(--ink); background: var(--paper); }
.tbtn svg { width: 16px; height: 16px; flex: none; }
.tbtn .n { font: 600 11px var(--f-mono); letter-spacing: 0; }
.tbtn:hover { background: var(--tint-2); }
.tbtn[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--paper); }
.ibtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--ink); color: var(--ink); background: var(--paper); flex: none; }
.ibtn svg { width: 17px; height: 17px; }
.ibtn:hover { background: var(--tint-2); }
#theme-toggle { width: auto; padding: 0 9px; gap: 6px; display: inline-flex; align-items: center; font: 600 11px var(--f-mono); letter-spacing: .06em; }
#legend-btn { display: none; }

/* ── Stage / canvas ────────────────────────────────────────────────────── */
#stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background-color: var(--paper); }
#viewport.panning { cursor: grabbing; }
#viewport:focus-visible { outline-offset: -3px; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.paper-minor { fill: url(#p-grid-minor); pointer-events: none; }
/* lettering steps aside while the scale is changing and is re-lettered when the zoom stops */
#plan.zooming #world text { display: none; }
@keyframes letter-in { from { opacity: 0; } to { opacity: 1; } }
#plan.relettered #world text { animation: letter-in .18s ease-out; }
.paper-major { fill: url(#p-grid-major); pointer-events: none; }
#world { transition: opacity .16s ease; }
#plan.flip #world { opacity: .12; }

.zoombox { position: absolute; left: 14px; bottom: 14px; display: flex; align-items: stretch; border: 1px solid var(--ink); background: var(--paper); z-index: 3; }
.zoombox button { width: 34px; height: 32px; display: grid; place-items: center; border-right: 1px solid var(--ink); color: var(--ink); }
.zoombox button:hover { background: var(--tint-2); }
.zoombox button svg { width: 15px; height: 15px; }
.zoombox .fit { width: auto; padding: 0 10px; font: 600 12px var(--f-letter); letter-spacing: .14em; }
.zoombox .lvl { display: flex; flex-direction: column; justify-content: center; padding: 0 10px; font: 500 10px/1.25 var(--f-mono); color: var(--ink-2); white-space: nowrap; min-width: 112px; }
.zoombox .lvl b { font-weight: 600; color: var(--ink); letter-spacing: .06em; }

#tip { position: absolute; z-index: 6; pointer-events: none; background: var(--paper); border: 1px solid var(--ink); padding: 6px 9px 7px; max-width: 260px; box-shadow: 3px 3px 0 var(--shadow); }
#tip .t1 { font: 600 10.5px var(--f-mono); color: var(--ink-2); letter-spacing: .04em; }
#tip .t2 { font: 600 15px/1.15 var(--f-letter); color: var(--ink); margin-top: 2px; }
#tip .t3 { font: 500 11px var(--f-mono); color: var(--ink-3); margin-top: 3px; }

/* ── SVG plan: line weights wall > room > fixture ──────────────────────── */
#world path, #world rect, #world circle, #world line, #world polyline, #world polygon { vector-effect: non-scaling-stroke; }
.ext-poche { fill: url(#p-wall); stroke: none; }
.ext-line { fill: none; stroke: var(--ink); stroke-width: 2.6; }
.ext-line-in { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.wall-poche { fill: var(--poche); stroke: var(--ink); stroke-width: 1; }
.jamb { stroke: var(--ink); stroke-width: 1.2; fill: none; }
.door { fill: none; stroke: var(--ink-2); stroke-width: .8; }
.door-leaf { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.room-wall { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.room-wall-in { fill: none; stroke: var(--ink); stroke-width: .6; opacity: .8; }
.hall-axis { stroke: var(--ink-3); stroke-width: .8; stroke-dasharray: 18 4 3 4; fill: none; }
.t-hall { font-family: var(--f-letter); font-weight: 500; font-size: 20px; letter-spacing: .2em; fill: var(--ink-2); text-transform: uppercase; }
.dwg-c { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; }
.dwg-rule { stroke: var(--ink); fill: none; }
.t-dwg { font-family: var(--f-letter); font-weight: 700; font-size: 34px; letter-spacing: .1em; fill: var(--ink); }
.t-dwg-n { font-family: var(--f-letter); font-weight: 700; font-size: 20px; fill: var(--ink); text-anchor: middle; }
.t-dwg-s { font-family: var(--f-mono); font-weight: 500; font-size: 17px; fill: var(--ink-2); }
.t-hall-k { font-family: var(--f-mono); font-weight: 600; font-size: 12px; letter-spacing: .08em; fill: var(--ink-3); }
.floor { fill: var(--clear); stroke: none; pointer-events: all; cursor: pointer; }
.room:hover .floor { fill: var(--tint-2); }
.room.room-sel .floor { fill: var(--sel-wash); }
.room-selframe { fill: none; stroke: var(--sel); stroke-width: 2.2; stroke-dasharray: 9 4; display: none; }
.room.room-sel .room-selframe { display: inline; }
.zone-hdr { cursor: pointer; }
.hex { fill: var(--paper); stroke: var(--ink); stroke-width: 1.8; }
.hex-in { fill: none; stroke: var(--ink); stroke-width: .6; }
.t-hex { font-family: var(--f-letter); font-weight: 700; font-size: 26px; fill: var(--ink); text-anchor: middle; }
.t-zone { font-family: var(--f-letter); font-weight: 700; font-size: 27px; letter-spacing: .08em; fill: var(--ink); }
.t-zone-s { font-family: var(--f-mono); font-weight: 500; font-size: 17px; fill: var(--ink-2); }
.t-zone-x { font-family: var(--f-mono); font-weight: 500; font-size: 12px; fill: var(--ink-3); }
.zbar-o { fill: none; stroke: var(--ink); stroke-width: .9; }
.rtag { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.t-rtag { font-family: var(--f-mono); font-weight: 600; font-size: 13.5px; fill: var(--ink); text-anchor: middle; }
.t-room { font-family: var(--f-letter); font-weight: 600; font-size: 23px; letter-spacing: .05em; fill: var(--ink); }
.t-room-s { font-family: var(--f-mono); font-weight: 500; font-size: 17.5px; fill: var(--ink-2); }
.t-room-s .rv-n { fill: var(--red); font-weight: 600; }
.room.dimroom .t-room, .room.dimroom .t-room-s, .room.dimroom .rtag, .room.dimroom .t-rtag { opacity: .35; }

/* dimension strings */
.dim-ext { stroke: var(--ink-2); stroke-width: .7; fill: none; }
.dim-line { stroke: var(--ink); stroke-width: 1; fill: none; }
.dim-rest { stroke: var(--ink-3); stroke-width: .7; stroke-dasharray: 3 3; fill: none; }
.dim-tick { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.t-dim { font-family: var(--f-letter); font-weight: 600; font-size: 22px; letter-spacing: .07em; fill: var(--ink); }
.t-dim-r { font-family: var(--f-mono); font-weight: 400; font-size: 13px; fill: var(--ink-3); }
.dim-row { transition: opacity .2s; }
#plan.lens-dev .dim-row:not(.dim-dev), #plan.lens-ops .dim-row:not(.dim-ops), #plan.lens-biz .dim-row:not(.dim-biz) { opacity: .28; }
#plan.lens-dev .dim-dev .dim-line, #plan.lens-ops .dim-ops .dim-line, #plan.lens-biz .dim-biz .dim-line { stroke-width: 2; }

/* fixtures: status by drafting convention */
.fx { cursor: pointer; }
.fx-hit, .hdr-hit { fill: var(--clear); stroke: none; pointer-events: all; }
.t-fxtag, .t-fxval, .t-fxname, .t-fxmeta, .t-tkl, .t-room, .t-room-s, .t-zone, .t-zone-s, .t-zone-x, .t-dim, .t-dim-r, .t-unb { paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.t-fxtag, .t-fxval, .t-fxname, .t-fxmeta, .t-tkl, .t-unb { stroke-width: 2.2px; }
.fx > :not(.fx-hit) { pointer-events: none; }
.fx:hover .fx-hover { display: inline; }
.fx-hover { display: none; fill: var(--tint-2); stroke: var(--ink-3); stroke-width: .8; stroke-dasharray: 2 2; }
.sym { stroke: var(--ink); }
.sym-live { fill: var(--poche); stroke-width: 2.2; }
.sym-ready { fill: var(--tint); stroke-width: 1.8; }
.sym-build { fill: url(#p-build); stroke-width: 1.4; }
.sym-plan { fill: none; stroke: var(--ink-2); stroke-width: 1.3; stroke-dasharray: 4 2.5; }
.sym-block { fill: var(--paper); stroke-width: 1.4; }
.redx { stroke: var(--red); stroke-width: 2.2; fill: none; stroke-linecap: round; }
.att-mark { stroke: var(--red); stroke-width: 2.2; fill: none; stroke-linecap: square; }
.leader { stroke: var(--red); stroke-width: 1; fill: none; }
.kn-c { fill: var(--red); stroke: var(--paper); stroke-width: 1; }
.t-kn { font-family: var(--f-mono); font-weight: 700; font-size: 9px; fill: var(--paper); text-anchor: middle; }
.tk-f { fill: var(--ink); }
.tk-o { fill: none; stroke: var(--ink-2); stroke-width: .8; }
.tk-b { fill: var(--red); }
.tk-n { fill: none; stroke: var(--ink-4); stroke-width: 1.1; }
.t-tkl { font-family: var(--f-mono); font-weight: 600; font-size: 6px; fill: var(--ink-3); text-anchor: middle; }
.t-fxtag { font-family: var(--f-mono); font-weight: 600; font-size: 10px; fill: var(--ink); letter-spacing: .02em; }
.t-fxval { font-family: var(--f-mono); font-weight: 500; font-size: 8.5px; fill: var(--ink-2); }
.t-fxname { font-family: var(--f-letter); font-weight: 500; font-size: 10.6px; fill: var(--ink); }
.t-fxmeta { font-family: var(--f-mono); font-weight: 400; font-size: 6.8px; fill: var(--ink-3); }
.st-blocked .t-fxmeta { fill: var(--red); }
.cloud { fill: none; stroke: var(--red); stroke-width: 1.4; }
.delta { fill: var(--paper); stroke: var(--red); stroke-width: 1.3; }
.rv-changes .delta { fill: var(--red); }
.t-delta { font-family: var(--f-mono); font-weight: 700; font-size: 6.8px; fill: var(--red); text-anchor: middle; }
.rv-changes .t-delta { fill: var(--paper); }
.fx-frame { display: none; fill: none; }
.fx.match .fx-frame { display: inline; fill: var(--sel-wash); stroke: var(--sel); stroke-width: 1.6; }
.fx.rel .fx-frame { display: inline; fill: none; stroke: var(--sel); stroke-width: 1.2; stroke-dasharray: 5 3; }
.fx.sel .fx-frame { display: inline; fill: var(--sel-wash); stroke: var(--sel); stroke-width: 2.2; stroke-dasharray: none; }
.fx-grip { display: none; fill: var(--paper); stroke: var(--sel); stroke-width: 1.4; }
.fx.sel .fx-grip { display: inline; }
.fx.dim { opacity: .13; }
#plan.has-sel .fx:not(.sel):not(.rel) { opacity: .4; }
#plan.has-sel .fx.dim:not(.sel):not(.rel) { opacity: .1; }
.fx, .room { transition: opacity .18s; }

/* S-201 structural */
.frame { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.frame.unbraced { stroke: var(--amber); stroke-width: 1.6; }
.frame.planned { stroke: var(--ink-2); stroke-dasharray: 4 2.5; }
.frame-fill { fill: url(#p-struct); stroke: none; }
.brace { stroke: var(--ink); stroke-width: 1.2; fill: none; }
.col { fill: var(--ink); stroke: none; }
.t-unb { font-family: var(--f-mono); font-weight: 700; font-size: 6.4px; fill: var(--amber); letter-spacing: .04em; }
.grid-line { stroke: var(--ink-2); stroke-width: .8; stroke-dasharray: 22 5 3 5; fill: none; }
.grid-bub { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.t-grid { font-family: var(--f-letter); font-weight: 700; font-size: 19px; fill: var(--ink); text-anchor: middle; }

/* M-301 services */
.riser { fill: var(--paper); stroke: var(--ink); stroke-width: 1.3; }
.trunk { stroke: var(--ink-2); stroke-width: 1.6; fill: none; }
.drop { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
.drop.staging, .branch.staging { stroke-dasharray: 3 2; }
.branch { stroke: var(--ink-2); stroke-width: 1.1; fill: none; }
.outlet { stroke: var(--ink); stroke-width: 1.5; fill: var(--paper); }
.outlet.on { fill: var(--poche); }
.outlet.off { stroke: var(--ink-3); stroke-dasharray: 2.5 2; }
.half { fill: var(--poche); stroke: none; }
.ft { stroke: var(--ink); stroke-width: 1; fill: var(--paper); }
.ft.done { fill: var(--ink); }
.ft.partial { fill: url(#p-half); }
.ft.blocked { fill: var(--red); stroke: var(--red); }
.ft.na { stroke: var(--ink-4); stroke-dasharray: 1.5 1.5; }

/* B-401 program */
.wash-hi { fill: url(#p-dots-hi); }
.wash-mid { fill: url(#p-dots-mid); }
.wash-lo { fill: url(#p-dots-lo); }
.datum { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.datum-x { stroke: var(--ink); stroke-width: .8; fill: none; }
.q.done { fill: var(--poche); }
.q.partial { fill: url(#p-half); }
.q.todo, .q.na { fill: none; }
.q.blocked { fill: var(--red); }
.gauge-o { fill: none; stroke: var(--ink-2); stroke-width: .9; }
.gauge-o.none { stroke-dasharray: 2 2; stroke: var(--ink-3); }
.gauge-f { fill: var(--ink-2); }

/* links */
.lnk { fill: none; stroke: var(--sel); stroke-width: 1.8; }
.lnk.dep-in { stroke-dasharray: 6 4; stroke-width: 1.4; }
.lnk-head { fill: var(--sel); stroke: none; }
.lnk-tag { fill: var(--paper); stroke: var(--sel); stroke-width: 1; }
.t-lnk { font-family: var(--f-mono); font-weight: 600; fill: var(--sel); text-anchor: middle; }

/* key plan plates */
.plate { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
.t-plate { font-family: var(--f-letter); font-weight: 700; font-size: 13px; letter-spacing: .1em; fill: var(--ink); text-anchor: middle; }
.t-plate-s { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; fill: var(--ink-2); text-anchor: middle; }
.t-plate-l { font-family: var(--f-letter); font-weight: 700; font-size: 15px; fill: var(--ink); text-anchor: middle; }

/* zoom levels: lv0 key plan, lv1 sheet, lv2 room, lv3 detail */
#plan .lv-s, #plan .lv-r, #plan .lv-d, #plan .lv-k { display: none; }
#plan.lv1 .lv-s, #plan.lv2 .lv-s, #plan.lv3 .lv-s { display: inline; }
#plan.lv2 .lv-r, #plan.lv3 .lv-r { display: inline; }
#plan.lv3 .lv-d { display: inline; }
#plan.lv0 .lv-k { display: inline; }
#plan.lv0 .t-kn, #plan.lv1 .t-kn, #plan.lv0 .t-delta, #plan.lv1 .t-delta { display: none; }
/* lenses: sheets of the set */
.gl { display: none; }
#plan.lens-overall .gl-a, #plan.lens-dev .gl-s, #plan.lens-ops .gl-m, #plan.lens-biz .gl-b { display: inline; }
#g-serv, #g-wash, #g-grid { display: none; }
#plan.lens-ops #g-serv, #plan.lens-biz #g-wash, #plan.lens-dev #g-grid { display: inline; }
#g-base { transition: opacity .2s; }
#plan:not(.lens-overall) #g-base { opacity: .42; }
.rv { display: none; }
#plan.trust .rv { display: inline; }
#plan.trust .fx:not(.trustfx):not(.sel):not(.rel) { opacity: .45; }
#plan.trust .fx.dim:not(.trustfx) { opacity: .13; }

/* ── Sheet column (desktop) / notes sheet (phone) ──────────────────────── */
#strip { grid-area: strip; display: flex; flex-direction: column; min-height: 0; background: var(--paper-2); border-left: 3px double var(--ink); z-index: 4; }
.strip-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.sheet-grab { display: none; }
.sn { border-bottom: 1px solid var(--ink); padding: 10px 14px 12px; }
.sn-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; font: 700 12px var(--f-letter); letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
.sn-h .aside { font: 500 10px var(--f-mono); letter-spacing: .04em; color: var(--ink-3); text-transform: none; }
.sn-h button { display: flex; align-items: center; gap: 6px; font: inherit; letter-spacing: inherit; text-transform: inherit; }
.sn-h button svg { width: 11px; height: 11px; transition: transform .15s; }
.sn-h button[aria-expanded="false"] svg { transform: rotate(-90deg); }
.chip-rows { display: grid; gap: 0; border: 1px solid var(--ink); }
.chip { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid var(--ink-4); text-align: left; color: var(--ink); transition: background-color .12s, opacity .12s; }
.chip:last-child { border-bottom: 0; }
.chip svg { width: 22px; height: 18px; display: block; }
.chip .l1 { font: 600 13.5px/1.05 var(--f-letter); letter-spacing: .1em; text-transform: uppercase; display: block; }
.chip .l2 { font: 400 10px/1.2 var(--f-mono); color: var(--ink-3); display: block; }
.chip .c { font: 600 15px var(--f-mono); }
.chip:hover { background: var(--tint-2); }
.chip[aria-pressed="true"] { background: var(--sel-wash); box-shadow: inset 3px 0 0 var(--sel); }
.chip-rows.filtering .chip[aria-pressed="false"] { opacity: .5; }
.hint { font: 400 10.5px var(--f-mono); color: var(--ink-3); margin: 6px 0 0; }
.comp { display: grid; gap: 7px; }
.comp-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 40px; align-items: center; gap: 8px; }
.comp-row .k { font: 700 12px var(--f-letter); letter-spacing: .12em; }
.comp-row .v { font: 600 13px var(--f-mono); text-align: right; }
.comp-row svg { width: 100%; height: 16px; display: block; }
.comp-row.on .k, .comp-row.on .v { color: var(--sel); }
.redlines { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); margin-top: 10px; }
.redlines > div { padding: 6px 8px; }
.redlines > div + div { border-left: 1px solid var(--ink); }
.redlines .k { font: 600 10px var(--f-mono); letter-spacing: .06em; color: var(--ink-3); display: block; }
.redlines .v { font: 700 22px/1.1 var(--f-letter); color: var(--red); }
.redlines .v small { font: 500 11px var(--f-mono); color: var(--ink-3); margin-left: 4px; }
.legend { display: grid; gap: 4px; }
.lg-sec { font: 600 10px var(--f-mono); letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; margin: 8px 0 2px; }
.lg-sec:first-child { margin-top: 0; }
.lg { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 9px; }
.lg svg { width: 40px; height: 26px; display: block; overflow: visible; }
.lg .t { font: 600 12px/1.15 var(--f-letter); letter-spacing: .08em; text-transform: uppercase; }
.lg .d { font: 400 11px/1.25 var(--f-text); color: var(--ink-3); display: block; letter-spacing: 0; text-transform: none; }
.keynotes { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--ink-4); }
.keynotes li { border-bottom: 1px solid var(--ink-4); }
.keynotes button { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 6px 2px; text-align: left; width: 100%; }
.keynotes button:hover { background: var(--tint-2); }
.kn-n { width: 19px; height: 19px; border-radius: 50%; background: var(--red); color: var(--paper); font: 700 10px/19px var(--f-mono); text-align: center; margin-top: 1px; }
.kn-t { font: 600 13px/1.15 var(--f-letter); letter-spacing: .03em; display: block; }
.kn-t b { font: 600 10.5px var(--f-mono); color: var(--ink-2); margin-right: 5px; letter-spacing: 0; }
.kn-d { font: 400 11.5px/1.3 var(--f-text); color: var(--ink-3); display: block; margin-top: 1px; }
.kn-d em { font-style: normal; color: var(--red); font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .04em; }

/* title block */
.titleblock { flex: none; border-top: 3px double var(--ink); background: var(--paper); font-family: var(--f-mono); }
.tb-row { display: grid; border-bottom: 1px solid var(--ink); }
.tb-row:last-child { border-bottom: 0; }
.tb-cell { padding: 5px 9px 6px; min-width: 0; }
.tb-cell + .tb-cell { border-left: 1px solid var(--ink); }
.tb-k { display: block; font: 500 8.5px var(--f-mono); letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; }
.tb-v { display: block; font: 600 11px/1.25 var(--f-mono); color: var(--ink); letter-spacing: .02em; }
.tb-proj .tb-v { font: 700 21px/1 var(--f-letter); letter-spacing: .16em; margin-top: 2px; }
.tb-proj .sub { font: 400 10.5px/1.3 var(--f-text); color: var(--ink-2); display: block; margin-top: 2px; }
.tb-sheet { grid-template-columns: minmax(0, 1fr) 104px; }
.tb-title { font: 700 14px/1.1 var(--f-letter) !important; letter-spacing: .1em !important; text-transform: uppercase; margin-top: 2px; }
.tb-num { display: block; font: 700 31px/1 var(--f-letter); letter-spacing: .02em; margin-top: 2px; }
.tb-meta { grid-template-columns: 1fr 1fr 1fr; }
.tb-scale { grid-template-columns: minmax(0, 1fr) 54px; align-items: center; }
.tb-scale svg.bar { width: 100%; height: 22px; display: block; margin-top: 3px; }
.tb-scale svg.north { width: 40px; height: 40px; display: block; margin: 0 auto; }
.tb-cell.na { display: flex; align-items: center; justify-content: center; }

/* ── Inspector: detail sheet ───────────────────────────────────────────── */
#inspector { position: absolute; top: var(--bar-h); right: 0; bottom: 0; width: min(var(--insp-w), 100%); z-index: 8; display: flex; flex-direction: column; background: var(--paper); border-left: 3px double var(--ink); box-shadow: -6px 0 0 var(--shadow); transform: translateX(0); transition: transform .22s ease; }
#inspector.closed { transform: translateX(105%); box-shadow: none; visibility: hidden; transition: transform .22s ease, visibility 0s .22s; }
.insp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 9px 16px; border-bottom: 1px solid var(--ink); flex: none; }
.insp-kick { font: 600 10.5px var(--f-mono); letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; }
.insp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 22px; overscroll-behavior: contain; }
.ins-title { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.ins-callout { width: 58px; height: 58px; border: 1.5px solid var(--ink); border-radius: 50%; display: grid; place-items: center; position: relative; }
.ins-callout::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--ink); }
.ins-callout span { font: 700 12px var(--f-mono); position: relative; top: -10px; }
.ins-callout small { font: 600 9px var(--f-mono); color: var(--ink-3); position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; letter-spacing: .06em; }
.ins-name { font: 700 23px/1.08 var(--f-letter); letter-spacing: .02em; margin: 2px 0 4px; text-wrap: balance; }
.crumb { font: 500 10.5px/1.4 var(--f-mono); color: var(--ink-2); letter-spacing: .04em; }
.crumb button { display: inline; text-align: left; text-decoration: underline; text-decoration-color: var(--ink-4); text-underline-offset: 2px; letter-spacing: inherit; }
.crumb button:hover { color: var(--sel); }
.ins-sum { font: 400 14.5px/1.42 var(--f-text); margin: 12px 0 0; color: var(--ink); max-width: 62ch; }
.rl-note { margin-top: 12px; border: 1.5px solid var(--red); padding: 8px 10px; background: var(--red-wash); }
.rl-note .h { font: 700 11px var(--f-mono); letter-spacing: .12em; color: var(--red); display: flex; align-items: center; gap: 7px; }
.rl-note p { margin: 3px 0 0; font: 500 14px/1.38 var(--f-text); color: var(--ink); }
.pl-note { margin-top: 10px; border-left: 3px solid var(--ink-2); padding: 3px 0 3px 10px; }
.pl-note .h { font: 600 10px var(--f-mono); letter-spacing: .12em; color: var(--ink-3); }
.pl-note p { margin: 2px 0 0; font: 400 13.5px/1.38 var(--f-text); }
.ins-h { font: 700 12px var(--f-letter); letter-spacing: .18em; text-transform: uppercase; margin: 20px 0 6px; display: flex; justify-content: space-between; align-items: baseline; }
.ins-h span { font: 500 10px var(--f-mono); letter-spacing: .04em; color: var(--ink-3); text-transform: none; }
.kv { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); margin-top: 14px; }
.kv > div { padding: 5px 8px 6px; border-bottom: 1px solid var(--ink-4); min-width: 0; }
.kv > div:nth-child(odd) { border-right: 1px solid var(--ink-4); }
.kv > div:nth-last-child(-n+2) { border-bottom: 0; }
.kv .k { display: block; font: 500 9px var(--f-mono); letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
.kv .v { display: flex; align-items: center; gap: 6px; font: 600 14px/1.2 var(--f-letter); letter-spacing: .03em; margin-top: 2px; }
.kv .v svg { width: 18px; height: 16px; flex: none; }
.kv .v small { font: 500 10.5px var(--f-mono); color: var(--ink-3); letter-spacing: 0; }
.kv .v .warn { color: var(--red); }
table.ruled { width: 100%; border-collapse: collapse; border: 1px solid var(--ink); font-family: var(--f-mono); font-size: 11.5px; }
table.ruled th, table.ruled td { padding: 4px 7px; text-align: left; border-bottom: 1px solid var(--ink-4); vertical-align: middle; }
table.ruled tr.dh th { background: var(--tint-2); border-bottom: 1px solid var(--ink); border-top: 1px solid var(--ink); font: 700 11.5px var(--f-letter); letter-spacing: .14em; text-transform: uppercase; }
table.ruled tr.dh th .q { float: right; font: 600 11px var(--f-mono); letter-spacing: 0; color: var(--ink-2); }
table.ruled td.fl { font: 500 13.5px var(--f-text); color: var(--ink); }
table.ruled td.mk { width: 26px; padding-right: 0; }
table.ruled td.mk svg { width: 20px; height: 13px; display: block; }
table.ruled td.st { width: 92px; font-weight: 600; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
table.ruled td.st.blocked { color: var(--red); }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--ink); }
.metrics > div { padding: 6px 8px; }
.metrics > div + div { border-left: 1px solid var(--ink-4); }
.metrics .k { display: block; font: 500 9px var(--f-mono); letter-spacing: .12em; color: var(--ink-3); }
.metrics .v { font: 700 20px/1.15 var(--f-letter); }
.metrics .v.none { color: var(--ink-4); }
.refs { display: grid; gap: 0; border-top: 1px solid var(--ink-4); }
.ref { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 9px; align-items: center; text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--ink-4); width: 100%; }
.ref:hover { background: var(--sel-wash); }
.ref .see { font: 600 10.5px var(--f-mono); color: var(--sel); letter-spacing: .04em; white-space: nowrap; }
.ref .nm { font: 600 14px/1.15 var(--f-letter); letter-spacing: .02em; min-width: 0; }
.ref .rm { font: 500 10px var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.ref svg { width: 18px; height: 14px; }
.ref-empty { font: 400 12px var(--f-mono); color: var(--ink-3); padding: 6px 4px; }
.ref-h { font: 600 10px var(--f-mono); letter-spacing: .12em; color: var(--ink-3); margin: 10px 0 3px; text-transform: uppercase; }
.mod-sum { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--ink); margin-top: 12px; }
.mod-sum > div { padding: 5px 4px 6px; text-align: center; }
.mod-sum > div + div { border-left: 1px solid var(--ink-4); }
.mod-sum svg { width: 18px; height: 16px; display: block; margin: 0 auto 2px; }
.mod-sum .c { font: 700 18px/1 var(--f-letter); display: block; }
.mod-sum .k { font: 500 8.5px var(--f-mono); letter-spacing: .08em; color: var(--ink-3); display: block; margin-top: 2px; text-transform: uppercase; }

/* ── Phone furniture ───────────────────────────────────────────────────── */
#chips-row { display: none; }
#foot { display: none; }
.scrim { display: none; }

@media (max-width: 1180px) {
  :root { --strip-w: 260px; }
  .tb-meta .tb-v { font-size: 10px; white-space: nowrap; }
  .tb-meta .tb-cell { padding-left: 7px; padding-right: 4px; }
  .redlines .k { font-size: 9px; letter-spacing: .02em; }
  .sheet-tab .nm { display: none; }
  .search input { width: 150px; }
}
@media (max-width: 860px) {
  :root { --bar-h: 50px; }
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "bar" "chips" "stage" "foot"; }
  #bar { gap: 8px; padding: 0 10px; height: 50px; }
  #bar .sheets, .brand-kick, .search kbd, #trust-toggle .lbl, #theme-toggle .lbl { display: none; }
  .brand svg { width: 26px; height: 26px; }
  .brand-name { font-size: 17px; margin-top: 0; }
  .brand-name b { display: block; margin: 2px 0 0; font-size: 10px; }
  .tools { gap: 6px; flex: 1; justify-content: flex-end; }
  .search { flex: 1; min-width: 0; max-width: 230px; }
  .search input { width: 100%; }
  #legend-btn { display: inline-grid; }
  #theme-toggle { padding: 0; width: 32px; justify-content: center; }
  #chips-row { grid-area: chips; display: flex; gap: 6px; overflow-x: auto; padding: 7px 10px; border-bottom: 1px solid var(--ink); scrollbar-width: none; background: var(--paper); }
  #chips-row::-webkit-scrollbar { display: none; }
  #chips-row .chip { grid-template-columns: 16px auto auto; border: 1px solid var(--ink); padding: 2px 7px 2px 5px; gap: 5px; flex: none; }
  #chips-row .chip:last-child { border-bottom: 1px solid var(--ink); }
  #chips-row .chip svg { width: 16px; height: 14px; }
  #chips-row .chip .l1 { font-size: 12px; letter-spacing: .06em; }
  #chips-row .chip .l2 { display: none; }
  #chips-row .chip .c { font-size: 12px; }
  #chips-row.filtering .chip[aria-pressed="false"] { opacity: .55; }
  .zoombox.desk { display: none; }
  #foot { grid-area: foot; display: block; border-top: 3px double var(--ink); background: var(--paper); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
  .foot-r1 { display: flex; align-items: stretch; border-bottom: 1px solid var(--ink); }
  .foot-r1 .sheets { border: 0; flex: 1; min-width: 0; }
  .foot-r1 .sheet-tab { flex: 1; justify-content: center; padding: 6px 2px; flex-direction: column; gap: 0; }
  .foot-r1 .sheet-tab .nm { display: block; font-size: 10px; letter-spacing: .08em; }
  .foot-r1 .sheet-tab .no { font-size: 11px; }
  .foot-r1 .sheet-tab kbd { display: none; }
  .foot-r1 .zoombox { position: static; border: 0; border-left: 1px solid var(--ink); }
  .foot-r1 .zoombox button { width: 38px; height: auto; }
  .foot-r1 .zoombox button:last-child { border-right: 0; }
  .foot-r1 .zoombox .fit { padding: 0 8px; font-size: 11px; }
  .foot-r2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 10px 5px; font: 500 10.5px var(--f-mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; }
  .foot-r2 b { color: var(--ink); font-weight: 700; }
  .foot-r2 .att { color: var(--red); font-weight: 700; }
  .foot-r2 .sum { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #strip { position: fixed; left: 0; right: 0; bottom: 0; height: min(72%, 600px); border-left: 0; border-top: 3px double var(--ink); z-index: 9; transform: translateY(0); transition: transform .24s ease; box-shadow: 0 -6px 0 var(--shadow); }
  #strip.closed { transform: translateY(104%); visibility: hidden; transition: transform .24s ease, visibility 0s .24s; }
  #strip .titleblock, #strip .sn-sched { display: none; }
  .sheet-grab { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--ink); flex: none; }
  .sheet-grab .h { font: 700 12px var(--f-letter); letter-spacing: .18em; text-transform: uppercase; }
  #inspector { top: auto; left: 0; right: 0; width: auto; height: min(62%, 560px); border-left: 0; border-top: 3px double var(--ink); box-shadow: 0 -6px 0 var(--shadow); }
  #inspector.closed { transform: translateY(104%); }
  .insp-head { padding: 6px 10px 6px 14px; }
  .insp-body { padding: 12px 14px 20px; }
  .ins-name { font-size: 21px; }
  .scrim.on { display: block; position: fixed; inset: 0; z-index: 8; background: var(--clear); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand">
      <svg viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="2" width="26" height="26" fill="none" stroke="var(--ink)" stroke-width="2.4"/><rect x="5" y="5" width="20" height="20" fill="none" stroke="var(--ink)" stroke-width=".8"/><path d="M15 5v9h10" fill="none" stroke="var(--ink)" stroke-width="1.4"/><path d="M5 19h6" fill="none" stroke="var(--ink)" stroke-width="1.4"/><path d="M11 19a6 6 0 0 1 -6 6" fill="none" stroke="var(--ink-2)" stroke-width=".8"/><rect x="18" y="17" width="5" height="5" fill="var(--poche)"/></svg>
      <div class="brand-txt"><span class="brand-kick">APP BLUEPRINT · SET</span><span class="brand-name" id="brand-name">Larkspur<b id="brand-ver"></b></span></div>
    </div>
    <nav class="sheets" id="sheets-bar" aria-label="Drawing sheets"></nav>
    <div class="tools">
      <label class="search" for="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.6" fill="none" stroke="var(--ink)" stroke-width="1.6"/><path d="M10 10l4.4 4.4" stroke="var(--ink)" stroke-width="1.8" fill="none"/></svg>
        <span class="vh">Search fixtures</span>
        <input id="search" type="search" placeholder="Find fixture" autocomplete="off" spellcheck="false">
        <span class="count" id="search-count" aria-live="polite"></span>
        <kbd>/</kbd>
      </label>
      <button class="tbtn" id="trust-toggle" type="button" aria-pressed="false" title="AI review overlay (R)" aria-label="AI review overlay: agent work awaiting a human check (R)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2l6.2 11H1.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.6v3.2" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="11.4" r=".9" fill="currentColor"/></svg>
        <span class="lbl">AI review</span><span class="n" id="trust-n"></span>
      </button>
      <button class="ibtn" id="legend-btn" type="button" aria-label="Legend and sheet notes (L)" aria-expanded="false">
        <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="2.5" width="4" height="4" fill="var(--poche)" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="11" width="4" height="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.4"/><path d="M8.5 4.5h7.5M8.5 13h7.5" stroke="currentColor" stroke-width="1.5"/></svg>

<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════
  // STATE
  // ═══════════════════════════════════════════════════════════════════════
  const BP = window.BP;
  const NS = 'http://www.w3.org/2000/svg';
  const ROOT = document.documentElement;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  const LENSES = [
    { id: 'overall', key: '1', sheet: 'A-101', name: 'Overall', discipline: 'Architectural', title: 'Floor plan · Overall', short: 'OVR' },
    { id: 'dev', key: '2', sheet: 'S-201', name: 'Development', discipline: 'Structural', title: 'Structural plan · Development', short: 'DEV' },
    { id: 'ops', key: '3', sheet: 'M-301', name: 'Operations', discipline: 'Services', title: 'Services plan · Operations', short: 'OPS' },
    { id: 'biz', key: '4', sheet: 'B-401', name: 'Business', discipline: 'Program', title: 'Program plan · Business', short: 'BIZ' },
  ];
  const LENS = {};
  LENSES.forEach((l) => { LENS[l.id] = l; });
  const STATUS_TERMS = {
    live: 'Existing construction',
    ready: 'Built, awaiting release',
    building: 'New construction',
    planned: 'Future work',
    blocked: 'Redline, cannot progress',
  };
  const DIMS = BP.DIMENSIONS;
  const STATUS_LABEL = {};
  BP.STATUSES.forEach((s) => { STATUS_LABEL[s.id] = s.label; });
  const FACET_LABEL = {};
  BP.FACET_STATES.forEach((s) => { FACET_LABEL[s.id] = s.label; });

  // Zoom thresholds (screen px per world unit) for the four levels of detail.
  const LV = { SHEET: 0.36, ROOM: 0.9, DETAIL: 1.4 };
  const LV_NAMES = ['Key plan', 'Sheet', 'Room', 'Detail'];
  const K_MAX = 5;
  // Plan geometry, world units (1 unit = 2 cm on the "building").
  const G = {
    cellW: 110, cellH: 94, cw: 104, ch: 88,
    roomPad: 10, roomHdr: 82, roomGap: 14, roomMinW: 232,
    corridor: 34, ring: 20, wingHdr: 76, wingWall: 16,
    hallWall: 10, hallOpen: 74, ext: 18,
    dimOff: 42, dimStep: 36, gridOff: 34,
    door: 20, entry: 40,
  };
  const STACK = {
    letter: '"Saira Condensed","Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif',
    mono: '"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace',
  };

  const state = {
    lens: 'overall',
    statuses: new Set(),
    query: '',
    trust: false,
    sel: null,               // { type: 'feature' | 'module', id }
    cam: { x: 0, y: 0, k: 0.5 },
    level: -1,
    theme: 'system',
    legendOpen: true,
    touched: false,          // user moved the camera since the last fit
  };

  const FX = new Map();      // feature id -> record
  const ROOMS = new Map();   // module id -> record
  const WINGS = [];          // domain records in display order
  let PLAN = null;           // overall geometry
  const productRoll = BP.productRollup();

  /** Short tag for a feature by display order, e.g. F-047. */
  const fxTag = (i) => 'F-' + String(i + 1).padStart(3, '0');
  const pct = (v) => (v == null ? '—' : Math.round(v * 100) + '%');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r2 = (n) => Math.round(n * 100) / 100;
  const isTrustFlag = (f) => (f.builtBy === 'agent' || f.builtBy === 'pair') && (f.review === 'pending' || f.review === 'changes');
  const isPhone = () => window.matchMedia('(max-width: 860px)').matches;
  const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Feature records: tags, keynote numbers, trust flags.
  let keynoteN = 0;
  BP.features.forEach((f, i) => {
    FX.set(f.id, {
      f, i, tag: fxTag(i),
      att: BP.needsAttention(f),
      keynote: BP.needsAttention(f) ? ++keynoteN : 0,
      trust: isTrustFlag(f),
    });
  });
  const TRUST_COUNT = BP.features.filter(isTrustFlag).length;

  // ═══════════════════════════════════════════════════════════════════════
  // LAYOUT: rooms sized by feature count, row-packed into wings and two bands
  // ═══════════════════════════════════════════════════════════════════════
  const mctx = document.createElement('canvas').getContext('2d');
  /** Width of a string in world units for a font spec { w, s, f, ls(em), up }. */
  function measure(text, spec) {
    mctx.font = spec.w + ' ' + spec.s + 'px ' + spec.f;
    const t = spec.up ? String(text).toUpperCase() : String(text);
    return mctx.measureText(t).width + (spec.ls || 0) * spec.s * t.length;
  }
  const FONT = {
    zone: { w: 700, s: 27, f: STACK.letter, ls: 0.08, up: true },
    zoneS: { w: 500, s: 17, f: STACK.mono },
    room: { w: 600, s: 23, f: STACK.letter, ls: 0.05, up: true },
    roomS: { w: 500, s: 17.5, f: STACK.mono },
    name: { w: 500, s: 10.6, f: STACK.letter },
    dim: { w: 600, s: 22, f: STACK.letter, ls: 0.07, up: true },
    plate: { w: 700, s: 13, f: STACK.letter, ls: 0.1, up: true },
    plateS: { w: 500, s: 10.5, f: STACK.mono },
    hall: { w: 500, s: 20, f: STACK.letter, ls: 0.2, up: true },
    meta: { w: 400, s: 6.8, f: STACK.mono },
    val: { w: 500, s: 8.5, f: STACK.mono },
  };
  /** First candidate string that fits maxW (the last one is used regardless). */
  function firstFit(cands, spec, maxW) {
    for (let i = 0; i < cands.length; i++) if (measure(cands[i], spec) <= maxW) return cands[i];
    return cands[cands.length - 1];
  }
  const ST_SHORT = { done: 'DONE', partial: 'PART', todo: 'TODO', blocked: 'BLKD', na: 'N/A' };
  /** Greedy word wrap into at most maxLines lines that fit maxW; the last line is ellipsized if needed. */
  function wrap(text, spec, maxW, maxLines) {
    const words = String(text).split(/\s+/);
    const lines = [];
    let cur = '';
    words.forEach((w) => {
      const next = cur ? cur + ' ' + w : w;
      if (!cur || measure(next, spec) <= maxW) cur = next;
      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    if (lines.length > maxLines) {
      const keep = lines.slice(0, maxLines);
      let last = keep[maxLines - 1] + ' ' + lines.slice(maxLines).join(' ');
      while (last.length > 1 && measure(last + '…', spec) > maxW) last = last.slice(0, -1);
      keep[maxLines - 1] = last.trim() + '…';
      return keep;
    }
    return lines;
  }

  /** All ways to cut n ordered items into k consecutive groups (returns cut index lists). */
  function partitions(n, k) {
    const out = [];
    (function rec(start, left, acc) {
      if (left === 1) { out.push(acc.slice()); return; }
      for (let c = start + 1; c <= n - left + 1; c++) { acc.push(c); rec(c, left - 1, acc); acc.pop(); }
    })(0, k, []);
    return out;
  }
  function groupsOf(arr, cuts) {
    const g = [];
    let s = 0;
    cuts.concat([arr.length]).forEach((c) => { g.push(arr.slice(s, c)); s = c; });
    return g;
  }

  /** Best room arrangement for a wing at band height H: sub-rows of rooms, each room a c x r fixture grid. */
  function wingFit(wing, H) {
    const roomsH = H - G.wingHdr - G.ring;
    const nm = wing.mods.length;
    let best = null;
    for (let k = 1; k <= Math.min(5, nm); k++) {
      const subH = (roomsH - (k - 1) * G.corridor) / k;
      const rMax = Math.floor((subH - G.roomHdr - G.roomPad) / G.cellH);
      if (rMax < 1) break;
      const rooms = wing.mods.map((x) => {
        const c = Math.ceil(x.n / rMax);
        const r = Math.ceil(x.n / c);
        return { c, r, nat: Math.max(G.roomMinW, x.minW, c * G.cellW + 2 * G.roomPad) };
      });
      partitions(nm, k).forEach((cuts) => {
        const rows = groupsOf(rooms.map((_, i) => i), cuts);
        const widths = rows.map((rw) => rw.reduce((s, i) => s + rooms[i].nat, 0) + (rw.length - 1) * G.roomGap);
        const inner = Math.max.apply(null, widths);
        const w = Math.max(wing.minW, inner + 2 * G.ring);
        const slack = widths.reduce((s, x) => s + (inner - x), 0) * subH;
        const empty = rooms.reduce((s, r, i) => s + (r.c * r.r - wing.mods[i].n), 0);
        const tall = rooms.reduce((s, r) => s + Math.max(0, (subH - G.roomHdr - G.roomPad) - r.r * G.cellH * 1.25), 0) * 60;
        const score = w * H + slack * 0.35 + empty * G.cellW * G.cellH * 0.5 + tall;
        if (!best || score < best.score) best = { score, extra: score - w * H, w, k, cuts, subH, rooms };
      });
    }
    return best;
  }

  /** Building aspect to aim for: landscape sheets on wide screens, a tall plan on phones. */
  function targetAspect() {
    const vw = viewport.clientWidth || window.innerWidth;
    const vh = viewport.clientHeight || window.innerHeight;
    return vw / vh < 0.85 ? Math.max(0.5, vw / vh * 1.08) : 1.55;
  }
  function computeLayout() {
    const letters = 'ABCDEFGHIJ';
    WINGS.length = 0;
    BP.domains.forEach((d, di) => {
      const mods = BP.modulesOf(d.id).map((m, mi) => {
        const n = BP.featuresOf(m.id).length;
        const code = letters[di] + '-' + String(mi + 1).padStart(2, '0');
        // a room must hold its name in at most two lines next to its tag
        const words = m.name.toUpperCase().split(' ');
        const longest = Math.max.apply(null, words.map((w) => measure(w, FONT.room)));
        const minW = Math.max(longest, measure('7 FX · 100% · ▲9', FONT.roomS)) + 2 * G.roomPad + 50;
        return { m, n, code, minW };
      });
      const title = 'ZONE ' + letters[di] + ' · ' + d.name;
      const minW = 2 * G.ring + 64 + Math.max(measure(title, FONT.zone), measure('32 FX · 5 ROOMS · OVR 100%', FONT.zoneS)) + 12;
      WINGS.push({ d, di, letter: letters[di], mods, title, minW, roll: BP.domainRollup(d.id) });
    });
    const split = Math.ceil(WINGS.length / 2);
    const bands = [WINGS.slice(0, split), WINGS.slice(split)];
    const minH = G.wingHdr + G.ring + G.roomHdr + G.roomPad + G.cellH;
    const cand = [];
    for (let h = Math.ceil(minH); h <= 1500; h += 4) cand.push(h);
    const bandEval = bands.map((band) => cand.map((H) => {
      const fits = band.map((w) => wingFit(w, H));
      if (fits.some((x) => !x)) return null;
      const width = fits.reduce((s, x) => s + x.w, 0) + (band.length - 1) * G.wingWall;
      const extra = fits.reduce((s, x) => s + x.extra, 0);
      return { H, fits, width, extra };
    }).filter(Boolean));
    const hallH = 2 * G.hallWall + G.hallOpen;
    const target = targetAspect();
    let best = null;
    bandEval[0].forEach((a) => {
      bandEval[1].forEach((b) => {
        const W = Math.max(a.width, b.width);
        const Ht = a.H + b.H + hallH;
        const aspect = W / Ht;
        const stretch = (W - a.width) * a.H + (W - b.width) * b.H;
        const score = (W * Ht + stretch * 0.6 + a.extra + b.extra) * (1 + 1.4 * Math.abs(Math.log(aspect / target)));
        if (!best || score < best.score) best = { score, a, b, W, Ht };
      });
    });
    const W = best.W;
    const Htot = best.Ht;
    const geo = { W, H: Htot, hallY: best.a.H, hallH, bands: [], portrait: target < 1 };
    [best.a, best.b].forEach((be, bi) => {
      const band = bands[bi];
      const y = bi === 0 ? 0 : best.a.H + hallH;
      const avail = W - (band.length - 1) * G.wingWall;
      const nat = be.fits.reduce((s, x) => s + x.w, 0);
      let x = 0;
      geo.bands.push({ y, h: be.H, wings: band });
      band.forEach((wing, wi) => {
        const fit = be.fits[wi];
        const w = wi === band.length - 1 ? W - x : Math.round(fit.w * avail / nat);
        wing.band = bi;
        wing.rect = { x, y, w, h: be.H };
        wing.rooms = [];
        const blockX = x + G.ring;
        const blockW = w - 2 * G.ring;
        const blockY = y + G.wingHdr;
        const rows = groupsOf(wing.mods.map((_, i) => i), fit.cuts);
        rows.forEach((rw, si) => {
          const ry = blockY + si * (fit.subH + G.corridor);
          const natSum = rw.reduce((s, i) => s + fit.rooms[i].nat, 0);
          const availW = blockW - (rw.length - 1) * G.roomGap;
          let rx = blockX;
          rw.forEach((i, j) => {
            const rm = fit.rooms[i];
            const rwid = j === rw.length - 1 ? blockX + blockW - rx : rm.nat * availW / natSum;
            const mod = wing.mods[i];
            const room = {
              m: mod.m, code: mod.code, n: mod.n, wing, c: rm.c, r: rm.r,
              x: rx, y: ry, w: rwid, h: fit.subH,
              door: 'bottom',
              roll: BP.moduleRollup(mod.m.id),
            };
            room.cellW = (room.w - 2 * G.roomPad) / room.c;
            room.cellH = (room.h - G.roomHdr - G.roomPad) / room.r;
            room.cells = [];
            BP.featuresOf(mod.m.id).forEach((f, fi) => {
              const col = fi % room.c;
              const row = Math.floor(fi / room.c);
              const cx = room.x + G.roomPad + col * room.cellW;
              const cy = room.y + G.roomHdr + row * room.cellH;
              const rec = FX.get(f.id);
              rec.room = room;
              rec.row = row;
              rec.cellTop = cy;
              rec.x = r2(cx + (room.cellW - G.cw) / 2);
              rec.y = r2(cy + Math.min((room.cellH - G.ch) / 2, 14));
              rec.cx = rec.x + 22;
              rec.cy = rec.y + 22;
              room.cells.push(rec);
            });
            ROOMS.set(mod.m.id, room);
            wing.rooms.push(room);
            rx += rwid + G.roomGap;
          });
        });
        x += w + G.wingWall;
      });
    });
    const top = -G.ext - G.dimOff - 2 * G.dimStep - 14 - G.gridOff - 20;
    geo.titleY = Htot - top + 46;
    const bottom = geo.titleY + 44;
    geo.ext = { x: -G.ext - 40, y: top, w: W + 2 * G.ext + 80, h: bottom - top };
    PLAN = geo;
  }

  // ═══════════════════════════════════════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════════════════════════════════════
  const world = $('#world');
  const plan = $('#plan');
  const viewport = $('#viewport');
  const layers = {};

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    if (attrs) Object.keys(attrs).forEach((k) => { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(parent, x, y, str, cls, extra) {
    const t = el('text', Object.assign({ x: r2(x), y: r2(y), class: cls }, extra || {}), parent);
    t.textContent = str;
    return t;
  }
  const rectD = (x, y, w, h) => 'M' + r2(x) + ',' + r2(y) + 'h' + r2(w) + 'v' + r2(h) + 'h' + r2(-w) + 'z';
  /** Rectangle outline with an opening on one side (top/bottom), used for room walls with a door. */
  function rectGapD(x, y, w, h, side, gx, gw) {
    const x2 = x + w;
    const y2 = y + h;
    if (side === 'bottom') return 'M' + r2(gx + gw) + ',' + r2(y2) + 'L' + r2(x2) + ',' + r2(y2) + 'L' + r2(x2) + ',' + r2(y) + 'L' + r2(x) + ',' + r2(y) + 'L' + r2(x) + ',' + r2(y2) + 'L' + r2(gx) + ',' + r2(y2);
    return 'M' + r2(gx) + ',' + r2(y) + 'L' + r2(x) + ',' + r2(y) + 'L' + r2(x) + ',' + r2(y2) + 'L' + r2(x2) + ',' + r2(y2) + 'L' + r2(x2) + ',' + r2(y) + 'L' + r2(gx + gw) + ',' + r2(y);
  }
  function hexPts(cx, cy, r) {
    const p = [];
    for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; p.push(r2(cx + r * Math.cos(a)) + ',' + r2(cy + r * Math.sin(a))); }
    return p.join(' ');
  }
  /** Scalloped revision cloud around a rectangle (clockwise, arcs bulge outward). */
  function cloudD(x, y, w, h, seg) {
    const nx = Math.max(2, Math.round(w / seg));
    const ny = Math.max(2, Math.round(h / seg));
    const sx = w / nx;
    const sy = h / ny;
    const r = r2(Math.max(sx, sy) * 0.68);
    let d = 'M' + r2(x) + ',' + r2(y);
    const arc = (px, py) => { d += 'A' + r + ',' + r + ' 0 0 1 ' + r2(px) + ',' + r2(py); };
    for (let i = 1; i <= nx; i++) arc(x + i * sx, y);
    for (let i = 1; i <= ny; i++) arc(x + w, y + i * sy);
    for (let i = 1; i <= nx; i++) arc(x + w - i * sx, y + h);
    for (let i = 1; i <= ny; i++) arc(x, y + h - i * sy);
    return d + 'Z';
  }
  /** Tick schedule paths for facet states: filled (done + half of partial), outlines, blocked, n/a. */
  function tickPaths(states, x0, y0, w, h, gx, gy) {
    const out = { f: '', o: '', b: '', n: '' };
    states.forEach((row, ri) => {
      row.forEach((st, ci) => {
        const x = x0 + ci * (w + gx);
        const y = y0 + ri * (h + gy);
        if (st === 'done') out.f += rectD(x, y, w, h);
        else if (st === 'partial') { out.o += rectD(x, y, w, h); out.f += rectD(x, y, w / 2, h); }
        else if (st === 'todo') out.o += rectD(x, y, w, h);
        else if (st === 'blocked') out.b += rectD(x - 0.5, y - 0.5, w + 1, h + 1);
        else out.n += 'M' + r2(x + 1.5) + ',' + r2(y + h / 2) + 'h' + r2(w - 3);
      });
    });
    return out;
  }
  function drawTicks(g, states, x0, y0, w, h, gx, gy) {
    const p = tickPaths(states, x0, y0, w, h, gx, gy);
    if (p.f) el('path', { d: p.f, class: 'tk-f' }, g);
    if (p.o) el('path', { d: p.o, class: 'tk-o' }, g);
    if (p.b) el('path', { d: p.b, class: 'tk-b' }, g);
    if (p.n) el('path', { d: p.n, class: 'tk-n' }, g);
  }
  const facetStates = (f, dimId) => DIMS.find((d) => d.id === dimId).facets.map((fc) => f.dims[dimId][fc.id]);

  function renderAll() {
    world.textContent = '';
    ['sheet', 'wash', 'base', 'grid', 'floor', 'rooms', 'serv', 'fx', 'links', 'plates'].forEach((id) => {
      layers[id] = el('g', { id: 'g-' + id }, world);
    });
    renderBase();
    renderDims();
    renderGrid();
    renderDrawingTitle();
    WINGS.forEach((w) => { renderZoneHeader(w); w.rooms.forEach(renderRoom); renderPlate(w); });
    FX.forEach(renderFixture);
    ROOMS.forEach(renderServices);
    refreshLensText();
  }

  function renderBase() {
    const g = layers.base;
    const { W, H, hallY, hallH } = PLAN;
    const E = G.ext;
    // exterior: heavy double line with hatched poche, entries at both ends of the hall
    el('path', { d: rectD(-E, -E, W + 2 * E, H + 2 * E) + rectD(0, 0, W, H), class: 'ext-poche', 'fill-rule': 'evenodd' }, g);
    el('rect', { x: -E, y: -E, width: W + 2 * E, height: H + 2 * E, class: 'ext-line' }, g);
    el('rect', { x: 0, y: 0, width: W, height: H, class: 'ext-line-in' }, g);
    const ey = hallY + G.hallWall + (G.hallOpen - G.entry) / 2;
    [[-E - 2, 0], [W - 2, W + E]].forEach(([x0]) => {
      el('rect', { x: x0, y: ey, width: E + 4, height: G.entry, fill: 'var(--paper)' }, g);
      el('path', { d: 'M' + (x0 + 2) + ',' + ey + 'h' + E + 'M' + (x0 + 2) + ',' + (ey + G.entry) + 'h' + E, class: 'jamb' }, g);
    });
    // hall walls (heavy) with an opening into each wing, and the hall axis
    const hy1 = hallY;
    const hy2 = hallY + G.hallWall + G.hallOpen;
    [[hy1, 0], [hy2, 1]].forEach(([y, bi]) => {
      const ops = PLAN.bands[bi].wings.map((w) => w.rect.x + w.rect.w / 2);
      let x = 0;
      ops.forEach((cx) => {
        const a = cx - G.entry / 2;
        el('rect', { x: r2(x), y: y, width: r2(a - x), height: G.hallWall, class: 'wall-poche' }, g);
        // double doors swinging into the hall
        const dy = bi === 0 ? y + G.hallWall : y;
        const s = bi === 0 ? 1 : -1;
        const half = G.entry / 2;
        el('path', { d: 'M' + r2(a) + ',' + r2(dy) + 'l0,' + r2(s * half) + 'M' + r2(a + G.entry) + ',' + r2(dy) + 'l0,' + r2(s * half), class: 'door-leaf' }, g);
        el('path', { d: 'M' + r2(a) + ',' + r2(dy + s * half) + 'A' + half + ',' + half + ' 0 0 ' + (bi === 0 ? 0 : 1) + ' ' + r2(a + half) + ',' + r2(dy) + 'M' + r2(a + G.entry) + ',' + r2(dy + s * half) + 'A' + half + ',' + half + ' 0 0 ' + (bi === 0 ? 1 : 0) + ' ' + r2(a + half) + ',' + r2(dy), class: 'door' }, g);
        x = a + G.entry;
      });
      el('rect', { x: r2(x), y: y, width: r2(W - x), height: G.hallWall, class: 'wall-poche' }, g);
    });
    // wing separation walls
    PLAN.bands.forEach((b) => {
      b.wings.forEach((w, wi) => {
        if (wi === b.wings.length - 1) return;
        el('rect', { x: w.rect.x + w.rect.w, y: b.y, width: G.wingWall, height: b.h, class: 'wall-poche' }, g);
      });
    });
    const hc = hallY + hallH / 2;
    el('path', { d: 'M' + (-E - 30) + ',' + hc + 'H' + (W + E + 30), class: 'hall-axis' }, g);
    // hall lettering: the shared stack that every zone opens onto
    const st = BP.product.stack;
    const label = 'Main hall · ' + [st.web, st.api, st.workers, st.data, st.infra].join(' · ');
    const lw = measure(label, FONT.hall);
    const lg = el('g', { class: 'lv-s' }, layers.rooms);
    const tx = Math.max(60, (W - lw) / 2);
    el('rect', { x: r2(tx - 14), y: r2(hc - 15), width: r2(Math.min(lw, W - 120) + 28), height: 28, fill: 'var(--paper)' }, lg);
    txt(lg, tx, hc + 7, label, 't-hall');
  }

  function renderDims() {
    const g = layers.sheet;
    const { H } = PLAN;
    WINGS.forEach((wing) => {
      const side = wing.band === 0 ? -1 : 1;
      const face = side < 0 ? -G.ext : H + G.ext;
      const x0 = wing.rect.x + 4;
      const x2 = wing.rect.x + wing.rect.w - 4;
      const dg = el('g', { class: 'dims lv-s', 'data-zone': wing.d.id }, g);
      const outer = face + side * (G.dimOff + 2 * G.dimStep + 10);
      el('path', { d: 'M' + r2(x0) + ',' + r2(face + side * 8) + 'V' + r2(outer) + 'M' + r2(x2) + ',' + r2(face + side * 8) + 'V' + r2(outer), class: 'dim-ext' }, dg);
      DIMS.forEach((dim, i) => {
        const v = wing.roll.dims[dim.id];
        const y = face + side * (G.dimOff + i * G.dimStep);
        const x1 = x0 + v * (x2 - x0);
        const row = el('g', { class: 'dim-row dim-' + dim.id }, dg);
        el('path', { d: 'M' + r2(x0) + ',' + r2(y) + 'H' + r2(x1), class: 'dim-line' }, row);
        el('path', { d: 'M' + r2(x1) + ',' + r2(y) + 'H' + r2(x2), class: 'dim-rest' }, row);
        el('path', { d: [x0, x1, x2].map((x) => 'M' + r2(x - 5.5) + ',' + r2(y + 5.5) + 'l11,-11').join(''), class: 'dim-tick' }, row);
        const label = dim.short.toUpperCase() + ' ' + pct(v);
        const lw = measure(label, FONT.dim);
        const seg = x1 - x0;
        if (seg > lw + 16) txt(row, x0 + seg / 2 - lw / 2, y - 7, label, 't-dim');
        else txt(row, Math.min(x1 + 10, x2 - lw - 6), y - 7, label, 't-dim');
        const rest = 'TO GO ' + pct(1 - v);
        const restW = measure(rest, { w: 400, s: 13, f: STACK.mono });
        if (x2 - x1 > restW + 24 && (seg > lw + 16 || x2 - x1 > lw + restW + 40)) txt(el('g', { class: 'lv-r' }, row), x2 - restW - 8, y - 7, rest, 't-dim-r');
      });
    });
  }

  /** Drawing title under the view: a view bubble (1 over the sheet number) and the underlined sheet name. */
  function renderDrawingTitle() {
    const g = el('g', { class: 'dwg lv-s' }, layers.sheet);
    const y = PLAN.titleY;
    const cx = 30;
    el('circle', { cx, cy: y - 10, r: 30, class: 'dwg-c' }, g);
    el('path', { d: 'M' + (cx - 30) + ',' + (y - 10) + 'h60', class: 'dwg-rule', style: 'stroke-width:1' }, g);
    txt(g, cx, y - 16, '1', 't-dwg-n');
    PLAN.dwgNo = txt(g, cx, y + 11, '', 't-dwg-n');
    PLAN.dwgNo.setAttribute('style', 'font-size:14px');
    PLAN.dwgTitle = txt(g, 76, y - 6, '', 't-dwg');
    PLAN.dwgRule = el('path', { d: '', class: 'dwg-rule' }, g);
    const P = BP.product;
    txt(g, 76, y + 32, P.name.toUpperCase() + ' ' + P.version + ' → ' + P.nextVersion + ' · ' + BP.features.length + ' FIXTURES IN ' + BP.modules.length + ' ROOMS · ' + BP.domains.length + ' ZONES · AS OF ' + BP.data.meta.asOf, 't-dwg-s');
  }

  function renderGrid() {
    // S-201: structural column lines on the wing walls with numbered grid bubbles
    const g = layers.grid;
    const { H } = PLAN;
    let n = 0;
    PLAN.bands.forEach((b, bi) => {
      const xs = [0];
      b.wings.forEach((w, wi) => { if (wi < b.wings.length - 1) xs.push(w.rect.x + w.rect.w + G.wingWall / 2); });
      xs.push(PLAN.W);
      const far = bi === 0 ? -G.ext - G.dimOff - 2 * G.dimStep - 14 - G.gridOff : H + G.ext + G.dimOff + 2 * G.dimStep + 14 + G.gridOff;
      const near = bi === 0 ? b.y + b.h : b.y;
      xs.forEach((x) => {
        n += 1;
        el('path', { d: 'M' + r2(x) + ',' + r2(near) + 'V' + r2(far + (bi === 0 ? 18 : -18)), class: 'grid-line' }, g);
        el('circle', { cx: r2(x), cy: r2(far), r: 18, class: 'grid-bub' }, g);
        txt(g, x, far + 6.8, String(n), 't-grid');
      });
    });
  }

  function renderZoneHeader(wing) {
    const { x, y, w } = wing.rect;
    const g = el('g', { class: 'zone-hdr lv-s', 'data-zone': wing.d.id }, layers.rooms);
    el('rect', { x: x + 4, y: y + 4, width: w - 8, height: G.wingHdr - 10, class: 'hdr-hit' }, g);
    const cx = x + G.ring + 25;
    const cy = y + G.wingHdr / 2 + 1;
    el('polygon', { points: hexPts(cx, cy, 26), class: 'hex' }, g);
    el('polygon', { points: hexPts(cx, cy, 21), class: 'hex-in' }, g);
    txt(g, cx, cy + 9, wing.letter, 't-hex');
    const tx = x + G.ring + 62;
    txt(g, tx, y + 35, wing.title.toUpperCase(), 't-zone');
    wing.statEl = txt(g, tx, y + 59, '', 't-zone-s');
    // status bar on the right when the wing is wide enough
    const tw = Math.max(measure(wing.title, FONT.zone), measure('32 FX · 5 ROOMS · OVR 100%', FONT.zoneS));
    const bw = 170;
    const bx = x + w - G.ring - bw;
    if (bx > tx + tw + 24) {
      const by = y + 20;
      const bh = 13;
      let cur = bx;
      BP.STATUS_ORDER.forEach((s) => {
        const c = wing.roll.byStatus[s];
        if (!c) return;
        const sw = bw * c / wing.roll.count;
        el('rect', { x: r2(cur), y: by, width: r2(sw), height: bh, class: 'sym ' + symClass(s) }, g);
        if (s === 'blocked') el('path', { d: 'M' + r2(cur) + ',' + by + 'l' + r2(sw) + ',' + bh + 'M' + r2(cur + sw) + ',' + by + 'l' + r2(-sw) + ',' + bh, class: 'redx', style: 'stroke-width:1.2' }, g);
        cur += sw;
      });
      el('rect', { x: bx, y: by, width: bw, height: bh, class: 'zbar-o' }, g);
      txt(el('g', { class: 'lv-r' }, g), bx + bw, by + 30, wing.roll.byStatus.live + ' LIVE · ' + (wing.roll.count - wing.roll.byStatus.live) + ' NOT YET LIVE', 't-zone-x', { 'text-anchor': 'end' });
    }
    g.addEventListener('click', () => { if (!dragMoved) flyToRect(wing.rect, 26); });
  }

  function symClass(s) {
    return { live: 'sym-live', ready: 'sym-ready', building: 'sym-build', planned: 'sym-plan', blocked: 'sym-block' }[s];
  }

  function renderRoom(room) {
    const { x, y, w, h } = room;
    // walls (base layer, screened in other sheets)
    const doorX = x + 18;
    el('path', { d: rectGapD(x, y, w, h, room.door, doorX, G.door), class: 'room-wall' }, layers.base);
    el('path', { d: rectGapD(x + 4, y + 4, w - 8, h - 8, room.door, doorX - 4, G.door + 8), class: 'room-wall-in' }, layers.base);
    const dy = room.door === 'bottom' ? y + h : y;
    const s = room.door === 'bottom' ? 1 : -1;
    el('path', { d: 'M' + r2(doorX) + ',' + r2(dy) + 'l0,' + r2(s * G.door), class: 'door-leaf' }, layers.base);
    el('path', { d: 'M' + r2(doorX) + ',' + r2(dy + s * G.door) + 'A' + G.door + ',' + G.door + ' 0 0 ' + (s > 0 ? 0 : 1) + ' ' + r2(doorX + G.door) + ',' + r2(dy), class: 'door' }, layers.base);
    // B-401 program wash by adoption
    const ad = room.cells.map((r) => BP.facetValue(r.f.dims.biz.adoption)).filter((v) => v != null);
    room.adoption = ad.length ? ad.reduce((a, b) => a + b, 0) / ad.length : 0;
    room.program = room.adoption >= 0.5 ? 'hi' : room.adoption >= 0.3 ? 'mid' : 'lo';
    el('rect', { x: x + 4, y: y + 4, width: r2(w - 8), height: r2(h - 8), class: 'wash-' + room.program }, layers.wash);
    // floor (hit target), selection frame, labels
    const g = el('g', { class: 'room', 'data-room': room.m.id }, layers.floor);
    el('rect', { x, y, width: r2(w), height: r2(h), class: 'floor' }, g);
    el('rect', { x: x - 5, y: y - 5, width: r2(w + 10), height: r2(h + 10), class: 'room-selframe' }, g);
    room.el = g;
    const lg = el('g', { class: 'room lbl lv-s', 'data-room': room.m.id }, layers.rooms);
    room.lblEl = lg;
    el('rect', { x: x + 4, y: y + 4, width: r2(w - 8), height: G.roomHdr - 8, class: 'hdr-hit' }, lg);
    const tcx = x + G.roomPad + 19;
    const tcy = y + G.roomPad + 22;
    el('circle', { cx: r2(tcx), cy: r2(tcy), r: 19.5, class: 'rtag' }, lg);
    txt(lg, tcx, tcy + 4.8, room.code, 't-rtag');
    const nx = x + G.roomPad + 47;
    const lines = wrap(room.m.name.toUpperCase(), FONT.room, w - G.roomPad * 2 - 49, 2);
    lines.forEach((ln, i) => txt(lg, nx, y + G.roomPad + 21 + i * 22, ln, 't-room'));
    room.statEl = txt(lg, nx, y + G.roomPad + 21 + lines.length * 22 - 1, '', 't-room-s');
    lg.addEventListener('click', (e) => { if (!dragMoved) { e.stopPropagation(); selectModule(room.m.id, true); } });
  }

  function renderPlate(wing) {
    // key-plan plate: zone letter, name and score, kept at a legible screen size when zoomed far out
    const { x, y, w, h } = wing.rect;
    const g = el('g', { class: 'plate-g lv-k', 'data-zone': wing.d.id }, layers.plates);
    const inner = el('g', {}, g);
    const words = wing.d.name.toUpperCase().split(' ');
    const lines = [];
    words.forEach((wd) => {
      const last = lines[lines.length - 1];
      if (last && (last + ' ' + wd).length <= 12) lines[lines.length - 1] = last + ' ' + wd;
      else lines.push(wd);
    });
    const lw = Math.max.apply(null, lines.map((l) => measure(l, FONT.plate)).concat([measure('32 FX · 100%', FONT.plateS)]));
    const pw = lw + 22;
    const ph = 38 + lines.length * 15 + 16;
    el('rect', { x: r2(-pw / 2), y: r2(-ph / 2), width: r2(pw), height: r2(ph), class: 'plate' }, inner);
    el('polygon', { points: hexPts(0, -ph / 2 + 18, 12), class: 'hex' }, inner);
    txt(inner, 0, -ph / 2 + 23.5, wing.letter, 't-plate-l');
    lines.forEach((l, i) => txt(inner, 0, -ph / 2 + 48 + i * 15, l, 't-plate'));
    wing.plateStat = txt(inner, 0, -ph / 2 + 48 + lines.length * 15 + 2, '', 't-plate-s');
    wing.plate = { g, inner, pw, ph, cx: x + w / 2, cy: y + h / 2 + 10 };
    g.addEventListener('click', () => { if (!dragMoved) flyToRect(wing.rect, 20); });
  }

  function renderFixture(rec) {
    const f = rec.f;
    const g = el('g', {
      class: 'fx st-' + f.status + (rec.att ? ' att' : '') + (rec.trust ? ' trustfx' : ''),
      'data-fid': f.id,
      transform: 'translate(' + rec.x + ',' + rec.y + ')',
    }, layers.fx);
    rec.el = g;
    el('rect', { x: -4, y: -4, width: G.cw + 8, height: G.ch + 8, class: 'fx-hit' }, g);
    el('rect', { x: -2.5, y: -2.5, width: G.cw + 5, height: G.ch + 5, class: 'fx-hover' }, g);
    el('rect', { x: -3, y: -3, width: G.cw + 6, height: G.ch + 6, class: 'fx-frame' }, g);
    [[-3, -3], [G.cw + 3, -3], [-3, G.ch + 3], [G.cw + 3, G.ch + 3]].forEach(([gx, gy]) => el('rect', { x: gx - 2.6, y: gy - 2.6, width: 5.2, height: 5.2, class: 'fx-grip' }, g));

    // A-101 architectural: status symbol + 3 x 4 tick schedule
    const ga = el('g', { class: 'gl gl-a' }, g);
    el('rect', { x: 4, y: 4, width: 36, height: 36, class: 'sym ' + symClass(f.status) }, ga);
    drawTicks(ga, DIMS.map((d) => facetStates(f, d.id)), 48, 6, 9, 8, 2.5, 3);
    const tl = el('g', { class: 'lv-d' }, ga);
    DIMS.forEach((d, i) => txt(tl, 44.2, 12.2 + i * 11, d.short[0], 't-tkl'));

    // S-201 structural: a bay frame filled to dev completion, braced by tests
    const gs = el('g', { class: 'gl gl-s' }, g);
    const dev = BP.dimScore(f, 'dev') || 0;
    const tests = f.dims.dev.tests;
    const skew = tests === 'todo' || tests === 'blocked' ? 8 : 0;
    const X0 = 4; const Y0 = 4; const S = 36;
    const xl = (yy) => X0 + skew * (1 - (yy - Y0) / S);
    const yd = Y0 + S * (1 - dev);
    const poly = (pts) => pts.map((p) => r2(p[0]) + ',' + r2(p[1])).join(' ');
    if (dev > 0) el('polygon', { points: poly([[xl(yd), yd], [xl(yd) + S, yd], [X0 + S, Y0 + S], [X0, Y0 + S]]), class: 'frame-fill' }, gs);

  function renderServices(room) {
    // M-301: the room riser feeds a trunk along each row; drops (inside each fixture) reach powered outlets
    const g = el('g', { class: 'svc' }, layers.serv);
    const rows = {};
    room.cells.forEach((rec) => {
      const dep = rec.f.dims.ops.deploy;
      if (dep !== 'done' && dep !== 'partial') return;
      (rows[rec.row] = rows[rec.row] || []).push(rec.x + 22);
    });
    const rx = room.x + 9;
    const firstY = room.y + G.roomHdr + 1.5;
    const keys = Object.keys(rows).map(Number);
    if (keys.length) {
      const lastRow = Math.max.apply(null, keys);
      const lastY = room.y + G.roomHdr + lastRow * room.cellH + 1.5;
      let d = 'M' + r2(rx) + ',' + r2(firstY) + 'V' + r2(lastY);

  }

  /** Updates every lens-dependent label: room and zone stats, fixture values and meta lines. */
