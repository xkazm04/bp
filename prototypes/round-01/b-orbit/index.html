        '<dt>Attention</dt><dd>' + (r.attention ? '<span style="color:var(--alarm)">' + r.attention + ' need attention</span>' : 'None') + '</dd></dl>';
      h += '<div class="ins-sec"><h3><span>Rollup</span><span class="mono">overall ' + pct(r.overall) + '</span></h3>' + dimBlocks(r.dims, null) + '</div>';
      h += '<div class="ins-sec"><h3><span>Status</span><span class="mono">' + r.count + ' features</span></h3><div class="stcounts">' + BP.STATUS_ORDER.filter((id) => r.byStatus[id]).map((id) => '<span class="pill">' + glyphSVG(id, 13) + STATUS[id].label + ' <span class="mono">' + r.byStatus[id] + '</span></span>').join('') + '</div></div>';
      h += '<div class="ins-sec"><h3><span>Features</span><span class="mono">' + LENS_SHORT[S.lens] + ' score</span></h3><ul class="flist">' + BP.featuresOf(m.id).map((x) => featureItem(x, false)).join('') + '</ul></div>';
    } else {
      const d = BP.domain(S.sel.id);
      const r = BP.domainRollup(d.id);
      crumb.innerHTML = '<span>Domain</span><span aria-hidden="true">·</span><span>' + d.code + '</span>';
      h += '<h2>' + esc(d.name) + '</h2><div class="ins-id">' + r.count + ' features · ' + BP.modulesOf(d.id).length + ' modules</div>';
      h += '<p class="summary">' + esc(d.summary) + '</p>';
      h += '<div class="ins-sec"><h3><span>Rollup</span><span class="mono">overall ' + pct(r.overall) + '</span></h3>' + dimBlocks(r.dims, null) + '</div>';
      h += '<div class="ins-sec"><h3><span>Modules</span><span class="mono">' + LENS_SHORT[S.lens] + ' score</span></h3><ul class="flist">' + BP.modulesOf(d.id).map((m) => {
        const mr = BP.moduleRollup(m.id);
        const v = lensRollup(mr);
        return '<li><button type="button" class="fitem" data-gotomod="' + m.id + '"><span class="mono" style="font-size:10px;color:var(--ink-3)">' + m.code + '</span><span class="nm">' + esc(m.name) + (mr.attention ? ' <span style="color:var(--alarm)" class="mono">✦' + mr.attention + '</span>' : '') + '</span><span class="m">' + pct(v) + '<span class="mini"><i style="width:' + fx(v * 100) + '%"></i></span></span></button></li>';
      }).join('') + '</ul></div>';
    }
    body.innerHTML = h;
    body.scrollTop = 0;
  }
  $('insBody').addEventListener('click', (e) => {
    const g = e.target.closest('[data-goto]');
    if (g) { select('feature', g.dataset.goto); return; }
    const gm = e.target.closest('[data-gotomod]');
    if (gm) select('module', gm.dataset.gotomod);
  });
  $('insCrumb').addEventListener('click', (e) => {
    const m = e.target.closest('[data-mod]');
    if (m) { select('module', m.dataset.mod); return; }
    const d = e.target.closest('[data-dom]');
    if (d) { S.sel = { type: 'domain', id: d.dataset.dom }; related = new Set(); $('deps').innerHTML = ''; openInspector(); applyClasses(); focusDomain(d.dataset.dom); }
  });
  $('insClose').addEventListener('click', () => select(null));

  /* ── readout (pointing) ── */
  function queueReadout() {
    if (frameQueued) return;
    frameQueued = true;
    requestAnimationFrame(() => { frameQueued = false; updateReadout(); });
  }
  const LV_NAME = ['Far field', 'Sky', 'Constellation', 'Star'];
  function updateReadout() {
    const v = viewRect();
    const wx = (v.cx - T.x) / T.k, wy = (v.cy - T.y) / T.k;
    const p = rotate([wx, wy], -S.rot);
    const r = Math.hypot(p[0], p[1]);
    const a = norm(Math.atan2(p[0], -p[1]));
    let where = 'Core';
    if (r > G.core && r < 1000) {
      let hit = null;
      modGeo.forEach((mg) => { if (a >= mg.a0 - SLOT / 2 && a <= mg.a1 + SLOT / 2) hit = mg; });
      if (hit) where = BP.domain(hit.did).code + ' › ' + hit.m.code;
      else where = 'Open sky';
    } else if (r >= 1000) where = 'Beyond the rim';
    $('magRd').textContent = 'MAG ×' + (T.k / fitK).toFixed(2) + ' · ' + LV_NAME[S.level < 0 ? 1 : S.level].toUpperCase();
    $('brgRd').textContent = 'BRG ' + (r > G.core ? deg(a).toFixed(1).padStart(5, '0') : '---.-') + '° · ' + where.toUpperCase();
  }

  /* ── theme ── */
  const THEMES = ['system', 'light', 'dark'];
  const THEME_ICON = {
    system: '<svg width="16" height="16" viewBox="-8 -8 16 16" aria-hidden="true"><circle r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M0,-6A6,6 0 0 1 0,6Z" fill="currentColor"/></svg>',
    light: '<svg width="16" height="16" viewBox="-8 -8 16 16" aria-hidden="true"><circle r="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M0,-7v2M0,5v2M-7,0h2M5,0h2M-4.9,-4.9l1.4,1.4M3.5,3.5l1.4,1.4M-4.9,4.9l1.4,-1.4M3.5,-3.5l1.4,-1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    dark: '<svg width="16" height="16" viewBox="-8 -8 16 16" aria-hidden="true"><path d="M2.5,-6.2A6.5,6.5 0 1 0 6.3,2.4A5,5 0 0 1 2.5,-6.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  };
  function applyTheme(t) {
    S.theme = t;
    if (t === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
    $('themeBtn').innerHTML = THEME_ICON[t];
    $('themeBtn').setAttribute('aria-label', 'Theme: ' + t + '. Switch theme');
    $('themeBtn').title = 'Theme: ' + t;
    try { localStorage.setItem('orbit.theme', t); } catch (e) { /* storage unavailable */ }
  }
  $('themeBtn').addEventListener('click', () => applyTheme(THEMES[(THEMES.indexOf(S.theme) + 1) % 3]));

  /* ── wiring ── */
  function openSearch() { $('bar').classList.add('searching'); $('q').focus(); $('q').select(); }
  $('searchBtn').addEventListener('click', openSearch);
  $('q').addEventListener('input', onQuery);
  $('q').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const list = S.query.trim() ? matchList() : [];
    if (!list.length) return;
    S.hitIdx = (S.hitIdx + 1) % list.length;
    select('feature', list[S.hitIdx].f.id, { minK: 1.15 });
    if (isPhone()) $('q').blur();
  });
  $('qclear').addEventListener('click', () => { $('q').value = ''; onQuery(); $('bar').classList.remove('searching'); });
  $('q').addEventListener('blur', () => { if (!$('q').value) $('bar').classList.remove('searching'); });
  $('trustBtn').addEventListener('click', () => toggleTrust());
  $('legendBtn').addEventListener('click', () => {
    if (!$('inspector').hidden && isPhone()) select(null);
    toggleLegend(!legendWanted || !$('legend').hidden ? !legendWanted : true);
  });
  $('zoomIn').addEventListener('click', () => zoomBy(1.6));
  $('zoomOut').addEventListener('click', () => zoomBy(1 / 1.6));
  $('zoomFit').addEventListener('click', () => fit());
  $('fullsky').addEventListener('click', () => { if (S.sel && S.sel.type === 'domain') select(null); fit(); });
  /** Keeps floating phone rows tucked under the (wrapping) top bar. */
  function layoutChrome() {
    $('app').style.setProperty('--bar-h', Math.round($('bar').getBoundingClientRect().bottom + 6) + 'px');
  }
  let rz = null;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      renderLenses();
      layoutChrome();
      if (S.atFit) fit(0); else { fitK = fitTransform().k; apply(); }
    }, 60);
  });

  /* ══ BOOT ═════════════════════════════════════════════════════════════ */
  let savedTheme = 'system';
  try { savedTheme = localStorage.getItem('orbit.theme') || 'system'; } catch (e) { /* storage unavailable */ }
  applyTheme(THEMES.includes(savedTheme) ? savedTheme : 'system');
  renderStatic();
  renderLenses();
  renderReadout();
  renderLensCaption();
  renderChips();
  updateModuleArcs();
  layoutChrome();
  const t0 = fitTransform();
  // open the legend at start only where it fits beside the chart without covering it
  legendWanted = !isPhone() && (window.innerWidth - 2 * t0.k * G.fit) / 2 >= 300;
  renderLegend();
  syncLegend();
  fitK = t0.k;
  svgSel.call(zoom.transform, t0);
  apply();
  updateArcLabels(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readFonts(); updateArcLabels(true); });

  // Small hook for scripted walkthroughs and screenshots.
  window.ORBIT = {
    select: (id) => select('feature', id),
    module: (id) => select('module', id),
    domain: (id) => { S.sel = { type: 'domain', id }; openInspector(); applyClasses(); focusDomain(id); },
    lens: setLens,
    fit: () => fit(0),
    zoomTo: (k, r, aDeg) => flyToWorld(P(r || 0, rad(aDeg || 0)), k, 0),
    trust: (on) => toggleTrust(on !== false),
    state: () => ({ lens: S.lens, k: T.k, level: S.level, sel: S.sel, rot: S.rot }),
  };
})();
</script>
</body>
</html>
