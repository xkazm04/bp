; The Quest render tier (docs/concepts/vr-light-table/standalone-plan.md, S3 and S4). Android only: the PC look in
; DefaultEngine.ini stays the quality bar, and this file is where the headset's cheaper path lives. Forward shading
; (the mobile deferred path costs a full G-buffer on a tiler), multiview (one pass for both eyes), 4x MSAA, no mobile HDR
; (it adds a resolve pass the compositor does not need).
[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
r.Mobile.AntiAliasing=3
r.MSAACount=4
r.MobileHDR=False
vr.MobileMultiView=True
r.Mobile.AllowDistanceFieldShadows=False
; Occlusion queries off: at the target pose they cull nothing (2026-11-04 run note: with r.AllowOcclusionQueries 0 the
; base pass still draws 32, and 27 query draws a view go away), and on a tiler each query is a draw plus a readback.
r.AllowOcclusionQueries=False

; The headset's clocks and foveation (Meta XR, Android only; the PC reads none of these). Fixed foveated rendering, at
; most Medium and only when the GPU needs the headroom (dynamic): the deck and the paper sit in the middle of the view,
; the periphery is the studio. Sustained-high clocks: the table never idles the GPU long enough for power saving to pay.
[/Script/OculusXRHMD.OculusXRHMDRuntimeSettings]
SuggestedCpuPerfLevel=SustainedHigh
SuggestedGpuPerfLevel=SustainedHigh
FoveatedRenderingMethod=FixedFoveatedRendering
FoveatedRenderingLevel=Medium
bDynamicFoveatedRendering=True
