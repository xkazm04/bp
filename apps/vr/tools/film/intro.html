<!doctype html>
<!--
  The film's intro (12.0 s), rendered frame by frame by web-take.mjs --scene intro: every animation here is a CSS
  animation, paused and set to the frame's time by the capture (document.getAnimations, currentTime), so the render is
  exact at any machine speed. Served at <app>/__film/intro.html so it can borrow the app's own stylesheets (its fonts
  and colour tokens, apps/web/src/app/globals.css). Open it in a browser to preview it playing in real time.
  Beats (music: 84.8 bpm, bar 2.83 s): 0-4.2 title, 4.2-8.4 the problem, 8.4-12.0 the answer, ends on the bare grid.
  The bottom 160 px stay clear for the composer's captions.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Intro</title>
<style>
  :root {
    --paper: #0a2149; --paper-lo: #06142e; --ink: #dff0ff; --ink-hi: #ffffff; --accent: #7fe0ff; --amber: #ffc35a;
    --line: rgba(223, 240, 255, 0.55); --grid: rgba(127, 224, 255, 0.07); --lamp: rgba(255, 178, 92, 0.13);
    --sans: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; --mono: 'IBM Plex Mono', Consolas, monospace;
    /* the app's font variables (next/font sets them on <html> by a class this page lacks): the borrowed sheets use them */
    --font-sans: var(--sans); --font-mono: var(--mono);
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper-lo); }
  body { position: relative; color: var(--ink); font-family: var(--sans); }
  /* the paper: the app's navy with its drafting grid (fine 24 px, major 120 px), a soft vignette */
  .paper { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 75% 70% at 50% 45%, rgba(26, 76, 143, 0.55), rgba(6, 20, 46, 0) 70%),
      linear-gradient(var(--paper), var(--paper)); }
  .grid { position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(127, 224, 255, 0.10) 1px, transparent 1px), linear-gradient(90deg, rgba(127, 224, 255, 0.10) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position: 0 0; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 85% at 50% 50%, transparent 55%, rgba(2, 10, 24, 0.6)); }
  svg.draft { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  svg.draft line, svg.draft path, svg.draft rect { fill: none; stroke: var(--line); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--d, 1s) cubic-bezier(.6, 0, .2, 1) var(--t, 0s) both; }
  .undraw { animation: draw var(--d, 1s) cubic-bezier(.6, 0, .2, 1) var(--t, 0s) both, fadeout var(--d2, .5s) ease-in var(--t2, 3s) forwards; }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  
  .sec { position: absolute; inset: 0; }
  .wipe { clip-path: inset(-20% 100% -20% 0); animation: wipe var(--d, .9s) cubic-bezier(.6, 0, .2, 1) var(--t, 0s) both; }
  @keyframes wipe { to { clip-path: inset(-20% 0 -20% 0); } }
  .rise { opacity: 0; animation: rise var(--d, .8s) cubic-bezier(.2, .7, .2, 1) var(--t, 0s) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  /* a section leaves: wiped off to the right, the way a drafter clears a sheet */
  /* several animations on one element must be one animation list (a later class would replace the whole property);
     a leaving animation fills forwards only, so it never overrides the arrival before its own start */
  .wipe.out { animation: wipe var(--d, .9s) cubic-bezier(.6, 0, .2, 1) var(--t, 0s) both, out var(--od, .5s) cubic-bezier(.6, 0, .4, 1) var(--ot, 4s) forwards; }
  .rise.fadeout { animation: rise var(--d, .8s) cubic-bezier(.2, .7, .2, 1) var(--t, 0s) both, fadeout var(--od, .5s) ease-in var(--ot, 4s) forwards; }
  @keyframes out { from { clip-path: inset(-20% 0 -20% 0); opacity: 1; } to { clip-path: inset(-20% 0 -20% 100%); opacity: .2; } }
  .fadeout { animation: fadeout var(--od, .5s) ease-in var(--ot, 4s) forwards; }
  @keyframes fadeout { to { opacity: 0; } }

  .kicker { font-family: var(--mono); font-size: 22px; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); }
  .title { font-family: var(--sans); font-weight: 600; font-size: 120px; line-height: 1; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-hi); white-space: nowrap; }
  .sub { font-family: var(--sans); font-size: 52px; font-weight: 400; color: var(--ink); }
  .line { font-family: var(--sans); font-size: 64px; font-weight: 500; line-height: 1.12; color: var(--ink-hi); }
  .line.two { font-size: 58px; }
  .note { font-family: var(--mono); font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }

  /* the files and tickets of the problem, then the rooms of the answer: plain drafted boxes */
  .tile { position: absolute; left: 0; top: 0; width: 22px; height: 13px; border: 1.5px solid rgba(223, 240, 255, 0.62); background: rgba(127, 224, 255, 0.06); box-sizing: border-box;
    opacity: 0; animation: tileIn .5s ease-out var(--ti) both, tileGo 1.3s cubic-bezier(.65, 0, .25, 1) var(--tg) forwards, fadeout .45s ease-in 11.35s forwards; }
  @keyframes tileIn { from { opacity: 0; transform: translate(var(--x0), var(--y0)) rotate(var(--r)) scale(.4); } to { opacity: 1; transform: translate(var(--x0), var(--y0)) rotate(var(--r)); } }
  @keyframes tileGo { from { opacity: 1; transform: translate(var(--x0), var(--y0)) rotate(var(--r)); } to { opacity: 1; transform: translate(var(--x1), var(--y1)) rotate(0deg); border-color: rgba(127, 224, 255, 0.9); } }
  .ticket { position: absolute; height: 18px; border: 1.5px solid rgba(223, 240, 255, 0.5); box-sizing: border-box; border-left: 6px solid var(--amber); }
  .glow { position: absolute; left: 1240px; top: 140px; width: 760px; height: 820px; transform: translateX(-50%);
    background: radial-gradient(ellipse 50% 60% at 50% 20%, rgba(255, 178, 92, 0.30), rgba(255, 178, 92, 0) 70%);
    clip-path: polygon(47% 0, 53% 0, 100% 100%, 0 100%); opacity: 0; animation: glowIn 1s ease-out 9.0s both, fadeout .45s ease-in 11.35s forwards; }
  @keyframes glowIn { to { opacity: 1; } }
  .wing { position: absolute; font-family: var(--mono); font-size: 18px; letter-spacing: .16em; color: var(--accent); white-space: nowrap; }
</style>
</head>
<body>
<div class="paper"></div>
<div class="grid"></div>

<!-- 0.0-4.2  the title -->
<div class="sec fadeout" style="--ot: 3.75s; --od: .45s">
  <svg class="draft" viewBox="0 0 1920 1080">
    <line class="draw" pathLength="1" x1="120" y1="560" x2="1800" y2="560" style="--t: .05s; --d: 1.1s" />
    <line class="draw" pathLength="1" x1="120" y1="300" x2="1800" y2="300" style="--t: .25s; --d: 1.1s; opacity: .45" />
    <line class="draw" pathLength="1" x1="216" y1="250" x2="216" y2="760" style="--t: .4s; --d: .9s" />
    <line class="draw" pathLength="1" x1="1704" y1="250" x2="1704" y2="760" style="--t: .55s; --d: .9s" />
    <!-- dimension line under the subtitle, with its arrowheads -->
    <line class="draw" pathLength="1" x1="216" y1="720" x2="1704" y2="720" style="--t: 1.5s; --d: 1s; opacity: .7" />
    <path class="draw" pathLength="1" d="M232 712 L216 720 L232 728" style="--t: 1.5s; --d: .3s" />
    <path class="draw" pathLength="1" d="M1688 712 L1704 720 L1688 728" style="--t: 2.3s; --d: .3s" />
  </svg>
  <div class="kicker rise" style="position: absolute; left: 216px; top: 318px; --t: .6s">Sheet 00 · Title</div>
  <div class="title wipe" style="position: absolute; left: 216px; top: 418px; --t: .45s; --d: 1.15s">Developer's Blueprint</div>
  <div class="sub rise" style="position: absolute; left: 216px; top: 596px; --t: 1.55s; --d: .9s">Your codebase as an architect's drawing.</div>
</div>

<!-- 4.2-8.4  the problem -->
<div class="sec">
  <div class="line wipe out" style="position: absolute; left: 160px; top: 150px; width: 1600px; --t: 4.3s; --d: 1s; --ot: 8.05s; --od: .4s">Software teams lose the shape of their product.</div>
  <svg class="draft" viewBox="0 0 1920 1080">
    <line class="undraw" pathLength="1" x1="160" y1="250" x2="1760" y2="250" style="--t: 4.45s; --d: 1s; --t2: 8.05s; --d2: .4s" />
  </svg>
  <div class="note rise fadeout" style="position: absolute; left: 160px; top: 300px; --t: 5.4s; --ot: 8.05s; --od: .35s">Thousands of files</div>
  <div class="note rise fadeout" style="position: absolute; left: 1330px; top: 300px; --t: 6.3s; --ot: 8.05s; --od: .35s">A list of tickets</div>
  <div id="tickets"></div>
</div>

<!-- 8.4-12.0  the answer: the files draw themselves into a building, under the lamp -->
<div class="glow"></div>
<svg class="draft" viewBox="0 0 1920 1080" id="plan"></svg>
<div id="tiles"></div>
<div class="sec">
  <div class="line wipe out" style="position: absolute; left: 160px; top: 330px; width: 900px; --t: 8.5s; --d: 1s; --ot: 9.95s; --od: .35s">Glim, a desk-lamp companion,<br>draws it as a building</div>
  <div class="line two wipe out" style="position: absolute; left: 160px; top: 330px; width: 900px; --t: 10.05s; --d: .8s; --ot: 11.35s; --od: .45s">you can walk, scan and decide on,<br>on the web and in VR.</div>
</div>
<div class="vignette"></div>

<script>
  // Deterministic layout (a fixed seed): 133 files scattered over the sheet, then placed in 13 rooms of 5 wings (the
  // tutorial project's shape: 5 wings, 13 rooms, 133 features).
  let h = 1234567; const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const WINGS = [[20, 12], [10, 10, 9, 9], [17], [8, 8, 8], [8, 7, 7]];
  const X0 = 1000, X1 = 1760, Y0 = 400, Y1 = 900, GAP = 14;
  const ww = (X1 - X0 - GAP * (WINGS.length - 1)) / WINGS.length;
  const plan = document.getElementById('plan'), tiles = document.getElementById('tiles');
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  const targets = [];
  let k = 0;
  WINGS.forEach((rooms, wi) => {
    const x = X0 + wi * (ww + GAP);
    el('rect', { x, y: Y0, width: ww, height: Y1 - Y0, pathLength: 1, class: 'draw', style: `--t: ${8.55 + wi * 0.12}s; --d: 1.1s; stroke: rgba(223,240,255,.85); stroke-width: 2` }, plan);
    const total = rooms.reduce((a, b) => a + b, 0);
    let y = Y0;
    rooms.forEach((n, ri) => {
      const rh = (Y1 - Y0) * n / total;
      if (ri) el('line', { x1: x, y1: y, x2: x + ww, y2: y, pathLength: 1, class: 'draw', style: `--t: ${9.0 + wi * 0.1 + ri * 0.06}s; --d: .6s` }, plan);
      const cols = 5, cw = (ww - 16) / cols;
      for (let i = 0; i < n; i++) targets.push([x + 8 + (i % cols) * cw + (cw - 22) / 2, y + 10 + Math.floor(i / cols) * 19, k++]);
      y += rh;
    });
    const lab = document.createElement('div');
    lab.className = 'wing rise'; lab.textContent = 'ABCDE'[wi];
    lab.style.cssText = `left: ${x}px; top: ${Y0 - 32}px; --t: ${8.8 + wi * 0.1}s; animation: rise .6s ease-out ${8.8 + wi * 0.1}s both, fadeout .45s ease-in 11.35s forwards`;
    document.body.appendChild(lab);
  });
  // the plan's outline leaves with the rest at the end
  plan.style.animation = 'fadeout .45s ease-in 11.35s forwards';
  // the lamp: a drafted desk lamp above the building, its shade toward the plan
  const lamp = 'M1240 120 L1240 60 L1380 60 M1240 120 L1200 160 L1280 160 Z';
  el('path', { d: 'M1380 60 L1380 30 L1460 30', pathLength: 1, class: 'draw', style: '--t: 8.5s; --d: .5s; stroke: rgba(255,195,90,.9); stroke-width: 2' }, plan);
  el('path', { d: lamp, pathLength: 1, class: 'draw', style: '--t: 8.6s; --d: .8s; stroke: rgba(255,195,90,.95); stroke-width: 2.5' }, plan);
  el('circle', { cx: 1240, cy: 166, r: 6, style: 'fill: #ffc35a; stroke: none; opacity: 0; animation: glowIn .4s ease-out 9.0s both' }, plan);

  // files: scattered over the lower sheet (left two thirds), drifting in, then flown to their rooms
  for (const [tx, ty, i] of targets) {
    const d = document.createElement('div');
    d.className = 'tile';
    const sx = 160 + rnd() * 1060, sy = 380 + rnd() * 500;
    d.style.cssText = `--x0: ${sx.toFixed(0)}px; --y0: ${sy.toFixed(0)}px; --r: ${((rnd() - .5) * 50).toFixed(1)}deg; --x1: ${tx.toFixed(0)}px; --y1: ${ty.toFixed(0)}px; ` +
      `--ti: ${(4.75 + rnd() * 1.4).toFixed(2)}s; --tg: ${(8.45 + (i / targets.length) * 0.9 + rnd() * 0.2).toFixed(2)}s`;
    tiles.appendChild(d);
  }
  // tickets: a long list on the right, appearing one under another, cleared when the plan arrives
  const tk = document.getElementById('tickets');
  for (let i = 0; i < 24; i++) {
    const t = document.createElement('div');
    t.className = 'ticket';
    const w = 260 + rnd() * 160, at = 6.3 + i * 0.06;
    t.style.cssText = `left: 1330px; top: ${370 + i * 22}px; width: ${w.toFixed(0)}px; animation: rise .35s ease-out ${at.toFixed(2)}s both, fadeout .35s ease-in ${(8.05 + i * 0.01).toFixed(2)}s forwards`;
    tk.appendChild(t);
  }

  // borrow the app's stylesheets (its fonts) when served by the app; standalone, the fallbacks draw
  window.__introReady = (async () => {
    try {
      const html = await (await fetch('/projects', { cache: 'no-store' })).text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const links = [...doc.querySelectorAll('link[rel="stylesheet"]')];
      await Promise.all(links.map((l) => new Promise((ok) => { const n = document.createElement('link'); n.rel = 'stylesheet'; n.href = l.getAttribute('href'); n.onload = n.onerror = ok; document.head.appendChild(n); })));
      // globals.css paints body; this sheet's own paper stays on top of it
    } catch { /* standalone preview */ }
    await document.fonts.load("600 120px 'IBM Plex Sans Condensed'").catch(() => {});
    await document.fonts.load("500 64px 'IBM Plex Sans Condensed'").catch(() => {});
    await document.fonts.load("400 26px 'IBM Plex Mono'").catch(() => {});
    await document.fonts.ready;
    return [...document.fonts].filter((f) => f.status === 'loaded').map((f) => f.family + ' ' + f.weight);
  })();
</script>
</body>
</html>
