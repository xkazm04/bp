<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: an operational atlas. A left-to-right tidy tree (product > domains > modules > a row of feature cards per module) on a dotted infinite canvas, framed by a two-row command bar (lenses with live completion, status filters) and edge tools (inspector, minimap, zoom). */
:root {
  /* named palette: cool paper and graphite ink */
  --paper-white: #ffffff;
  --cool-paper: #eef1f5;
  --graphite: #1b2230;
  --slate: #727d8f;
  --mist: #dce1e8;

  /* surfaces */
  --canvas: var(--cool-paper);
  --canvas-dot: #c2c9d4;
  --paper: var(--paper-white);
  --paper-2: #f6f7f9;
  --paper-3: #e8ebf0;
  --plate: #f8f9fb;
  --chrome: #fbfcfd;
  --chrome-2: #f0f2f5;
  --chrome-line: #dbe0e7;
  --ink: var(--graphite);
  --ink-2: #445064;
  --ink-3: var(--slate);
  --ink-4: #a6afbc;
  --rule: var(--mist);
  --rule-2: #c6cdd7;
  --wire: #9ba5b4;
  --root-bg: #1c2431;
  --root-fg: #f3f5f8;
  --root-fg-2: #a3adbd;
  --shadow: rgba(26, 34, 50, 0.08);
  --shadow-2: rgba(26, 34, 50, 0.16);
  --scrim: rgba(18, 24, 34, 0.26);
  --lift: rgba(255, 255, 255, 0);
  --band: rgba(255, 255, 255, 0.5);
  --band-line: rgba(27, 34, 48, 0.05);
  --lens-overall: var(--graphite);
  --hf3-overall: #ffffff;
  --on-heat: #ffffff;
  --hm0: 8%; --hm1: 22%; --hm2: 40%; --hm3: 62%; --hm4: 86%;

  /* status (semantic) */
  --live: #1d8148;
  --ready: #4cae78;
  --building: #d08708;
  --planned: #8893a6;
  --blocked: #d3372b;

  /* dimension hues */
  --dev: #3357d2;
  --ops: #0a8a8a;
  --biz: #8a4cc4;

  /* signals */
  --attn: #d3372b;
  --trust: #c0287c;
  --hit: #efbd16;
  --sel: var(--graphite);
  --link: var(--graphite);

  /* type roles: display (names, numbers in titles), ui (labels, copy), data (codes, counts, %) */
  --f-display: "Geist", "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-ui: "Geist", "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-data: "Geist Mono", "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --topbar-h: 52px;
  --hud-h: 42px;
  --insp-w: 392px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #13161b; --canvas-dot: #2b313a; --paper: #1c2027; --paper-2: #22272f; --paper-3: #2a3039; --plate: #181c22;
    --chrome: #171a1f; --chrome-2: #1f232a; --chrome-line: #2a2f37;
    --ink: #e7eaef; --ink-2: #b1b8c4; --ink-3: #848d9b; --ink-4: #5b6471;
    --rule: #2c323b; --rule-2: #3b424d; --wire: #535d6c;
    --root-bg: #272d37; --root-fg: #f1f3f7; --root-fg-2: #98a2b2;
    --shadow: rgba(0, 0, 0, 0.32); --shadow-2: rgba(0, 0, 0, 0.5); --scrim: rgba(0, 0, 0, 0.5); --lift: rgba(255, 255, 255, 0.045);
    --band: rgba(255, 255, 255, 0.022); --band-line: rgba(255, 255, 255, 0.04);
    --lens-overall: #b9c2d0; --hf3-overall: #e7eaef; --on-heat: #10131a;
    --hm0: 10%; --hm1: 22%; --hm2: 36%; --hm3: 50%; --hm4: 80%;
    --live: #45bf7b; --ready: #8bd4a9; --building: #f0ab35; --planned: #8f99ab; --blocked: #ff6356;
    --dev: #7f9cff; --ops: #3ec7bf; --biz: #b98cf1;
    --attn: #ff6356; --trust: #ff6abc; --hit: #ffd84c; --sel: #e7eaef; --link: #e7eaef;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #13161b; --canvas-dot: #2b313a; --paper: #1c2027; --paper-2: #22272f; --paper-3: #2a3039; --plate: #181c22;
  --chrome: #171a1f; --chrome-2: #1f232a; --chrome-line: #2a2f37;
  --ink: #e7eaef; --ink-2: #b1b8c4; --ink-3: #848d9b; --ink-4: #5b6471;
  --rule: #2c323b; --rule-2: #3b424d; --wire: #535d6c;
  --root-bg: #272d37; --root-fg: #f1f3f7; --root-fg-2: #98a2b2;
  --shadow: rgba(0, 0, 0, 0.32); --shadow-2: rgba(0, 0, 0, 0.5); --scrim: rgba(0, 0, 0, 0.5); --lift: rgba(255, 255, 255, 0.045);
  --band: rgba(255, 255, 255, 0.022); --band-line: rgba(255, 255, 255, 0.04);
  --lens-overall: #b9c2d0; --hf3-overall: #e7eaef; --on-heat: #10131a;
  --hm0: 10%; --hm1: 22%; --hm2: 36%; --hm3: 50%; --hm4: 80%;
  --live: #45bf7b; --ready: #8bd4a9; --building: #f0ab35; --planned: #8f99ab; --blocked: #ff6356;
  --dev: #7f9cff; --ops: #3ec7bf; --biz: #b98cf1;
  --attn: #ff6356; --trust: #ff6abc; --hit: #ffd84c; --sel: #e7eaef; --link: #e7eaef;
  color-scheme: dark;
}

/* ───────────── base ───────────── */
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--canvas); color: var(--ink);
  font: 400 13px/1.4 var(--f-ui);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd, .kbd {
  font: 500 10.5px/1 var(--f-data); color: var(--ink-3);
  border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--paper);
}
svg.ico { width: 16px; height: 16px; flex: none; display: block; }
.ico-ln { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ico-fill { fill: currentColor; }

#app {
  --lens: var(--lens-overall);
  --hf3: var(--hf3-overall);
  height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr);
}
#app[data-lens="dev"] { --lens: var(--dev); --hf3: var(--ink); }
#app[data-lens="ops"] { --lens: var(--ops); --hf3: var(--ink); }
#app[data-lens="biz"] { --lens: var(--biz); --hf3: var(--ink); }

/* ───────────── top bar ───────────── */
#topbar {
  display: flex; align-items: center; gap: 14px; min-width: 0;
  height: var(--topbar-h); padding: 0 14px 0 16px;
  background: var(--chrome); border-bottom: 1px solid var(--chrome-line);
  position: relative; z-index: 6;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: none; }
.brand .mark { width: 24px; height: 24px; }
.mark-ln { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mark-dot { fill: var(--ink); }
.mark-sq { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.brand-name { font: 600 14px/1 var(--f-display); letter-spacing: -0.01em; }
.brand-name span { color: var(--ink-3); font-weight: 500; }
.brand-sep { width: 1px; height: 22px; background: var(--chrome-line); }
.prod { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.prod b { font: 600 14px/1 var(--f-display); }
.ver { font: 500 11.5px/1 var(--f-data); color: var(--ink-2); padding: 3px 6px; border-radius: 5px; background: var(--chrome-2); border: 1px solid var(--chrome-line); }
.next { font: 400 11px/1 var(--f-data); color: var(--ink-3); }

#lenses { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--chrome-2); border: 1px solid var(--chrome-line); margin: 0 auto; min-width: 0; }
.lens {
  --lc: var(--lens-overall);
  appearance: none; border: 0; background: transparent; cursor: pointer;
  display: grid; grid-template-columns: auto auto; grid-template-rows: auto 3px; column-gap: 8px; row-gap: 4px; align-items: baseline;
  padding: 6px 11px 6px; border-radius: 7px; color: var(--ink-2); min-width: 0;
}
.lens[data-lens="dev"] { --lc: var(--dev); }
.lens[data-lens="ops"] { --lc: var(--ops); }
.lens[data-lens="biz"] { --lc: var(--biz); }
.lens-name { font: 500 12.5px/1 var(--f-ui); white-space: nowrap; }
.lens-name .short { display: none; }
.lens-val { font: 600 12px/1 var(--f-data); color: var(--ink); font-variant-numeric: tabular-nums; justify-self: end; }
.lens-bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.lens-bar i { display: block; height: 100%; background: var(--lc); border-radius: 2px; }
.lens:hover { background: var(--paper-3); color: var(--ink); }
.lens[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px var(--shadow-2), 0 0 0 1px var(--chrome-line); }
.lens[aria-pressed="true"] .lens-name { font-weight: 600; }
.lens-key { display: none; }

.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.search { position: relative; display: flex; align-items: center; }
.search .ico { position: absolute; left: 10px; color: var(--ink-3); pointer-events: none; }
#search {
  width: 232px; height: 34px; padding: 0 64px 0 32px; border-radius: 8px;
  border: 1px solid var(--chrome-line); background: var(--paper); color: var(--ink);
  font: 400 13px/1 var(--f-ui); outline: none;
}
#search::placeholder { color: var(--ink-3); }
#search:focus { border-color: var(--ink-3); box-shadow: 0 0 0 3px var(--paper-3); }
#search::-webkit-search-cancel-button { display: none; }
.search .kbd { position: absolute; right: 8px; }
.search-count { position: absolute; right: 32px; font: 500 11px/1 var(--f-data); color: var(--ink-3); }
.ib, .tb {
  appearance: none; height: 34px; min-width: 34px; border-radius: 8px; border: 1px solid var(--chrome-line);
  background: var(--paper); color: var(--ink-2); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 9px;
}
.ib:hover, .tb:hover { color: var(--ink); border-color: var(--rule-2); }
.tb { font: 500 12.5px/1 var(--f-ui); padding: 0 11px 0 9px; }
.tb[aria-pressed="true"] { background: color-mix(in oklab, var(--trust) 12%, var(--paper)); border-color: var(--trust); color: var(--ink); }
.tb[aria-pressed="true"] .tb-glyph { color: var(--trust); }
.ib[aria-pressed="true"] { background: var(--chrome-2); color: var(--ink); border-color: var(--rule-2); }
.phone-only { display: none !important; }

/* ───────────── HUD row ───────────── */
#hud {
  display: flex; align-items: center; gap: 6px; min-width: 0;
  height: var(--hud-h); padding: 0 16px;
  background: var(--chrome); border-bottom: 1px solid var(--chrome-line);
  position: relative; z-index: 5;
}
.chips { display: flex; align-items: center; gap: 4px; min-width: 0; }
.hud-label { font: 500 10.5px/1 var(--f-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-right: 6px; white-space: nowrap; }
.chip {
  --cut: var(--paper);
  appearance: none; height: 28px; border-radius: 7px; border: 1px solid transparent; background: transparent; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; padding: 0 9px 0 7px; color: var(--ink-2); white-space: nowrap;
}
.chip svg { width: 14px; height: 14px; flex: none; }
.chip-label { font: 500 12.5px/1 var(--f-ui); }
.chip-n { font: 600 12px/1 var(--f-data); color: var(--ink); font-variant-numeric: tabular-nums; }
.chip:hover { background: var(--chrome-2); }
.chip[aria-pressed="true"] { background: var(--paper); border-color: var(--rule-2); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }
.chip-attn .chip-n { color: var(--attn); }
.chip-attn[aria-pressed="true"] { border-color: var(--attn); background: color-mix(in oklab, var(--attn) 8%, var(--paper)); }
.hud-sep { width: 1px; height: 20px; background: var(--chrome-line); margin: 0 6px; flex: none; }
.hud-spacer { flex: 1; min-width: 8px; }
.link-btn { appearance: none; border: 0; background: none; cursor: pointer; color: var(--ink-2); font: 500 12px/1 var(--f-ui); padding: 6px 8px; border-radius: 6px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-2); white-space: nowrap; }
.link-btn:hover { color: var(--ink); }
.overall-pill { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; font: 500 12px/1 var(--f-ui); color: var(--ink-2); padding: 0 4px; }
.overall-pill b { font: 600 12px/1 var(--f-data); color: var(--ink); }

.queue {
  display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 4px 0 10px; border-radius: 8px;
  background: color-mix(in oklab, var(--trust) 10%, var(--paper)); border: 1px solid color-mix(in oklab, var(--trust) 55%, var(--chrome-line));
  white-space: nowrap; flex: none;
}
.queue[hidden] { display: none; }
.queue-t { font: 500 12px/1 var(--f-ui); color: var(--ink); margin-right: 4px; }
.queue-n { font: 600 12px/1 var(--f-data); color: var(--trust); font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
.qb { appearance: none; width: 24px; height: 24px; border-radius: 6px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
.qb:hover { background: var(--paper); color: var(--ink); }

#crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; font: 500 12px/1 var(--f-ui); color: var(--ink-3); }
#crumbs button { appearance: none; border: 0; background: none; padding: 5px 6px; border-radius: 6px; cursor: pointer; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
#crumbs button:hover { background: var(--chrome-2); color: var(--ink); }
#crumbs button[aria-current] { color: var(--ink); font-weight: 600; }
#crumbs .sep { color: var(--ink-4); }
.focus-tag { font: 600 10px/1 var(--f-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--paper); background: var(--ink); padding: 4px 6px; border-radius: 4px; margin-right: 4px; white-space: nowrap; }

/* ───────────── stage ───────────── */
#stage-wrap { position: relative; overflow: hidden; min-height: 0; background: var(--canvas); }
#stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; }
#stage.panning { cursor: grabbing; }
#stage:focus-visible { outline: none; }
#stage.kbd:focus-visible { outline: 2px solid var(--ink-3); outline-offset: -3px; }
.dot { fill: var(--canvas-dot); }

/* level visibility (semantic zoom) */
#stage[data-level="far"] .only-mid, #stage[data-level="far"] .only-near, #stage[data-level="far"] .no-far,
#stage[data-level="mid"] .only-far, #stage[data-level="mid"] .only-near, #stage[data-level="mid"] .no-mid,
#stage[data-level="near"] .only-far, #stage[data-level="near"] .only-mid, #stage[data-level="near"] .no-near { display: none; }

.node { transition: opacity 0.22s ease; }
.node.gone { opacity: 0 !important; pointer-events: none; }
.node { cursor: pointer; }

/* tree wiring */
.wire { fill: none; stroke: var(--wire); stroke-linecap: round; stroke-linejoin: round; }
.w1 { stroke-width: 3; }
.w2 { stroke-width: 2; }
.w3 { stroke-width: 1.25; }
.wb0 { stroke: color-mix(in oklab, var(--lens) 30%, var(--wire)); }
.wb1 { stroke: color-mix(in oklab, var(--lens) 48%, var(--wire)); }
.wb2 { stroke: color-mix(in oklab, var(--lens) 64%, var(--wire)); }
.wb3 { stroke: color-mix(in oklab, var(--lens) 82%, var(--wire)); }
.wb4 { stroke: var(--lens); }
#app[data-lens="overall"] .wb0, #app[data-lens="overall"] .wb1, #app[data-lens="overall"] .wb2, #app[data-lens="overall"] .wb3, #app[data-lens="overall"] .wb4 { stroke: var(--wire); }
#tree { transition: opacity 0.22s ease; }
.wire.dimmed { opacity: 0.18; }
.band { fill: var(--band); stroke: var(--band-line); stroke-width: 1; }

/* heat bins (module tiles, domain swatches) */
.hb0 { --heat: color-mix(in oklab, var(--lens) var(--hm0), var(--paper)); --heat-fg: var(--ink); --heat-fg2: var(--ink-2); }
.hb1 { --heat: color-mix(in oklab, var(--lens) var(--hm1), var(--paper)); --heat-fg: var(--ink); --heat-fg2: var(--ink-2); }
.hb2 { --heat: color-mix(in oklab, var(--lens) var(--hm2), var(--paper)); --heat-fg: var(--ink); --heat-fg2: var(--ink-2); }
.hb3 { --heat: color-mix(in oklab, var(--lens) var(--hm3), var(--paper)); --heat-fg: var(--hf3); --heat-fg2: var(--hf3); }
.hb4 { --heat: color-mix(in oklab, var(--lens) var(--hm4), var(--paper)); --heat-fg: var(--on-heat); --heat-fg2: var(--on-heat); }
.heat { fill: var(--heat); }
.heat-fg { fill: var(--heat-fg); }
.heat-fg2 { fill: var(--heat-fg2); opacity: 0.82; }

/* cards */
.fc-bg { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }
.mc-bg { fill: var(--paper); stroke: var(--rule-2); stroke-width: 1; }
.dc-bg { fill: var(--plate); stroke: var(--rule-2); stroke-width: 1.25; }
.lift { fill: none; stroke: var(--lift); stroke-width: 1; }
.rc-bg { fill: var(--root-bg); }
.fc-stblock { fill: color-mix(in oklab, var(--sc) 13%, var(--paper)); }

/* status icon colors */
.st-live { --sc: var(--live); }
.st-ready { --sc: var(--ready); }
.st-building { --sc: var(--building); }
.st-planned { --sc: var(--planned); }
.st-blocked { --sc: var(--blocked); }
.si-fill { fill: var(--sc); }
.si-ring { fill: none; stroke: var(--sc); }
.si-cut { fill: var(--cut, var(--paper)); }
.sb { fill: var(--sc); }

/* facet cells */
.d-dev { --dh: var(--dev); }
.d-ops { --dh: var(--ops); }
.d-biz { --dh: var(--biz); }
.cd { fill: var(--dh); }
#stage[data-level="far"] .fc .cd { fill: color-mix(in oklab, var(--dh) 78%, var(--paper)); }
#stage[data-level="far"] .fc .cp { fill: color-mix(in oklab, var(--dh) 18%, var(--paper)); }
.cp { fill: color-mix(in oklab, var(--dh) 24%, var(--paper)); }
.ct { fill: var(--paper-3); }
.cb { fill: var(--blocked); }
.cn { fill: url(#hatch); }
.cx { fill: none; stroke: var(--paper); stroke-linecap: round; }
.cg { fill: none; stroke: var(--paper); stroke-linecap: round; stroke-linejoin: round; }
.cgi { fill: none; stroke: var(--dh); stroke-linecap: round; }
.hatch-bg { fill: var(--paper-3); }
.hatch-ln { stroke: var(--ink-4); stroke-width: 1.1; }
.trk { fill: var(--paper-3); }
.bar-d { fill: var(--dh); }
.faded { opacity: 0.38; }

/* text roles inside the canvas (sizes are world units) */
.t { fill: var(--ink); }
.t2 { fill: var(--ink-2); }
.t3 { fill: var(--ink-3); }
.tdh { fill: var(--dh); }
.f-ui { font-family: var(--f-ui); }
.f-data { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; }
.caps { letter-spacing: 0.08em; }
.rv-t-changes { fill: var(--attn); }
.rv-t-pending { fill: var(--building); }
.rt { fill: var(--root-fg); }
.rt2 { fill: var(--root-fg-2); }
.rc-bar-trk { fill: color-mix(in oklab, var(--root-fg) 14%, var(--root-bg)); }

/* priority tag */
.ptag { fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 0.8; }
.ptag-t { fill: var(--ink-2); }
.p0 .ptag { fill: var(--ink); stroke: var(--ink); }
.p0 .ptag-t { fill: var(--paper); }

/* built-by glyphs */
.g-ln { fill: none; stroke: var(--gc, var(--ink-3)); stroke-linecap: round; stroke-linejoin: round; }
.g-fill { fill: var(--gc, var(--ink-3)); }

/* knobs and buttons inside the canvas */
.knob-c { fill: var(--paper); stroke: var(--wire); stroke-width: 1.4; }
.knob-g { fill: none; stroke: var(--ink-2); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.knob:hover .knob-c { stroke: var(--ink); }
.knob-n { fill: var(--ink-2); }
.fbtn-c { fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 0.8; }
.fbtn:hover .fbtn-c { stroke: var(--ink); }
.fbtn-g { fill: none; stroke: var(--ink-2); stroke-width: 1; stroke-linecap: round; }

/* marks: attention, trust, selection, search, relation */
.ring-attn { fill: none; stroke: var(--attn); stroke-width: 1.75; }
.flag-attn { fill: var(--attn); }
.flag-bang { fill: var(--paper); }
#stage[data-level="far"] .ring-attn { stroke-width: 3.5; }
.ring-sel, .ring-hit, .ring-rel, .trust-mark, .ring-focus { display: none; }
.ring-sel { fill: none; stroke: var(--sel); stroke-width: 2.5; }
#stage[data-level="far"] .ring-sel { stroke-width: 5; }
.ring-hit { fill: none; stroke: var(--hit); stroke-width: 3.5; }
#stage[data-level="far"] .ring-hit { stroke-width: 6; }
.ring-rel { fill: none; stroke: var(--link); stroke-width: 1.5; stroke-dasharray: 4 3; }
#stage[data-level="far"] .ring-rel { stroke-width: 3; }
.sel > .ring-sel, .hit > .ring-hit, .rel > .ring-rel { display: block; }
.ring-mod { fill: none; stroke: var(--sel); stroke-width: 2.5; }
.trust-ring { fill: color-mix(in oklab, var(--trust) 7%, transparent); stroke: var(--trust); stroke-width: 1.6; stroke-dasharray: 5 3; }
#stage[data-level="far"] .trust-ring { stroke-width: 3; stroke-dasharray: 8 5; }
.trust-seal { fill: var(--trust); }
.trust-glyph { fill: none; stroke: var(--paper); stroke-linecap: round; stroke-linejoin: round; }
.trust-eye { fill: var(--paper); }
.trust-tag { fill: var(--trust); }
.trust-tag-t { fill: var(--paper); }
#stage.trust .queue .trust-mark { display: block; }
#stage.trust .queue .score { display: none; }
.mod-q { display: none; }
#stage.trust .mod-q { display: block; }

/* dependency links */
.dep-halo { fill: none; stroke: var(--canvas); stroke-linecap: round; opacity: 0.55; }
.dep-up { fill: none; stroke: var(--link); stroke-linecap: round; }
.dep-down { fill: none; stroke: var(--ink-3); stroke-linecap: round; }
.dep-arrow-up { fill: var(--link); }
.dep-arrow-down { fill: var(--ink-3); }
.dep-dot { fill: var(--link); }

/* collapsed pips */
.pip-t { fill: var(--ink-3); }

/* ───────────── overlays on the stage ───────────── */
.panel {
  background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 12px;
  box-shadow: 0 10px 30px var(--shadow), 0 1px 3px var(--shadow);
}
#zoombar {
  position: absolute; right: 16px; bottom: 16px; z-index: 3;
  display: flex; align-items: center; gap: 2px; padding: 3px;
  transition: right 0.25s ease;
}
#zoombar button {
  appearance: none; border: 0; background: transparent; height: 28px; min-width: 28px; border-radius: 7px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); padding: 0 7px;
}
#zoombar button:hover { background: var(--chrome-2); color: var(--ink); }
.zl { font: 500 11.5px/1 var(--f-ui); }
.zl[aria-pressed="true"] { background: var(--paper) !important; color: var(--ink) !important; box-shadow: 0 0 0 1px var(--chrome-line); font-weight: 600; }

}

.mm-cap { position: absolute; left: 12px; top: 9px; font: 600 9.5px/1 var(--f-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); pointer-events: none; }
#app.insp-open #zoombar, #app.insp-open #minimap { right: calc(var(--insp-w) + 16px); }

#focus-pill {

}

.tip {

/* inspector and legend */
#inspector {
  position: absolute; top: 0; right: 0; bottom: 0; width: var(--insp-w); z-index: 4;
  background: var(--chrome); border-left: 1px solid var(--chrome-line);

}
#inspector.open { transform: none; visibility: visible; transition: transform 0.28s cubic-bezier(.2,.8,.2,1); }
.sheet-grip { display: none; }
.insp-top { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 20px; flex: none; }
.insp-crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; min-width: 0; flex: 1; font: 500 12px/1.2 var(--f-ui); color: var(--ink-3); }
.insp-crumbs button { appearance: none; border: 0; background: none; padding: 4px 5px; margin-left: -5px; border-radius: 5px; color: var(--ink-2); cursor: pointer; font: inherit; }

.x-btn { appearance: none; width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); flex: none; }

.insp-body { overflow-y: auto; overscroll-behavior: contain; padding: 6px 20px 28px; min-height: 0; flex: 1; }
.insp-title { font: 600 21px/1.2 var(--f-display); letter-spacing: -0.015em; margin: 4px 0 10px; text-wrap: balance; }
.insp-code { font: 600 11px/1 var(--f-data); letter-spacing: 0.06em; color: var(--ink-3); margin-right: 8px; vertical-align: 3px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag {
  --cut: var(--chrome);
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px;
  border: 1px solid var(--chrome-line); background: var(--paper); font: 500 12px/1 var(--f-ui); color: var(--ink-2); white-space: nowrap;
}
.tag svg { width: 13px; height: 13px; }
.tag b { color: var(--ink); font-weight: 600; }
.tag-mono { font: 600 11.5px/1 var(--f-data); }
.tag-p0 { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag-attn { border-color: var(--attn); color: var(--attn); }
.tag-trust { border-color: var(--trust); color: var(--trust); background: color-mix(in oklab, var(--trust) 8%, var(--paper)); }
.summary { color: var(--ink-2); font-size: 13.5px; line-height: 1.5; margin: 0 0 14px; max-width: 60ch; }
.callout { border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-size: 12.5px; line-height: 1.45; border: 1px solid var(--chrome-line); background: var(--paper); }
.callout b { display: block; font: 600 10.5px/1 var(--f-data); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 5px; color: var(--ink-3); }
.callout-blocked { border-color: color-mix(in oklab, var(--blocked) 45%, var(--chrome-line)); background: color-mix(in oklab, var(--blocked) 7%, var(--paper)); }

.callout-trust { border-color: color-mix(in oklab, var(--trust) 45%, var(--chrome-line)); background: color-mix(in oklab, var(--trust) 6%, var(--paper)); }
.callout-trust b { color: var(--trust); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--chrome-line); border: 1px solid var(--chrome-line); border-radius: 9px; overflow: hidden; margin: 0 0 18px; }
.fact { background: var(--paper); padding: 9px 11px; min-width: 0; }
.fact dt { font: 500 10px/1 var(--f-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.fact dd { margin: 0; font: 500 13px/1.3 var(--f-ui); color: var(--ink); display: flex; align-items: center; gap: 6px; min-width: 0; }
.fact dd svg { width: 14px; height: 14px; flex: none; }
.fact dd .sub { color: var(--ink-3); font-size: 12px; }
.fact dd.wrap { flex-wrap: wrap; gap: 2px 8px; }
.nowrap { white-space: nowrap; }
.rv-approved { color: var(--live); } .rv-pending { color: var(--building); } .rv-changes { color: var(--attn); } .rv-none { color: var(--ink-3); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 18px 0 8px; }
.sec-h h3 { margin: 0; font: 600 10.5px/1 var(--f-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.sec-h span { font: 500 11.5px/1 var(--f-data); color: var(--ink-3); }
.dimblock { border: 1px solid var(--chrome-line); border-radius: 9px; background: var(--paper); padding: 10px 12px 11px; margin-bottom: 8px; }
.dimblock.is-lens { border-color: var(--dh); box-shadow: 0 0 0 1px var(--dh); }
.dim-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.dim-name { font: 600 13px/1 var(--f-ui); display: flex; align-items: center; gap: 7px; }
.dim-sw { width: 9px; height: 9px; border-radius: 2px; background: var(--dh); }
.dim-q { font: 400 11.5px/1.3 var(--f-ui); color: var(--ink-3); margin: 4px 0 8px 16px; }
.dim-pct { font: 600 13px/1 var(--f-data); font-variant-numeric: tabular-nums; }
.hbar { height: 5px; border-radius: 3px; background: var(--paper-3); overflow: hidden; }
.hbar i { display: block; height: 100%; background: var(--dh); border-radius: 3px; }
.facets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 12px; }
.facet { display: flex; align-items: center; gap: 7px; min-width: 0; font: 400 12.5px/1.2 var(--f-ui); color: var(--ink); }
.facet .fs { margin-left: auto; font: 500 10.5px/1 var(--f-data); color: var(--ink-3); white-space: nowrap; }
.facet .fs.s-blocked { color: var(--blocked); }
.facet .fs.s-done { color: var(--ink-2); }
.cell-ico { width: 13px; height: 13px; border-radius: 3px; flex: none; position: relative; }
.ci-done { background: var(--dh); }
.ci-partial { background: linear-gradient(90deg, var(--dh) 50%, color-mix(in oklab, var(--dh) 24%, var(--paper)) 50%); }
.ci-todo { background: var(--paper-3); box-shadow: inset 0 0 0 1px var(--rule-2); }
.ci-blocked { background: var(--blocked); }
.ci-blocked::after { content: ""; position: absolute; left: 3px; right: 3px; top: 5.5px; height: 2px; border-radius: 1px; background: var(--paper); }
.ci-na { background: repeating-linear-gradient(45deg, var(--paper-3) 0 2px, var(--ink-4) 2px 3px); }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.metric { border: 1px solid var(--chrome-line); border-radius: 9px; background: var(--paper); padding: 9px 10px; min-width: 0; }
.metric dt { font: 500 10px/1 var(--f-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.metric dd { margin: 7px 0 0; font: 600 18px/1 var(--f-data); font-variant-numeric: tabular-nums; }
.metric dd small { font-size: 11px; color: var(--ink-3); font-weight: 500; margin-left: 1px; }
.metric dd.na { color: var(--ink-4); font-size: 15px; }
.metric .cap { font: 400 11px/1.3 var(--f-ui); color: var(--ink-3); margin-top: 4px; }
.flist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--chrome-line); border-radius: 9px; overflow: hidden; background: var(--paper); }
.flist li + li { border-top: 1px solid var(--chrome-line); }
.frow {
  --cut: var(--paper);
  appearance: none; border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 9px; padding: 8px 10px; color: var(--ink);
}
.frow:hover { background: var(--paper-2); }
.frow svg { width: 14px; height: 14px; }
.frow-name { font: 500 13px/1.25 var(--f-ui); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow-name small { display: block; font: 400 11px/1.3 var(--f-ui); color: var(--ink-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; }
.frow-meta { display: flex; align-items: center; gap: 6px; font: 500 11px/1 var(--f-data); color: var(--ink-3); }
.mini-bc { display: grid; grid-template-columns: repeat(4, 6px); grid-auto-rows: 4px; gap: 1.5px; }
.mini-bc i { display: block; border-radius: 1px; }
.mark-attn { width: 8px; height: 8px; border-radius: 50%; background: var(--attn); }
.mark-trust { width: 8px; height: 8px; border-radius: 2px; background: var(--trust); transform: rotate(45deg); }
.empty { color: var(--ink-3); font-size: 12.5px; padding: 10px 12px; border: 1px dashed var(--rule-2); border-radius: 9px; }
.sbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 1.5px; margin: 8px 0 8px; }
.sbar i { display: block; height: 100%; background: var(--sc); }
.slegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 400 12px/1.3 var(--f-ui); color: var(--ink-2); }
.slegend span { display: inline-flex; align-items: center; gap: 5px; --cut: var(--chrome); }
.slegend svg { width: 12px; height: 12px; }
.slegend b { font: 600 12px/1 var(--f-data); color: var(--ink); }
.bigstat { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 2px; }
.bigstat b { font: 500 40px/1 var(--f-data); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.bigstat span { color: var(--ink-3); font-size: 12.5px; }
.fcounts { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 1px; margin-top: 8px; }
.fcounts i { display: block; height: 100%; }
.fc-done { background: var(--dh); } .fc-partial { background: color-mix(in oklab, var(--dh) 40%, var(--paper)); } .fc-todo { background: var(--paper-3); } .fc-blocked { background: var(--blocked); } .fc-na { background: repeating-linear-gradient(45deg, var(--paper-3) 0 2px, var(--ink-4) 2px 3px); }
.fc-legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 6px; font: 400 11px/1.3 var(--f-data); color: var(--ink-3); }
.actions { display: flex; gap: 8px; margin: 4px 0 14px; flex-wrap: wrap; }
.btn {
  appearance: none; height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--chrome-line); background: var(--paper); color: var(--ink); font: 500 12.5px/1 var(--f-ui);
  display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { border-color: var(--rule-2); background: var(--paper-2); }
.btn-ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-ink:hover { background: var(--ink-2); border-color: var(--ink-2); }
.rel-list { display: flex; flex-direction: column; gap: 3px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--chrome-line); font-size: 12.5px; }
.timeline .rl { font: 600 12px/1 var(--f-data); }
.timeline .rd { color: var(--ink-3); font: 400 11.5px/1 var(--f-data); }
.timeline .rs { font: 500 10px/1 var(--f-data); letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 5px; border-radius: 4px; border: 1px solid var(--chrome-line); color: var(--ink-3); }
.timeline .rs-next { color: var(--paper); background: var(--ink); border-color: var(--ink); }
.stack { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; font-size: 12.5px; margin: 0; }
.stack dt { font: 500 10.5px/1.6 var(--f-data); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.stack dd { margin: 0; color: var(--ink); }

#legend {
  position: absolute; left: 16px; bottom: 16px; z-index: 4; width: 350px; max-height: calc(100% - 32px);
  display: flex; flex-direction: column; min-height: 0;
  transform: translateY(12px); opacity: 0; visibility: hidden; transition: transform 0.2s ease, opacity 0.2s ease, visibility 0s linear 0.2s;
}
#legend.open { transform: none; opacity: 1; visibility: visible; transition: transform 0.2s ease, opacity 0.2s ease; }
.lg-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 4px 16px; flex: none; }

.lg-body { overflow-y: auto; padding: 2px 16px 16px; min-height: 0; }
.lg-sec { padding: 10px 0; border-top: 1px solid var(--chrome-line); }
.lg-sec:first-child { border-top: 0; padding-top: 4px; }
.lg-sec h3 { margin: 0 0 8px; font: 600 10px/1 var(--f-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.lg-grid { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); --cut: var(--chrome); }
.lg-grid b { color: var(--ink); font-weight: 600; }
.lg-grid svg { width: 18px; height: 18px; display: block; }
.lg-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.lg-row span { display: inline-flex; align-items: center; gap: 5px; }
.lg-row svg { width: 16px; height: 16px; flex: none; }
.ramp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin: 2px 0 4px; }
.ramp i { height: 14px; border-radius: 3px; background: var(--heat); }
.ramp-l { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; font: 500 10px/1 var(--f-data); color: var(--ink-3); text-align: center; }
.lg-anat { display: grid; grid-template-columns: 30px repeat(4, minmax(0, 1fr)); gap: 3px 4px; align-items: center; font: 400 10.5px/1.1 var(--f-ui); color: var(--ink-2); }
.lg-anat .rl { font: 600 10px/1 var(--f-data); color: var(--dh); }
.lg-anat .c { display: flex; align-items: center; gap: 4px; min-width: 0; white-space: nowrap; overflow: hidden; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 12px; color: var(--ink-2); align-items: center; }
.keys kbd { justify-self: start; white-space: nowrap; }
.swatch-ring { width: 18px; height: 12px; border-radius: 3px; display: block; }
.sw-attn { border: 2px solid var(--attn); }
.sw-trust { border: 2px dashed var(--trust); background: color-mix(in oklab, var(--trust) 8%, transparent); }
.sw-hit { border: 3px solid var(--hit); }
.sw-sel { border: 2.5px solid var(--sel); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ───────────── narrow screens and phones ───────────── */
@media (max-width: 1180px) {
  .lens-name .long { display: none; }
  .lens-name .short { display: inline; }
  #search { width: 190px; }
  .tb-label { display: none; }
  .brand-name { display: none; }
  .brand-sep { display: none; }
}
@media (max-width: 960px) {
  .chip-label { display: none; }
  .next { display: none; }
  #zoombar .zl, #zoombar .zsep { display: none; }
}
#app.is-tall #zoombar { flex-direction: column; right: 10px; }
#app.is-tall #zoombar .zl, #app.is-tall #zoombar .zsep, #app.is-tall #zoom-pct { display: none; }
#app.is-tall #zoombar button { width: 36px; height: 36px; }
@media (max-width: 720px) {
  :root { --topbar-h: 48px; --hud-h: 40px; }

  .brand { height: 48px; gap: 8px; }
  .brand .mark { width: 22px; height: 22px; }
  .tools { margin-left: auto; gap: 6px; }
  .ib, .tb { height: 34px; min-width: 34px; padding: 0 8px; }
  .phone-only { display: inline-flex !important; }
  .search { display: none; }
  #topbar.searching .search { display: flex; position: absolute; left: 8px; right: 8px; top: 7px; z-index: 2; }
  #topbar.searching #search { width: 100%; height: 34px; }
  #lenses { order: 10; flex-basis: 100%; margin: 0 0 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lens { padding: 6px 8px; column-gap: 4px; }
  .lens-name { font-size: 12px; }
  #hud { padding: 0 8px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  #hud::-webkit-scrollbar { display: none; }
  .hud-label, #crumbs, .overall-pill, .hud-spacer { display: none; }
  .chips { flex: none; }
  .chip { padding: 0 7px 0 6px; gap: 5px; }
  #hud.has-queue { flex-wrap: wrap; height: auto; padding-bottom: 6px; overflow: visible; }
  .queue { order: 10; flex-basis: 100%; justify-content: space-between; margin: 0; }
  .queue-n { margin-left: auto; }
  .hud-sep { margin: 0 2px; }
  #minimap { display: none; }
  #zoombar { right: 10px; bottom: 12px; flex-direction: column; padding: 3px; }
  #zoombar .zl, #zoombar .zsep, #zoom-pct { display: none; }
  #zoombar button { width: 36px; height: 36px; }
  #inspector, #legend {
    top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 64%;
    border-left: 0; border-top: 1px solid var(--chrome-line); border-radius: 16px 16px 0 0;
    box-shadow: 0 -12px 32px var(--shadow);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #inspector { transform: translateY(104%); }
  #inspector.open { transform: none; }
  #legend { transform: translateY(104%); opacity: 1; }
  #legend.open { transform: none; }
  .sheet-grip { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--rule-2); margin: 8px auto 0; flex: none; border: 0; padding: 0; }
  button.sheet-grip { width: 64px; height: 18px; margin: 2px auto -6px; background: transparent; cursor: pointer; position: relative; }
  button.sheet-grip::after { content: ""; position: absolute; left: 12px; right: 12px; top: 7px; height: 4px; border-radius: 2px; background: var(--rule-2); }
  #inspector.tall { max-height: 88%; }
  .insp-top { padding: 4px 8px 0 16px; }
  .insp-body { padding: 4px 16px 24px; }
  .insp-title { font-size: 19px; }
  #app.insp-open #zoombar { right: 10px; }
  #focus-pill { display: none; }
  #focus-pill.on { display: inline-flex; }
}
</style>
</head>
<body>
<div id="app" data-lens="overall">
  <header id="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <path class="mark-ln" d="M5.5 12H9M9 6.5V17.5M9 6.5H13M9 12H13M9 17.5H13"/>
        <circle class="mark-dot" cx="4.5" cy="12" r="2.4"/>
        <rect class="mark-sq" x="13.5" y="4.6" width="6.5" height="3.8" rx="1.2"/>
        <rect class="mark-sq" x="13.5" y="10.1" width="6.5" height="3.8" rx="1.2"/>
        <rect class="mark-sq" x="13.5" y="15.6" width="6.5" height="3.8" rx="1.2"/>
      </svg>
      <span class="brand-name">Atlas <span>Blueprint</span></span>
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="prod"><b id="prod-name">Larkspur</b><span class="ver" id="prod-ver">v1.4.2</span><span class="next" id="prod-next">next v1.5.0</span></span>
    </div>
    <nav id="lenses" aria-label="Lens"></nav>
    <div class="tools">
      <div class="search" role="search">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle class="ico-ln" cx="7" cy="7" r="4.6"/><path class="ico-ln" d="M10.4 10.4L14 14"/></svg>
        <input id="search" type="search" placeholder="Search features" autocomplete="off" spellcheck="false" aria-label="Search features (press / to focus, Enter to fly to a match)">
        <span id="search-count" class="search-count" aria-live="polite"></span>
        <kbd class="kbd" aria-hidden="true">/</kbd>
      </div>
      <button id="search-open" class="ib phone-only" type="button" aria-label="Search features">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle class="ico-ln" cx="7" cy="7" r="4.6"/><path class="ico-ln" d="M10.4 10.4L14 14"/></svg>
      </button>
      <button id="trust-btn" class="tb" type="button" aria-pressed="false" aria-label="Agent review overlay: mark agent-built work waiting for human review (T)">
        <svg class="ico tb-glyph" viewBox="0 0 16 16" aria-hidden="true"><rect class="ico-ln" x="2.5" y="4" width="11" height="9" rx="2.6"/><circle class="ico-fill" cx="6" cy="8.4" r="1.1"/><circle class="ico-fill" cx="10" cy="8.4" r="1.1"/><path class="ico-ln" d="M8 4V1.8"/></svg>
        <span class="tb-label">Agent review</span>
      </button>
      <button id="legend-btn" class="ib" type="button" aria-pressed="false" aria-label="Legend (L)">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect class="ico-ln" x="2" y="2.5" width="4" height="4" rx="1"/><rect class="ico-ln" x="2" y="9.5" width="4" height="4" rx="1"/><path class="ico-ln" d="M8.5 4.5H14M8.5 11.5H14"/></svg>
      </button>
      <button id="theme-btn" class="ib" type="button" aria-label="Theme: system">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true" id="theme-ico"></svg>
      </button>
    </div>
  </header>

  <div id="hud" role="toolbar" aria-label="Product summary and status filters">
    <span class="hud-label">Features</span>
    <div id="chips" class="chips"></div>
    <span class="hud-sep" aria-hidden="true"></span>
    <button id="attn-btn" class="chip chip-attn" type="button" aria-pressed="false" aria-label="Show only features that need attention">
      <svg viewBox="-8 -8 16 16" aria-hidden="true"><path class="flag-attn" d="M0 -6.5L6.8 5.6H-6.8Z"/><path class="flag-bang" d="M-0.9 -2.2H0.9L0.6 1.8H-0.6Z M0 2.6A1 1 0 1 1 0 4.6A1 1 0 1 1 0 2.6Z"/></svg>
      <span class="chip-n" id="attn-n">0</span><span class="chip-label">need attention</span>
    </button>
    <div id="queue" class="queue" hidden>
      <span class="queue-t">Review queue</span>
      <button class="qb" id="queue-prev" type="button" aria-label="Previous unreviewed feature ([)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path class="ico-ln" d="M10 3.5L5.5 8L10 12.5"/></svg></button>
      <span class="queue-n" id="queue-n">0 of 0</span>
      <button class="qb" id="queue-next" type="button" aria-label="Next unreviewed feature (])"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path class="ico-ln" d="M6 3.5L10.5 8L6 12.5"/></svg></button>
    </div>
    <button id="clear-btn" class="link-btn" type="button" hidden>Clear filters</button>
    <span class="hud-spacer"></span>
    <nav id="crumbs" aria-label="Breadcrumb"></nav>
  </div>

  <main id="stage-wrap">
    <svg id="stage" tabindex="0" role="application" aria-roledescription="blueprint canvas" aria-label="Product blueprint. Arrow keys move through the tree, Enter opens details, plus and minus zoom." data-level="far">
      <defs>
        <pattern id="dotgrid" patternUnits="userSpaceOnUse" width="24" height="24"><circle class="dot" cx="1.2" cy="1.2" r="1.1"/></pattern>
        <pattern id="hatch" patternUnits="userSpaceOnUse" width="3.2" height="3.2" patternTransform="rotate(45)"><rect class="hatch-bg" width="3.2" height="3.2"/><line class="hatch-ln" x1="0.6" y1="0" x2="0.6" y2="3.2"/></pattern>
        <marker id="arr-up" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="dep-arrow-up" d="M0 0L10 5L0 10Z"/></marker>
        <marker id="arr-down" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="dep-arrow-down" d="M0 0L10 5L0 10Z"/></marker>
      </defs>
      <rect id="bg" x="0" y="0" width="100%" height="100%" fill="url(#dotgrid)"/>
      <g id="world">
        <g id="tree"></g>
        <g id="nodes"></g>
        <g id="deps"></g>
      </g>
    </svg>

    <div id="focus-pill" class="panel" role="status"></div>

    <div id="zoombar" class="panel" role="toolbar" aria-label="Zoom">
      <button type="button" id="zoom-out" aria-label="Zoom out (-)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path class="ico-ln" d="M3.5 8H12.5"/></svg></button>
      <span id="zoom-pct">50%</span>
      <button type="button" id="zoom-in" aria-label="Zoom in (+)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path class="ico-ln" d="M3.5 8H12.5M8 3.5V12.5"/></svg></button>
      <span class="zsep" aria-hidden="true"></span>
      <button type="button" class="zl" data-zl="far" aria-pressed="true" aria-label="Overview zoom level"><span class="zl-txt">Overview</span></button>
      <button type="button" class="zl" data-zl="mid" aria-pressed="false" aria-label="Module zoom level"><span class="zl-txt">Modules</span></button>
      <button type="button" class="zl" data-zl="near" aria-pressed="false" aria-label="Detail zoom level"><span class="zl-txt">Detail</span></button>
      <span class="zsep" aria-hidden="true"></span>
      <button type="button" id="zoom-fit" aria-label="Fit whole product (0)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path class="ico-ln" d="M2.5 6V3.5A1 1 0 0 1 3.5 2.5H6M10 2.5H12.5A1 1 0 0 1 13.5 3.5V6M13.5 10V12.5A1 1 0 0 1 12.5 13.5H10M6 13.5H3.5A1 1 0 0 1 2.5 12.5V10"/></svg></button>
    </div>

    <div id="minimap" class="panel" aria-label="Minimap: drag to move the view">
      <canvas id="mm-canvas" width="180" height="110"></canvas>
      <div id="mm-view"></div>
    </div>

    <aside id="legend" class="panel" aria-label="Legend" inert>
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="lg-head"><h2>How to read the atlas</h2>
        <button class="x-btn" id="legend-close" type="button" aria-label="Close legend"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path class="ico-ln" d="M4 4L12 12M12 4L4 12"/></svg></button>
      </div>
      <div class="lg-body" id="legend-body"></div>
    </aside>

    <aside id="inspector" aria-label="Inspector" inert>
      <button type="button" class="sheet-grip" id="insp-grip" aria-label="Resize panel"></button>
      <div class="insp-top">
        <div class="insp-crumbs" id="insp-crumbs"></div>
        <button class="x-btn" id="insp-close" type="button" aria-label="Close inspector (Esc)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path class="ico-ln" d="M4 4L12 12M12 4L4 12"/></svg></button>
      </div>
      <div class="insp-body" id="insp-body"></div>
    </aside>

    <div id="tip" class="tip panel" role="tooltip" hidden></div>
    <div id="live" class="sr" aria-live="polite"></div>
  </main>
</div>

<script src="../../shared/blueprint-data.js"></script>
<script src="../../shared/blueprint-model.js"></script>
<script>
(function () {
  'use strict';

  /* ═════════════════════════════ state ═════════════════════════════ */
  const BP = window.BP;
  const doc = document;
  const root = doc.documentElement;
  const $ = (id) => doc.getElementById(id);
  const app = $('app');
  const svg = $('stage');
  const wrap = $('stage-wrap');
  const gWorld = $('world');
  const gTree = $('tree');
  const gNodes = $('nodes');
  const gDeps = $('deps');
  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  const reduced = () => motionQuery.matches;

  // World geometry. Wide = landscape screens (root left), tall = portrait screens (root on top, features wrap in rows of 4).
  const G = {
    FW: 232, FH: 64, FG: 8,
    MW: 256,
    wide: { RW: 196, RH: 304, DW: 188, DMIN: 178, GRD: 56, GDM: 48, GMF: 28, RG: 8, DG: 30 },
    tall: { RW: 760, RH: 168, DW: 210, DMIN: 280, TRUNK: 30, DX: 64, GRD: 44, GDM: 44, GMF: 28, RG: 10, DG: 34, WRAP: 4 },
  };
  const LEVEL_MID = 0.7;
  const LEVEL_NEAR = 1.55;
  const K_MAX = 4;

  const DIM_IDS = BP.DIMENSIONS.map((d) => d.id);
  const DIM = {};
  BP.DIMENSIONS.forEach((d) => { DIM[d.id] = d; });
  const STATUS = {};
  BP.STATUSES.forEach((s) => { STATUS[s.id] = s; });
  const FACET_SHORT = { spec: 'Spec', backend: 'Backend', frontend: 'Frontend', tests: 'Tests', deploy: 'Deploy', observe: 'Observe', secure: 'Security', runbook: 'Runbook', value: 'Value', docs: 'Docs', package: 'Package', adoption: 'Adoption' };
  const STATE_LABEL = {};
  BP.FACET_STATES.forEach((s) => { STATE_LABEL[s.id] = s.label; });
  const LENS_LABEL = { overall: 'Overall', dev: 'Development', ops: 'Operations', biz: 'Business' };
  const LENS_SHORT = { overall: 'All', dev: 'Dev', ops: 'Ops', biz: 'Biz' };
  const REVIEW_LABEL = { approved: 'Approved', pending: 'Pending review', changes: 'Changes requested', none: 'Not reviewed' };
  const BUILT_LABEL = { agent: 'Agent crew', pair: 'Agent + human pair', human: 'Human squad' };
  const SI = (s) => BP.STATUS_ORDER.indexOf(s);

  const state = {
    lens: 'overall',
    level: 'far',
    mode: 'wide',
    cam: { x: 0, y: 0, k: 0.5 },
    sel: null, // node id: 'root' | 'd:x' | 'm:x' | 'f:x'
    inspector: false,
    focus: null, // 'm:x' | 'd:x'
    statuses: new Set(),
    query: '',
    attnOnly: false,
    trust: false,
    qIdx: -1,
    hitIdx: -1,
    collapsed: new Set(),
    legend: false,
    theme: 'system',
    touched: false,
  };

  // Review queue: agent or pair work whose latest change still waits for a human (pending) or was sent back (changes).
  const QUEUE = BP.features.filter((f) => f.builtBy !== 'human' && (f.review === 'pending' || f.review === 'changes'));
  const QUEUE_SET = new Set(QUEUE.map((f) => f.id));

  const nodes = new Map(); // id -> node
  let layout = null;
  let stageW = 0;
  let stageH = 0;

  /* ── helpers ── */
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const r1 = (v) => Math.round(v * 10) / 10;
  const pct = (v) => Math.round((v || 0) * 100);
  const bin = (v) => Math.max(0, Math.min(4, Math.floor((v || 0) * 5 - 1e-9)));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const teamName = (id) => { const t = BP.team(id); return t ? t.name : id; };
  const lensVal = (f) => { const v = BP.lensValue(f, state.lens); return v == null ? 0 : v; };
  const rollVal = (r, lens) => (lens === 'overall' ? r.overall : r.dims[lens]);
  const fid = (f) => 'f:' + f.id;
  const relLabel = (id) => { const r = id && BP.release(id); return r ? r.label : 'Unscheduled'; };

  const measure = doc.createElement('canvas').getContext('2d');
  let FAM_UI = 'Geist, "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif';
  let FAM_DATA = '"Geist Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace';
  function readFamilies() {
    const cs = getComputedStyle(root);
    FAM_UI = cs.getPropertyValue('--f-ui').trim() || FAM_UI;
    FAM_DATA = cs.getPropertyValue('--f-data').trim() || FAM_DATA;
  }
  function textW(str, weight, size, mono) {
    measure.font = weight + ' ' + size + 'px ' + (mono ? FAM_DATA : FAM_UI);
    return measure.measureText(str).width;
  }
  /** Word-wraps text to at most maxLines lines of maxW world units, ellipsizing the last line. */
  function wrapText(text, weight, size, maxW, maxLines) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    for (let i = 0; i < words.length; i++) {
      const t = cur ? cur + ' ' + words[i] : words[i];
      if (!cur || textW(t, weight, size) <= maxW) { cur = t; continue; }
      lines.push(cur);
      if (lines.length === maxLines - 1) { cur = words.slice(i).join(' '); break; }
      cur = words[i];
    }
    lines.push(cur);
    let last = lines[lines.length - 1];
    if (textW(last, weight, size) > maxW) {
      while (last.length > 1 && textW(last + '…', weight, size) > maxW) last = last.slice(0, -1);
      lines[lines.length - 1] = last.replace(/\s+$/, '') + '…';
    }
    return lines;
  }
  const fit1 = (text, weight, size, maxW, mono) => {
    if (textW(text, weight, size, mono) <= maxW) return text;
    let t = String(text);
    while (t.length > 1 && textW(t + '…', weight, size, mono) > maxW) t = t.slice(0, -1);
    return t.replace(/\s+$/, '') + '…';
  };

  function txt(x, y, cls, size, str, anchor, extra) {
    return '<text x="' + r1(x) + '" y="' + r1(y) + '" class="' + cls + '" font-size="' + size + '"' + (anchor ? ' text-anchor="' + anchor + '"' : '') + (extra || '') + '>' + esc(str) + '</text>';
  }
  function txtLines(x, y, lh, cls, size, lines, extra) {
    return '<text x="' + r1(x) + '" y="' + r1(y) + '" class="' + cls + '" font-size="' + size + '"' + (extra || '') + '>' +
      lines.map((ln, i) => '<tspan x="' + r1(x) + '"' + (i ? ' dy="' + lh + '"' : '') + '>' + esc(ln) + '</tspan>').join('') + '</text>';
  }

  /* ── glyphs (shared by canvas and chrome) ── */
  /** Status icon: form encodes status (disc, ring with core, half disc, dashed ring, diamond with bar). */
  function statusIcon(st, cx, cy, r) {
    let s = '<g class="st-' + st + '">';
    if (st === 'live') s += '<circle class="si-fill" cx="' + r1(cx) + '" cy="' + r1(cy) + '" r="' + r1(r) + '"/>';
    else if (st === 'ready') {
      s += '<circle class="si-ring" cx="' + r1(cx) + '" cy="' + r1(cy) + '" r="' + r1(r * 0.8) + '" stroke-width="' + r1(r * 0.38) + '"/>';
      s += '<circle class="si-fill" cx="' + r1(cx) + '" cy="' + r1(cy) + '" r="' + r1(r * 0.3) + '"/>';
    } else if (st === 'building') {
      const rr = r * 0.82;
      s += '<circle class="si-ring" cx="' + r1(cx) + '" cy="' + r1(cy) + '" r="' + r1(rr) + '" stroke-width="' + r1(r * 0.34) + '"/>';
      s += '<path class="si-fill" d="M' + r1(cx) + ' ' + r1(cy - rr) + 'A' + r1(rr) + ' ' + r1(rr) + ' 0 0 0 ' + r1(cx) + ' ' + r1(cy + rr) + 'Z"/>';
    } else if (st === 'planned') {
      const rr = r * 0.8;
      const c = 2 * Math.PI * rr;
      s += '<circle class="si-ring" cx="' + r1(cx) + '" cy="' + r1(cy) + '" r="' + r1(rr) + '" stroke-width="' + r1(r * 0.32) + '" stroke-dasharray="' + r1(c / 12) + ' ' + r1(c / 12) + '"/>';
    } else {
      const rr = r * 1.08;
      s += '<path class="si-fill" d="M' + r1(cx) + ' ' + r1(cy - rr) + 'L' + r1(cx + rr) + ' ' + r1(cy) + 'L' + r1(cx) + ' ' + r1(cy + rr) + 'L' + r1(cx - rr) + ' ' + r1(cy) + 'Z"/>';
      s += '<rect class="si-cut" x="' + r1(cx - rr * 0.48) + '" y="' + r1(cy - rr * 0.13) + '" width="' + r1(rr * 0.96) + '" height="' + r1(rr * 0.26) + '" rx="' + r1(rr * 0.1) + '"/>';
    }
    return s + '</g>';
  }
  const statusSvg = (st, extraCls) => '<svg viewBox="-8 -8 16 16" aria-hidden="true"' + (extraCls ? ' class="' + extraCls + '"' : '') + '>' + statusIcon(st, 0, 0, 6.6) + '</svg>';

  /** Built-by glyph inside an s x s box: agent = bot face, human = person, pair = both. */
  function builtGlyph(kind, x, y, s) {
    const sw = r1(Math.max(0.7, s * 0.11));
    const agent = (ax, ay, as) =>
      '<rect class="g-ln" x="' + r1(ax + as * 0.06) + '" y="' + r1(ay + as * 0.2) + '" width="' + r1(as * 0.88) + '" height="' + r1(as * 0.72) + '" rx="' + r1(as * 0.22) + '" stroke-width="' + sw + '"/>' +
      '<circle class="g-fill" cx="' + r1(ax + as * 0.36) + '" cy="' + r1(ay + as * 0.56) + '" r="' + r1(as * 0.085) + '"/>' +
      '<circle class="g-fill" cx="' + r1(ax + as * 0.64) + '" cy="' + r1(ay + as * 0.56) + '" r="' + r1(as * 0.085) + '"/>' +
      '<path class="g-ln" d="M' + r1(ax + as * 0.5) + ' ' + r1(ay + as * 0.2) + 'V' + r1(ay + as * 0.04) + '" stroke-width="' + sw + '"/>';
    const human = (hx, hy, hs) =>
      '<circle class="g-ln" cx="' + r1(hx + hs * 0.5) + '" cy="' + r1(hy + hs * 0.3) + '" r="' + r1(hs * 0.2) + '" stroke-width="' + sw + '"/>' +
      '<path class="g-ln" d="M' + r1(hx + hs * 0.12) + ' ' + r1(hy + hs * 0.96) + 'Q' + r1(hx + hs * 0.12) + ' ' + r1(hy + hs * 0.58) + ' ' + r1(hx + hs * 0.5) + ' ' + r1(hy + hs * 0.58) + 'Q' + r1(hx + hs * 0.88) + ' ' + r1(hy + hs * 0.58) + ' ' + r1(hx + hs * 0.88) + ' ' + r1(hy + hs * 0.96) + '" stroke-width="' + sw + '"/>';
    if (kind === 'agent') return agent(x, y, s);
    if (kind === 'human') return human(x, y, s);
    return human(x - s * 0.2, y, s * 0.9) + agent(x + s * 0.52, y + s * 0.08, s * 0.82);
  }
  const builtSvg = (kind) => '<svg viewBox="-1 -1 16 16" aria-hidden="true">' + builtGlyph(kind, 0.5, 0.5, 13) + '</svg>';

  /** One facet cell, colored by state; dimension hue comes from the enclosing .d-* group. */
  function cell(x, y, w, h, st, glyph) {
    const rx = r1(Math.min(2.2, h / 4, w / 4));
    const a = 'x="' + r1(x) + '" y="' + r1(y) + '" width="' + r1(w) + '" height="' + r1(h) + '" rx="' + rx + '"';
    let s;
    if (st === 'done') s = '<rect class="cd" ' + a + '/>';
    else if (st === 'partial') s = '<rect class="cp" ' + a + '/><rect class="cd" x="' + r1(x) + '" y="' + r1(y) + '" width="' + r1(w / 2) + '" height="' + r1(h) + '" rx="' + rx + '"/>';
    else if (st === 'blocked') s = '<rect class="cb" ' + a + '/>';
    else if (st === 'na') s = '<rect class="cn" ' + a + '/>';
    else s = '<rect class="ct" ' + a + '/>';
    if (glyph) {
      const cx = x + w / 2;
      const cy = y + h / 2;
      const g = Math.min(w, h) * 0.26;
      const sw = r1(Math.max(0.8, g * 0.42));
      if (st === 'done') s += '<path class="cg" stroke-width="' + sw + '" d="M' + r1(cx - g) + ' ' + r1(cy) + 'L' + r1(cx - g * 0.25) + ' ' + r1(cy + g * 0.75) + 'L' + r1(cx + g * 1.05) + ' ' + r1(cy - g * 0.7) + '"/>';
      else if (st === 'blocked') s += '<path class="cx" stroke-width="' + sw + '" d="M' + r1(cx - g) + ' ' + r1(cy) + 'H' + r1(cx + g) + '"/>';
      else if (st === 'todo') s += '<circle class="cgi" cx="' + r1(cx) + '" cy="' + r1(cy) + '" r="' + r1(g * 0.75) + '" stroke-width="' + r1(sw * 0.8) + '"/>';
    } else if (st === 'blocked' && w > 6) {
      s += '<path class="cx" stroke-width="' + r1(Math.max(0.8, h * 0.16)) + '" d="M' + r1(x + w * 0.3) + ' ' + r1(y + h / 2) + 'H' + r1(x + w * 0.7) + '"/>';
    }
    return s;
  }
  /** Full 3 x 4 facet barcode (rows: dev, ops, biz). */
  function barcode(f, x, y, w, h, gap) {
    const cw = (w - 3 * gap) / 4;
    const ch = (h - 2 * gap) / 3;
    let s = '';
    BP.DIMENSIONS.forEach((d, r) => {
      s += '<g class="d-' + d.id + '">';
      d.facets.forEach((fc, c) => { s += cell(x + c * (cw + gap), y + r * (ch + gap), cw, ch, f.dims[d.id][fc.id]); });
      s += '</g>';
    });
    return s;
  }
  /** One dimension row as a strip of 4 cells. */
  function strip(f, dimId, x, y, w, h, gap, glyph) {
    const cw = (w - 3 * gap) / 4;
    let s = '<g class="d-' + dimId + '">';
    DIM[dimId].facets.forEach((fc, c) => { s += cell(x + c * (cw + gap), y, cw, h, f.dims[dimId][fc.id], glyph); });
    return s + '</g>';
  }
  /** Stacked status bar from a byStatus count map. */
  function statusBar(byStatus, total, x, y, w, h) {
    let s = '';
    let cx = x;
    const gap = Math.min(1.5, w / 120);
    const n = BP.STATUS_ORDER.filter((k) => byStatus[k] > 0).length;
    const avail = w - gap * Math.max(0, n - 1);
    BP.STATUS_ORDER.forEach((k) => {
      const c = byStatus[k] || 0;
      if (!c) return;
      const sw = (avail * c) / total;
      s += '<rect class="sb st-' + k + '" x="' + r1(cx) + '" y="' + r1(y) + '" width="' + r1(Math.max(0.5, sw)) + '" height="' + r1(h) + '" rx="' + r1(Math.min(1.5, h / 3)) + '"/>';
      cx += sw + gap;
    });
    return s;
  }
  function dimBar(dimId, v, x, y, w, h) {
    return '<g class="d-' + dimId + '"><rect class="trk" x="' + r1(x) + '" y="' + r1(y) + '" width="' + r1(w) + '" height="' + r1(h) + '" rx="' + r1(h / 2) + '"/>' +
      '<rect class="bar-d" x="' + r1(x) + '" y="' + r1(y) + '" width="' + r1(Math.max(h, w * v)) + '" height="' + r1(h) + '" rx="' + r1(h / 2) + '"/></g>';
  }
  const dimOrder = () => (state.lens === 'overall' ? DIM_IDS.slice() : [state.lens].concat(DIM_IDS.filter((d) => d !== state.lens)));

  /* ═════════════════════════════ layout ═════════════════════════════ */
  /** Features of a module in row order: by status in the Overall lens, by the lens dimension score otherwise. */
  function rowOrder(mid) {
    const list = BP.featuresOf(mid);
    const idx = new Map(list.map((f, i) => [f.id, i]));
    if (state.lens === 'overall') return list.sort((a, b) => SI(a.status) - SI(b.status) || idx.get(a.id) - idx.get(b.id));
    const sc = (f) => { const v = BP.dimScore(f, state.lens); return v == null ? -1 : v; };
    return list.sort((a, b) => sc(b) - sc(a) || SI(a.status) - SI(b.status) || idx.get(a.id) - idx.get(b.id));
  }

  /** Deterministic tidy-tree layout. Returns target boxes for every node plus row structure and bounds. */
  function computeLayout() {
    const tall = state.mode === 'tall';
    const P = tall ? G.tall : G.wide;
    const pos = new Map();
    const rows = new Map(); // mid -> [[fid...], ...]
    const order = []; // visible node ids in reading order
    const FW = G.FW, FH = G.FH, FG = G.FG, MW = G.MW;
    const wrapN = tall ? P.WRAP : 99;
    let xDom, xMod, xFeat, y0;
    if (tall) {
      xDom = P.DX; xMod = xDom + P.DW + P.GDM; xFeat = xMod + MW + P.GMF; y0 = P.RH + P.GRD;
    } else {
      xDom = P.RW + P.GRD; xMod = xDom + P.DW + P.GDM; xFeat = xMod + MW + P.GMF; y0 = 0;
    }
    let y = y0;
    let maxX = xMod + MW;
    BP.domains.forEach((d, di) => {
      const did = 'd:' + d.id;
      const dCollapsed = state.collapsed.has(did);
      const mods = BP.modulesOf(d.id);
      // module units
      const units = mods.map((m) => {
        const n = BP.featuresOf(m.id).length;
        const mCollapsed = state.collapsed.has('m:' + m.id);
        const nRows = mCollapsed ? 1 : Math.ceil(n / wrapN);
        return { m, nRows, h: nRows * FH + (nRows - 1) * FG, collapsed: mCollapsed };
      });
      const unitsH = units.reduce((a, u) => a + u.h, 0) + P.RG * (units.length - 1);
      const span = dCollapsed ? P.DMIN : Math.max(unitsH, P.DMIN);
      pos.set(did, { x: xDom, y, w: P.DW, h: span });
      order.push(did);
      let my = y + (dCollapsed ? 0 : (span - unitsH) / 2);
      units.forEach((u) => {
        const mid = 'm:' + u.m.id;
        const feats = rowOrder(u.m.id);
        if (dCollapsed) {
          pos.set(mid, { x: xDom + P.DW - MW, y: y + span / 2 - u.h / 2, w: MW, h: u.h, gone: true });
          feats.forEach((f) => pos.set(fid(f), { x: xDom + P.DW - FW, y: y + span / 2 - FH / 2, w: FW, h: FH, gone: true }));
          return;
        }
        pos.set(mid, { x: xMod, y: my, w: MW, h: u.h });
        order.push(mid);
        const rws = [];
        feats.forEach((f, i) => {
          const r = Math.floor(i / wrapN);
          const c = i % wrapN;
          if (u.collapsed) {
            pos.set(fid(f), { x: xMod + MW - FW, y: my, w: FW, h: FH, gone: true });
            return;
          }
          const fx = xFeat + c * (FW + FG);
          pos.set(fid(f), { x: fx, y: my + r * (FH + FG), w: FW, h: FH });
          if (!rws[r]) rws[r] = [];
          rws[r].push(fid(f));
          order.push(fid(f));
          maxX = Math.max(maxX, fx + FW);
        });
        if (u.collapsed) maxX = Math.max(maxX, xMod + MW + P.GMF + 16 * feats.length + 90);
        rows.set(mid, rws);
        my += u.h + P.RG;
      });
      y += span + (di < BP.domains.length - 1 ? P.DG : 0);
    });
    const totalH = y;
    if (tall) {
      pos.set('root', { x: 0, y: 0, w: P.RW, h: P.RH });
      maxX = Math.max(maxX, P.RW);
    } else {
      pos.set('root', { x: 0, y: Math.max(0, (totalH - P.RH) / 2), w: P.RW, h: P.RH });
    }
    order.unshift('root');
    return { pos, rows, order, bounds: { x: 0, y: 0, w: maxX, h: totalH }, tall, P };
  }

  /* ═════════════════════════════ render ═════════════════════════════ */
  function createNodes() {
    const frag = [];
    const add = (id, type, data, cls, attrs) => {
      frag.push('<g class="node ' + cls + '" data-node="' + id + '" ' + attrs + '></g>');
      nodes.set(id, { id, type, data, el: null, x: 0, y: 0, w: 0, h: 0, fx: 0, fy: 0, tx: 0, ty: 0, gone: false, op: 1 });
    };
    add('root', 'root', BP.product, 'rc', 'data-root="1"');
    BP.domains.forEach((d) => add('d:' + d.id, 'domain', d, 'dc', 'data-did="' + d.id + '"'));
    BP.modules.forEach((m) => add('m:' + m.id, 'module', m, 'mc', 'data-mid="' + m.id + '"'));
    BP.features.forEach((f) => add(fid(f), 'feature', f, 'fc' + (BP.needsAttention(f) ? ' attn' : ''), 'data-fid="' + f.id + '"'));
    gNodes.innerHTML = frag.join('');
    gNodes.querySelectorAll('[data-node]').forEach((el) => { nodes.get(el.getAttribute('data-node')).el = el; });
  }

  function renderRoot(n) {
    const p = BP.product;
    const r = BP.productRollup();
    const v = rollVal(r, state.lens);
    const W = n.w, H = n.h;
    let s = '<rect class="rc-bg" width="' + W + '" height="' + H + '" rx="12"/>';

    if (!layout || !layout.tall) {
      s += '<g transform="translate(18 18)"><path d="M3 12H7.5M7.5 5V19M7.5 5H12M7.5 12H12M7.5 19H12" fill="none" class="g-ln" style="--gc: var(--root-fg)" stroke-width="1.7"/><circle cx="3" cy="12" r="2.4" class="g-fill" style="--gc: var(--root-fg)"/></g>';
      s += txt(48, 35, 'rt2 f-data w5 caps', 11, 'PRODUCT');
      s += txt(17, 88, 'rt f-ui w7', 37, p.name, '', ' letter-spacing="-0.8"');
      s += txt(18, 112, 'rt2 f-data w5', 13, 'v' + p.version + ' → ' + p.nextVersion);
      s += txtLines(18, 140, 14, 'rt2 f-ui no-far', 10.5, wrapText(p.tagline + '.', 400, 10.5, W - 36, 3));
      s += txt(18, 196, 'rt2 f-data w5 caps', 10.5, lensWord.toUpperCase());
      s += txt(15, 256, 'rt f-data w5', 68, pct(v) + '%', '', ' letter-spacing="-3"');
      s += '<rect class="rc-bar-trk" x="18" y="268" width="' + (W - 36) + '" height="8" rx="2"/>';
      s += statusBar(r.byStatus, r.count, 18, 268, W - 36, 8);
      s += txt(18, 292, 'rt2 f-ui w5', 12, r.count + ' features · ' + BP.modules.length + ' modules');
    } else {
      s += '<g transform="translate(28 30) scale(2)"><path d="M3 12H7.5M7.5 5V19M7.5 5H12M7.5 12H12M7.5 19H12" fill="none" class="g-ln" style="--gc: var(--root-fg)" stroke-width="1.6"/><circle cx="3" cy="12" r="2.4" class="g-fill" style="--gc: var(--root-fg)"/></g>';
      s += txt(84, 72, 'rt f-ui w7', 60, p.name, '', ' letter-spacing="-1"');
      s += txt(28, 118, 'rt2 f-data w5', 22, 'v' + p.version + ' · ' + r.count + ' features');
      s += txt(W - 28, 50, 'rt2 f-data w5 caps', 16, lensWord.toUpperCase(), 'end');
      s += txt(W - 26, 122, 'rt f-data w5', 80, pct(v) + '%', 'end', ' letter-spacing="-3"');
      s += '<rect class="rc-bar-trk" x="28" y="' + (H - 30) + '" width="' + (W - 56) + '" height="12" rx="3"/>';
      s += statusBar(r.byStatus, r.count, 28, H - 30, W - 56, 12);
    }
    s += '<rect class="ring-sel" x="-5" y="-5" width="' + (W + 10) + '" height="' + (H + 10) + '" rx="16"/>';
    n.el.innerHTML = s;
  }

  function renderDomain(n) {
    const d = n.data;
    const r = BP.domainRollup(d.id);
    const v = rollVal(r, state.lens);
    const W = n.w, H = n.h;
    const tall = layout && layout.tall;
    const collapsed = state.collapsed.has(n.id);
    n.el.setAttribute('class', 'node dc hb' + bin(v) + (n.el.classList.contains('sel') ? ' sel' : ''));
    let s = '<rect class="dc-bg" width="' + W + '" height="' + H + '" rx="10"/>';
    s += '<rect class="lift" x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" rx="9"/>';
    const lensWord = state.lens === 'overall' ? 'OVERALL' : LENS_LABEL[state.lens].toUpperCase();
    if (!tall) {
      s += txt(16, 29, 't3 f-data w6 caps', 12, d.code);
      const lines = wrapText(d.name, 700, 23, W - 30, 2);
      s += txtLines(16, 60, 26, 't f-ui w7', 23, lines, ' letter-spacing="-0.3"');
      const nameBottom = 60 + (lines.length - 1) * 26;
      // compact dimension row, shown once the plate is large enough to read
      if (nameBottom + 36 < H - 82) s += '<g class="no-far">';
      else s += '<g class="no-far" display="none">';
      dimOrder().forEach((dim, i) => {
        const cx = 16 + i * 53;
        const faded = state.lens !== 'overall' && dim !== state.lens;
        s += '<g class="d-' + dim + (faded ? ' faded' : '') + '">' + txt(cx, nameBottom + 25, 'tdh f-ui w6', 9.5, DIM[dim].short) +
          txt(cx + 46, nameBottom + 25, 't f-data w6', 9.5, pct(r.dims[dim]), 'end') + dimBar(dim, r.dims[dim], cx, nameBottom + 30, 46, 3.5) + '</g>';
      });
      s += '</g>';
      s += '<g class="no-far"><rect class="heat" x="16" y="' + (H - 79) + '" width="10" height="10" rx="2"/>' + txt(32, H - 70, 't3 f-data w5 caps', 10, lensWord) +
        txt(W - 16, H - 42, 't2 f-ui w5', 11.5, r.count + ' features', 'end') + txt(W - 16, H - 27, 't3 f-ui', 11.5, BP.modulesOf(d.id).length + ' modules', 'end') + '</g>';
      s += '<g class="only-far">' + txt(W - 16, H - 37, 't2 f-data w6', 22, String(r.count), 'end') + txt(W - 16, H - 25, 't3 f-ui w5', 10, 'features', 'end') + '</g>';
      s += txt(13, H - 25, 't f-data w5', 50, pct(v) + '%', '', ' letter-spacing="-2"');
      s += statusBar(r.byStatus, r.count, 16, H - 15, W - 32, 5);
    } else {
      s += txt(18, 62, 't f-data w6', 50, d.code, '', ' letter-spacing="1"');
      s += txtLines(18, 98, 26, 't2 f-ui w6', 22, wrapText(d.name, 600, 22, W - 36, 2));
      s += '<g class="no-far"><rect class="heat" x="18" y="' + (H - 128) + '" width="14" height="14" rx="3"/>' + txt(40, H - 116, 't3 f-data w5 caps', 14, lensWord) + '</g>';
      s += txt(W - 18, 62, 't3 f-data w5', 30, String(r.count), 'end');
      s += txt(14, H - 40, 't f-data w5', 76, pct(v) + '%', '', ' letter-spacing="-3"');
      s += statusBar(r.byStatus, r.count, 18, H - 24, W - 36, 10);
    }
    if (r.attention) s += '<path class="flag-attn" d="M' + (W - 22) + ' 0H' + (W - 10) + 'Q' + W + ' 0 ' + W + ' 10V22Z"/>';
    // collapse knob on the stem
    s += '<g class="knob no-far" data-act="toggle" data-target="' + n.id + '" transform="translate(' + (W + 12) + ' ' + r1(H / 2) + ')" role="button" aria-label="' + (collapsed ? 'Expand ' : 'Collapse ') + esc(d.name) + '">' +
      '<circle class="knob-c" r="8"/><path class="knob-g" d="' + (collapsed ? 'M-1.5 -3.5L2 0L-1.5 3.5' : 'M1.5 -3.5L-2 0L1.5 3.5') + '"/></g>';
    s += '<rect class="ring-sel" x="-5" y="-5" width="' + (W + 10) + '" height="' + (H + 10) + '" rx="14"/>';
    n.el.innerHTML = s;
  }

  function renderModule(n) {
    const m = n.data;
    const r = BP.moduleRollup(m.id);
    const v = rollVal(r, state.lens);
    const W = n.w, H = n.h;
    const collapsed = state.collapsed.has(n.id);
    const big = H >= 100;
    const sel = n.el.classList.contains('sel');
    const qn = BP.featuresOf(m.id).filter((f) => QUEUE_SET.has(f.id)).length;
    n.el.setAttribute('class', 'node mc hb' + bin(v) + (sel ? ' sel' : ''));
    let s = '';
    // FAR: solid heat tile
    s += '<g class="only-far"><rect class="heat" width="' + W + '" height="' + H + '" rx="8"/>';
    if (!big) {
      const lines = wrapText(m.name, 600, 20, W - 104, 2);
      s += txtLines(14, lines.length > 1 ? 28 : 39.5, 22, 'heat-fg f-ui w6', 20, lines, ' letter-spacing="-0.2"');
      s += txt(W - 13, 44, 'heat-fg f-data w6', 31, pct(v) + '%', 'end', ' letter-spacing="-1.2"');
    } else {
      s += txt(16, 58, 'heat-fg f-data w6', 48, m.code, '', ' letter-spacing="0.5"');
      s += txt(W - 14, 58, 'heat-fg f-data w5', 48, pct(v) + '%', 'end', ' letter-spacing="-2"');
      s += txtLines(16, 96, 25, 'heat-fg2 f-ui w6', 21, wrapText(m.name, 600, 21, W - 32, 2));
    }
    s += '</g>';
    // MID + NEAR: card with a heat block
    s += '<g class="no-far"><rect class="mc-bg" width="' + W + '" height="' + H + '" rx="8"/>';
    s += '<path class="heat" d="M8 0H58V' + H + 'H8Q0 ' + H + ' 0 ' + (H - 8) + 'V8Q0 0 8 0Z"/>';
    s += txt(10, 19, 'heat-fg f-data w6 caps', 10, m.code);
    s += txt(9, big ? H - 14 : 51, 'heat-fg f-data w6', 18, pct(v) + '%', '', ' letter-spacing="-0.6"');
    const X = 70, RW = W - X - 12;
    // mid
    s += '<g class="only-mid">';
    s += txt(X, 21, 't f-ui w6', 13.5, fit1(m.name, 600, 13.5, RW - (r.attention ? 16 : 0)));
    s += statusBar(r.byStatus, r.count, X, 29, RW, 6);
    const order = dimOrder();
    order.forEach((dim, i) => {
      const cx = X + i * 59;
      const faded = state.lens !== 'overall' && dim !== state.lens;
      s += '<g class="d-' + dim + (faded ? ' faded' : '') + '">' + txt(cx, 52, 'tdh f-ui w7', 9.5, DIM[dim].short.charAt(0)) +
        dimBar(dim, r.dims[dim], cx + 10, 46.5, 26, 4) + txt(cx + 55, 52, 't2 f-data w5', 9.5, pct(r.dims[dim]), 'end') + '</g>';
    });
    if (big) {
      s += txt(X, 84, 't2 f-ui w5', 11, teamName(m.owner) + ' · ' + r.count + ' features');
      s += txtLines(X, 102, 14, 't3 f-ui', 10.5, wrapText(m.surfaces.join(' · '), 400, 10.5, RW, 1));
    }
    s += '</g>';
    // near
    s += '<g class="only-near">';
    s += txt(X, 15, 't f-ui w6', 11.5, fit1(m.name, 600, 11.5, RW - 34));
    s += txt(X, 25, 't3 f-ui w5', 7, fit1(teamName(m.owner) + ' · ' + r.count + ' features · ' + m.surfaces.join(', '), 500, 7, RW));
    s += statusBar(r.byStatus, r.count, X, 29.5, RW, 4.5);
    const parts = BP.STATUS_ORDER.filter((k) => r.byStatus[k]).map((k) => r.byStatus[k] + ' ' + STATUS[k].label.toLowerCase());
    s += txt(X, 41, 't2 f-data w5', 6.4, fit1(parts.join(' · '), 500, 6.4, RW, true));
    order.forEach((dim, i) => {
      const cx = X + i * 59;
      const faded = state.lens !== 'overall' && dim !== state.lens;
      s += '<g class="d-' + dim + (faded ? ' faded' : '') + '">' + txt(cx, 51, 'tdh f-ui w6', 6.6, DIM[dim].short) +
        txt(cx + 53, 51, 't f-data w6', 6.6, pct(r.dims[dim]) + '%', 'end') + dimBar(dim, r.dims[dim], cx, 54, 53, 3) + '</g>';
    });
    if (big) s += txtLines(X, 76, 10, 't2 f-ui', 7.2, wrapText(m.summary, 400, 7.2, RW, 5));
    s += '<g class="fbtn" data-act="focus" data-target="' + n.id + '" role="button" aria-label="Focus ' + esc(m.name) + '" transform="translate(' + (W - 38) + ' 5)"><rect class="fbtn-c" width="15" height="15" rx="3.5"/>' +
      '<circle class="fbtn-g" cx="7.5" cy="7.5" r="3.4"/><path class="fbtn-g" d="M7.5 1.8V4M7.5 11V13.2M1.8 7.5H4M11 7.5H13.2"/></g>';
    s += '</g></g>';
    if (r.attention) s += '<path class="flag-attn" d="M' + (W - 18) + ' 0H' + (W - 8) + 'Q' + W + ' 0 ' + W + ' 8V18Z"/>';
    if (qn) s += '<g class="mod-q"><circle class="trust-seal" cx="' + (W - 2) + '" cy="' + (H - 2) + '" r="9"/>' + txt(W - 2, H + 1.6, 'trust-tag-t f-data w6', 9.5, String(qn), 'middle') + '</g>';
    // collapse knob + collapsed pips
    s += '<g class="knob no-far" data-act="toggle" data-target="' + n.id + '" transform="translate(' + (W + 13) + ' ' + r1(H / 2) + ')" role="button" aria-label="' + (collapsed ? 'Expand ' : 'Collapse ') + esc(m.name) + '">' +
      '<circle class="knob-c" r="7.5"/><path class="knob-g" d="' + (collapsed ? 'M-1.5 -3.2L1.8 0L-1.5 3.2' : 'M1.5 -3.2L-1.8 0L1.5 3.2') + '"/></g>';
    if (collapsed) {
      const fs = rowOrder(m.id);
      const px0 = W + 34;
      fs.forEach((f, i) => { s += statusIcon(f.status, px0 + i * 17, H / 2, 6); });

    if (lens === 'overall') {
