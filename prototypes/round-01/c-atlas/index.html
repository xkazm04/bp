  function renderNode(n) {
    if (n.type === 'feature') renderFeature(n);
    else if (n.type === 'module') renderModule(n);
    else if (n.type === 'domain') renderDomain(n);
    else renderRoot(n);
  }
  function renderAll() { nodes.forEach(renderNode); }

  /* ── tree connectors ── */
  /** Orthogonal fan: parent stem to a bus at x=bx, then rounded elbows into each child (left-mid points). */
  function fan(px, py, bx, kids, r, cls) {
    let s = '<path class="wire ' + cls + '" d="M' + r1(px) + ' ' + r1(py) + 'H' + r1(bx) + '"/>';
    if (!kids.length) return s;
    const ys = kids.map((k) => k.y);
    const top = Math.min(py, Math.min.apply(null, ys));
    const bot = Math.max(py, Math.max.apply(null, ys));
    const rad = Math.min(r, (bot - top) / 2 || r);
    const rt = top < py - 0.5 ? rad : 0;
    const rb = bot > py + 0.5 ? rad : 0;
    if (bot - top > 0.5) s += '<path class="wire ' + cls + '" d="M' + r1(bx) + ' ' + r1(top + rt) + 'V' + r1(bot - rb) + '"/>';
    kids.forEach((k) => {
      let d;
      if (rt && Math.abs(k.y - top) < 0.5) d = 'M' + r1(bx) + ' ' + r1(top + rt) + 'Q' + r1(bx) + ' ' + r1(top) + ' ' + r1(bx + rt) + ' ' + r1(top) + 'H' + r1(k.x);
      else if (rb && Math.abs(k.y - bot) < 0.5) d = 'M' + r1(bx) + ' ' + r1(bot - rb) + 'Q' + r1(bx) + ' ' + r1(bot) + ' ' + r1(bx + rb) + ' ' + r1(bot) + 'H' + r1(k.x);
      else d = 'M' + r1(bx) + ' ' + r1(k.y) + 'H' + r1(k.x);
      s += '<path class="wire ' + (k.cls || cls) + '"' + (k.mid ? ' data-wm="' + k.mid + '"' : '') + ' d="' + d + '"/>';
    });
    return s;
  }
  /** Vertical trunk (tall layout): from a point down the left, elbows right into each child. */
  function trunk(px, py, kids, r, cls) {
    if (!kids.length) return '';
    const last = kids[kids.length - 1];
    let s = '<path class="wire ' + cls + '" d="M' + r1(px) + ' ' + r1(py) + 'V' + r1(last.y - r) + 'Q' + r1(px) + ' ' + r1(last.y) + ' ' + r1(px + r) + ' ' + r1(last.y) + 'H' + r1(last.x) + '"/>';
    kids.slice(0, -1).forEach((k) => { s += '<path class="wire ' + cls + '" d="M' + r1(px) + ' ' + r1(k.y) + 'H' + r1(k.x) + '"/>'; });
    return s;
  }

  function drawTree() {
    if (!layout) return;
    const P = layout.P;
    const live = (id) => { const n = nodes.get(id); return n && !n.gone ? n : null; };
    let s = '';
    const rootN = nodes.get('root');
    // soft regional band behind each domain's rows
    BP.domains.forEach((d) => {
      const dn = live('d:' + d.id);
      if (!dn) return;
      let right = dn.x + dn.w, top = dn.y, bot = dn.y + dn.h;
      if (!state.collapsed.has(dn.id)) BP.modulesOf(d.id).forEach((m) => {
        const mn = live('m:' + m.id);
        if (!mn) return;
        right = Math.max(right, mn.x + mn.w + (state.collapsed.has(mn.id) ? 140 : 0));
        top = Math.min(top, mn.y); bot = Math.max(bot, mn.y + mn.h);
        BP.featuresOf(m.id).forEach((f) => { const fn = live(fid(f)); if (fn) right = Math.max(right, fn.x + fn.w); });
      });
      const padB = layout.tall ? 11 : 9;
      s += '<rect class="band" x="' + r1(dn.x - padB) + '" y="' + r1(top - padB) + '" width="' + r1(right - dn.x + padB * 2) + '" height="' + r1(bot - top + padB * 2) + '" rx="16"/>';
    });
    const doms = BP.domains.map((d) => live('d:' + d.id)).filter(Boolean);
    if (layout.tall) {
      s += trunk(P.TRUNK, rootN.y + rootN.h, doms.map((d) => ({ x: d.x, y: d.y + 52 })), 12, 'w1');
    } else {
      s += fan(rootN.x + rootN.w, rootN.y + rootN.h / 2, rootN.x + rootN.w + P.GRD / 2, doms.map((d) => ({ x: d.x, y: d.y + d.h / 2 })), 14, 'w1');
    }
    BP.domains.forEach((d) => {
      const dn = live('d:' + d.id);
      if (!dn || state.collapsed.has(dn.id)) return;
      const mods = BP.modulesOf(d.id).map((m) => live('m:' + m.id)).filter(Boolean);
      const kids = mods.map((mn) => ({ x: mn.x, y: mn.y + mn.h / 2, cls: 'w2 wb' + bin(rollVal(BP.moduleRollup(mn.data.id), state.lens)), mid: mn.data.id }));
      s += '<g data-wd="' + d.id + '">' + fan(dn.x + dn.w, dn.y + dn.h / 2, dn.x + dn.w + P.GDM / 2, kids, 10, 'w2') + '</g>';
      mods.forEach((mn) => {
        const rws = layout.rows.get(mn.id) || [];
        let ms = '';
        if (state.collapsed.has(mn.id) || !rws.length) {
          ms += '<path class="wire w3" d="M' + r1(mn.x + mn.w) + ' ' + r1(mn.y + mn.h / 2) + 'H' + r1(mn.x + mn.w + P.GMF) + '"/>';
        } else {
          const firsts = rws.map((row) => nodes.get(row[0]));
          if (firsts.length === 1) {
            ms += '<path class="wire w3" d="M' + r1(mn.x + mn.w) + ' ' + r1(firsts[0].y + G.FH / 2) + 'H' + r1(firsts[0].x) + '"/>';
          } else {
            ms += fan(mn.x + mn.w, mn.y + mn.h / 2, mn.x + mn.w + P.GMF / 2, firsts.map((fn) => ({ x: fn.x, y: fn.y + G.FH / 2 })), 6, 'w3');
          }
          rws.forEach((row) => {
            for (let i = 1; i < row.length; i++) {
              const a = nodes.get(row[i - 1]);
              const b = nodes.get(row[i]);
              ms += '<path class="wire w3" d="M' + r1(a.x + G.FW) + ' ' + r1(a.y + G.FH / 2) + 'H' + r1(b.x) + '"/>';
            }
          });
        }
        s += '<g data-wm="' + mn.data.id + '">' + ms + '</g>';
      });
    });
    gTree.innerHTML = s;
    applyTreeDim();
  }

  /* ── dependency links for the selected feature ── */
  function visibleAnchor(id) {
    let n = nodes.get(id);
    if (n && !n.gone) return n;
    const f = n && n.data;
    if (f && f.moduleId) {
      const m = nodes.get('m:' + f.moduleId);
      if (m && !m.gone) return m;
      const mod = BP.module(f.moduleId);
      return nodes.get('d:' + mod.domainId);
    }
    return n;
  }
  function depPath(a, b) {
    const ax2 = a.x + a.w, bx2 = b.x + b.w;
    let x1, y1, x2, y2, c1x, c1y, c2x, c2y;
    if (bx2 < a.x - 4) {
      x1 = a.x; y1 = a.y + a.h / 2; x2 = bx2; y2 = b.y + b.h / 2;
      const dx = Math.max((x1 - x2) * 0.45, Math.min(40, Math.abs(y2 - y1) * 0.3));
      c1x = x1 - dx; c1y = y1; c2x = x2 + dx; c2y = y2;
    } else if (b.x > ax2 + 4) {
      x1 = ax2; y1 = a.y + a.h / 2; x2 = b.x; y2 = b.y + b.h / 2;
      const dx = Math.max((x2 - x1) * 0.45, Math.min(40, Math.abs(y2 - y1) * 0.3));
      c1x = x1 + dx; c1y = y1; c2x = x2 - dx; c2y = y2;
    } else {
      const down = b.y > a.y;
      x1 = a.x + a.w / 2 + (b.x > a.x ? 18 : -18); y1 = down ? a.y + a.h : a.y;
      x2 = b.x + b.w / 2 + (b.x > a.x ? -18 : 18); y2 = down ? b.y : b.y + b.h;
      const dy = Math.abs(y2 - y1) * 0.5 * (down ? 1 : -1);
      c1x = x1; c1y = y1 + dy; c2x = x2; c2y = y2 - dy;
    }
    return 'M' + r1(x1) + ' ' + r1(y1) + 'C' + r1(c1x) + ' ' + r1(c1y) + ' ' + r1(c2x) + ' ' + r1(c2y) + ' ' + r1(x2) + ' ' + r1(y2);
  }
  function drawDeps() {
    const n = state.sel && nodes.get(state.sel);
    if (!n || n.type !== 'feature') { gDeps.innerHTML = ''; return; }
    const k = state.cam.k;
    const sw = clamp(2 / k, 1.4, 5);
    const a = visibleAnchor(n.id);
    let halo = '';
    let lines = '';
    const draw = (from, to, kind) => {
      if (!from || !to || from === to) return;
      const d = depPath(from, to);
      halo += '<path class="dep-halo" stroke-width="' + r1(sw + 3 / k) + '" d="' + d + '"/>';
      lines += '<path class="dep-' + kind + '" stroke-width="' + r1(sw) + '"' + (kind === 'down' ? ' stroke-dasharray="' + r1(sw * 3) + ' ' + r1(sw * 2) + '"' : '') + ' marker-end="url(#arr-' + kind + ')" d="' + d + '"/>';
    };
    BP.dependencies(n.data).forEach((f) => draw(a, visibleAnchor(fid(f)), 'up'));
    BP.dependents(n.data).forEach((f) => draw(visibleAnchor(fid(f)), a, 'down'));
    gDeps.innerHTML = halo + lines;
    const mk = r1(clamp(10 / k, 6, 22));
    gDeps.ownerSVGElement.querySelectorAll('marker').forEach((m) => { m.setAttribute('markerWidth', mk); m.setAttribute('markerHeight', mk); });
  }

  /* ── node positions, tweening ── */
  function placeNode(n) { n.el.setAttribute('transform', 'translate(' + r1(n.x) + ' ' + r1(n.y) + ')'); }

  let layoutAnim = null;
  /** Recomputes layout; animates nodes from their current spot unless instant. */
  function relayout(animate) {
    const prevMode = layout ? layout.tall : null;
    layout = computeLayout();
    app.classList.toggle('is-tall', layout.tall);
    const sizeChanged = prevMode !== null && prevMode !== layout.tall;
    nodes.forEach((n) => {
      const p = layout.pos.get(n.id);
      n.fx = n.x; n.fy = n.y;
      n.tx = p.x; n.ty = p.y;
      const resized = n.w !== p.w || n.h !== p.h;
      n.w = p.w; n.h = p.h;
      const goneNow = !!p.gone;
      if (goneNow !== n.gone) n.el.classList.toggle('gone', goneNow);
      n.gone = goneNow;
      if (resized || sizeChanged) renderNode(n);
    });
    if (!animate || reduced()) {
      nodes.forEach((n) => { n.x = n.tx; n.y = n.ty; placeNode(n); });
      layoutAnim = null;
      drawTree(); drawDeps(); drawMinimap();
      return;
    }
    layoutAnim = { t0: performance.now(), dur: 420 };
    schedule();
  }
  function stepLayout(now) {
    if (!layoutAnim) return false;
    const t = clamp((now - layoutAnim.t0) / layoutAnim.dur, 0, 1);
    const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    nodes.forEach((n) => { n.x = n.fx + (n.tx - n.fx) * e; n.y = n.fy + (n.ty - n.fy) * e; placeNode(n); });
    drawTree(); drawDeps();
    if (t >= 1) { layoutAnim = null; drawMinimap(); return false; }
    return true;
  }

  /* ── classes: filters, selection, focus, trust ── */
  function filterActive() { return state.statuses.size > 0 || state.attnOnly || state.query.trim() !== ''; }
  function matchesFilter(f) {
    return BP.matches(f, { statuses: state.statuses, query: state.query, attentionOnly: state.attnOnly });
  }
  function inFocus(n) {
    if (!state.focus) return true;
    const fo = state.focus;
    if (n.type === 'root') return false;
    if (fo.startsWith('m:')) {
      const mid = fo.slice(2);
      if (n.type === 'module') return n.data.id === mid;
      if (n.type === 'feature') return n.data.moduleId === mid;
      if (n.type === 'domain') return BP.module(mid).domainId === n.data.id;
      return false;
    }
    const did = fo.slice(2);
    if (n.type === 'domain') return n.data.id === did;
    if (n.type === 'module') return n.data.domainId === did;
    if (n.type === 'feature') return BP.module(n.data.moduleId).domainId === did;
    return false;
  }
  function applyClasses() {
    const fa = filterActive();
    const hasQuery = state.query.trim() !== '';
    const selN = state.sel && nodes.get(state.sel);
    const selF = selN && selN.type === 'feature' ? selN.data : null;
    const related = new Set();
    if (selF) {
      BP.dependencies(selF).forEach((f) => related.add(f.id));
      BP.dependents(selF).forEach((f) => related.add(f.id));
    }
    const modMatch = new Map();
    svg.classList.toggle('trust', state.trust);
    nodes.forEach((n) => {
      let o = 1;
      const el = n.el;
      if (n.type === 'feature') {
        const f = n.data;
        const m = fa ? matchesFilter(f) : true;
        if (m) modMatch.set(f.moduleId, (modMatch.get(f.moduleId) || 0) + 1);
        el.classList.toggle('hit', hasQuery && m);
        el.classList.toggle('rel', related.has(f.id));
        if (fa && !m) o = Math.min(o, 0.16);
        if (state.trust && !QUEUE_SET.has(f.id)) o = Math.min(o, 0.3);
        if (selF && f.id !== selF.id && !related.has(f.id) && !(hasQuery && m)) o = Math.min(o, 0.5);
      }
      if (!inFocus(n)) o = Math.min(o, 0.07);
      el.classList.toggle('sel', state.sel === n.id);
      n.op = o;
    });
    nodes.forEach((n) => {
      if (n.type === 'module' && fa && !modMatch.get(n.data.id)) n.op = Math.min(n.op, 0.3);
      if (n.el.style.opacity !== String(n.op)) n.el.style.opacity = n.op === 1 ? '' : String(n.op);
    });
    applyTreeDim();
  }
  function applyTreeDim() {
    gTree.style.opacity = state.focus ? '0.25' : state.trust ? '0.6' : '1';
  }

  /* ═════════════════════════════ interaction ═════════════════════════════ */
  /* ── camera ── */
  const cam = state.cam;
  let camAnim = null;
  let rafId = 0;
  let camDirty = false;
  function schedule() { if (!rafId) rafId = requestAnimationFrame(tick); }
  function tick(now) {
    rafId = 0;
    let more = false;
    if (camAnim) {
      const t = clamp((now - camAnim.t0) / camAnim.dur, 0, 1);
      const e = 1 - Math.pow(1 - t, 3);
      const lk0 = Math.log(camAnim.from.k), lk1 = Math.log(camAnim.to.k);
      const k = Math.exp(lk0 + (lk1 - lk0) * e);
      // interpolate the world point at the view center so zoom and pan travel together
      const cx0 = (camAnim.vc.x - camAnim.from.x) / camAnim.from.k, cy0 = (camAnim.vc.y - camAnim.from.y) / camAnim.from.k;

      const ri = rows.findIndex((row) => row.indexOf(cur.id) >= 0);
      const row = rows[ri] || [];
      const ci = row.indexOf(cur.id);
      if (key === 'ArrowLeft') next = ci > 0 ? row[ci - 1] : 'm:' + cur.data.moduleId;
      if (key === 'ArrowRight') next = row[ci + 1];
      if (key === 'ArrowUp' || key === 'ArrowDown') {
        const target = rows[ri + (key === 'ArrowUp' ? -1 : 1)];
        if (target) {
          let best = null, bd = Infinity;
          target.forEach((id) => { const d = Math.abs(nodes.get(id).tx - cur.tx); if (d < bd) { bd = d; best = id; } });
          next = best;
        }
      }
    }
    if (next) {
      const nn = nodes.get(next);
      select(next, { reveal: true });
      ensureVisible(next, nn.type === 'feature' ? 0.85 : 0);
    }
  }
  doc.addEventListener('keydown', (e) => {
    const t = e.target;
    const tag = t && t.tagName ? t.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const onButton = tag === 'button';
    const k = e.key;
    if (k >= '1' && k <= '4') { setLens(BP.LENSES[Number(k) - 1]); e.preventDefault(); return; }
    if (k === '+' || k === '=') { zoomBy(1.4); e.preventDefault(); return; }
    if (k === '-' || k === '_') { zoomBy(1 / 1.4); e.preventDefault(); return; }
    if (k === '0') { fitAll(true); e.preventDefault(); return; }
    if (k === '/') { openSearch(); e.preventDefault(); return; }
    if (k === 't' || k === 'T') { setTrust(!state.trust); return; }
    if (k === 'l' || k === 'L' || k === '?') { setLegend(!state.legend); return; }
    if (k === '[') { stepQueue(-1); return; }
    if (k === ']') { stepQueue(1); return; }
    if (k === 'f' || k === 'F') {
      const n = state.sel && nodes.get(state.sel);
      if (n) setFocus(n.type === 'feature' ? 'm:' + n.data.moduleId : n.type === 'root' ? null : n.id, true);
      return;
    }
    if (k === 'c' || k === 'C') {
      const n = state.sel && nodes.get(state.sel);
      if (n && (n.type === 'module' || n.type === 'domain')) toggleCollapse(n.id);
      return;
    }
    if (k === 'Escape') { escapeChain(); return; }
    if (onButton && (k === 'Enter' || k === ' ')) return;
    if (k.startsWith('Arrow')) { navigate(k); e.preventDefault(); return; }
    if (k === 'Enter') { if (state.sel) { openInspector(); } else select('root', { open: true }); e.preventDefault(); }
  });

      if (QUEUE_SET.has(f.id)) h += '<div class="callout callout-trust"><b>Needs a human</b>' + (f.review === 'changes' ? 'A reviewer asked for changes on the latest agent change. Check the fix before it ships.' : 'The latest change was built by ' + (f.builtBy === 'agent' ? 'an agent crew' : 'an agent and human pair') + ' and nobody has reviewed it yet.') + '</div>';
      h += '<dl class="facts">' +
        '<div class="fact"><dt>Release</dt><dd class="wrap">' + (rel ? esc(rel.label) + ' <span class="sub">' + esc(rel.state === 'shipped' ? 'shipped ' + rel.date : rel.state === 'next' ? 'next · ' + rel.date : 'planned · ' + rel.date) + '</span>' : 'Unscheduled') + '</dd></div>' +
        '<div class="fact"><dt>Owner</dt><dd>' + esc(teamName(f.owner)) + '</dd></div>' +
        '<div class="fact"><dt>Built by</dt><dd>' + builtSvg(f.builtBy) + esc(BUILT_LABEL[f.builtBy]) + '</dd></div>' +
        '<div class="fact"><dt>Review</dt><dd class="rv-' + f.review + '">' + esc(REVIEW_LABEL[f.review]) + '</dd></div>' +
        '<div class="fact"><dt>Updated</dt><dd class="wrap">' + fmtDate(f.updatedAt) + '</dd></div>' +
        '<div class="fact"><dt>Score</dt><dd class="wrap"><span class="dim-pct">' + pct(BP.featureScore(f)) + '%</span> <span class="sub">mean of 3 dimensions</span></dd></div>' +
        '</dl>';
      h += '<div class="sec-h"><h3>Dimensions</h3><span>12 facets</span></div>' + facetsBlock(f);
      const mt = f.metrics || {};
      const metric = (label, v, unit, cap, digits) => '<div class="metric"><dt>' + label + '</dt>' + (v == null ? '<dd class="na">—</dd><div class="cap">' + cap + '</div>' : '<dd>' + (digits ? v.toFixed(digits) : v) + '<small>' + unit + '</small></dd>') + '</div>';
      h += '<div class="sec-h"><h3>Metrics</h3><span>last 30 days</span></div><dl class="metrics">' +
        metric('Coverage', mt.coverage, '%', 'No tests yet') + metric('Uptime', mt.uptime, '%', 'Not in production', 2) + metric('Adoption', mt.adoption, '%', 'Not released') + '</dl>';
      const deps = BP.dependencies(f);
      const dents = BP.dependents(f);
      const sub = (x) => { const mm = BP.module(x.moduleId); return mm.name + ' · ' + STATUS[x.status].label; };
      h += '<div class="sec-h"><h3>Depends on</h3><span>' + deps.length + '</span></div>' + (deps.length ? '<ul class="flist">' + deps.map((x) => featureRow(x, sub(x))).join('') + '</ul>' : '<div class="empty">No dependencies. This feature stands on its own.</div>');
      h += '<div class="sec-h"><h3>Used by</h3><span>' + dents.length + '</span></div>' + (dents.length ? '<ul class="flist">' + dents.map((x) => featureRow(x, sub(x))).join('') + '</ul>' : '<div class="empty">Nothing depends on this feature yet.</div>');
    } else if (n.type === 'module') {
      const m = n.data;
      const d = BP.domain(m.domainId);
      const r = BP.moduleRollup(m.id);
      const fs = rowOrder(m.id);
      crumbs = [['d:' + d.id, d.name]];
      h += '<h2 class="insp-title"><span class="insp-code">' + esc(m.code) + '</span>' + esc(m.name) + '</h2>';
      h += '<div class="tags"><span class="tag">' + esc(teamName(m.owner)) + '</span>' + m.surfaces.map((x) => '<span class="tag tag-mono">' + esc(x) + '</span>').join('') +
        (r.attention ? '<span class="tag tag-attn">' + r.attention + ' need attention</span>' : '') + '</div>';
      h += '<p class="summary">' + esc(m.summary) + '</p>';
      h += '<div class="actions">' + (state.focus === n.id ? '<button type="button" class="btn" data-do="unfocus">Leave focus</button>' : '<button type="button" class="btn btn-ink" data-do="focus" data-id="' + n.id + '">Focus module</button>') +
        '<button type="button" class="btn" data-do="collapse" data-id="' + n.id + '">' + (state.collapsed.has(n.id) ? 'Expand features' : 'Collapse features') + '</button></div>';
      h += '<div class="bigstat"><b>' + pct(rollVal(r, state.lens)) + '%</b><span>' + esc(LENS_LABEL[state.lens].toLowerCase()) + ' complete · ' + r.count + ' features</span></div>' + statusSummary(r);
      h += '<div class="sec-h"><h3>Dimensions</h3><span>facet states</span></div>' + rollupDims(BP.featuresOf(m.id));
      h += '<div class="sec-h"><h3>Features</h3><span>' + fs.length + (state.lens === 'overall' ? ' · by status' : ' · by ' + esc(LENS_LABEL[state.lens].toLowerCase())) + '</span></div><ul class="flist">' + fs.map((f) => featureRow(f, STATUS[f.status].label + ' · ' + relLabel(f.release) + ' · ' + REVIEW_LABEL[f.review])).join('') + '</ul>';
    } else if (n.type === 'domain') {
      const d = n.data;
      const r = BP.domainRollup(d.id);
      const mods = BP.modulesOf(d.id);
      crumbs = [];
      h += '<h2 class="insp-title"><span class="insp-code">' + esc(d.code) + '</span>' + esc(d.name) + '</h2>';
      h += '<p class="summary">' + esc(d.summary) + '</p>';
      h += '<div class="actions">' + (state.focus === n.id ? '<button type="button" class="btn" data-do="unfocus">Leave focus</button>' : '<button type="button" class="btn btn-ink" data-do="focus" data-id="' + n.id + '">Focus domain</button>') +
        '<button type="button" class="btn" data-do="collapse" data-id="' + n.id + '">' + (state.collapsed.has(n.id) ? 'Expand modules' : 'Collapse modules') + '</button></div>';
      h += '<div class="bigstat"><b>' + pct(rollVal(r, state.lens)) + '%</b><span>' + esc(LENS_LABEL[state.lens].toLowerCase()) + ' complete · ' + r.count + ' features</span></div>' + statusSummary(r);
      h += '<div class="sec-h"><h3>Dimensions</h3><span>facet states</span></div>' + rollupDims(BP.featuresOfDomain(d.id));
      h += '<div class="sec-h"><h3>Modules</h3><span>' + mods.length + '</span></div><ul class="flist">' + mods.map((m) => {
        const mr = BP.moduleRollup(m.id);
        return '<li><button type="button" class="frow" data-go="m:' + m.id + '"><span class="tag-mono" style="font-size:10px;color:var(--ink-3)">' + esc(m.code) + '</span><span class="frow-name">' + esc(m.name) + '<small>' + mr.count + ' features · ' + esc(teamName(m.owner)) + (mr.attention ? ' · ' + mr.attention + ' need attention' : '') + '</small></span><span class="frow-meta"><b style="color:var(--ink)">' + pct(rollVal(mr, state.lens)) + '%</b></span></button></li>';
      }).join('') + '</ul>';
    } else {
      const p = BP.product;
      const r = BP.productRollup();
      h += '<h2 class="insp-title">' + esc(p.name) + ' <span class="insp-code" style="vertical-align:2px">v' + esc(p.version) + '</span></h2>';
      h += '<p class="summary">' + esc(p.tagline) + '. ' + BP.domains.length + ' domains, ' + BP.modules.length + ' modules and ' + r.count + ' features. ' + r.byBuilder.agent + ' were built by agent crews and ' + r.byBuilder.pair + ' in agent and human pairs.</p>';
      h += '<div class="bigstat"><b>' + pct(rollVal(r, state.lens)) + '%</b><span>' + esc(LENS_LABEL[state.lens].toLowerCase()) + ' complete</span></div>' + statusSummary(r);
      h += '<div class="sec-h"><h3>Dimensions</h3><span>facet states</span></div>' + rollupDims(BP.features);
      h += '<div class="sec-h"><h3>Releases</h3><span>features</span></div><ul class="timeline">' + BP.releases.map((rel) => {
        const c = BP.features.filter((f) => f.release === rel.id).length;
        return '<li><span class="rl">' + esc(rel.label) + '</span><span class="rd">' + esc(rel.date) + ' · ' + c + ' features</span><span class="rs' + (rel.state === 'next' ? ' rs-next' : '') + '">' + esc(rel.state) + '</span></li>';
      }).join('') + '</ul>';
      h += '<div class="sec-h"><h3>Stack</h3></div><dl class="stack">' + Object.keys(p.stack).map((k) => '<dt>' + esc(k) + '</dt><dd>' + esc(p.stack[k]) + '</dd>').join('') + '</dl>';
    }
    $('insp-crumbs').innerHTML = crumbsHtml([['root', BP.product.name]].concat(crumbs));
    $('insp-body').innerHTML = h;
  }

  /* ── minimap ── */
  const mm = { scale: 1, ox: 0, oy: 0, w: 0, h: 0 };
  function drawMinimap() {
    if (!layout) return;
    const box = $('minimap');
    const zb = $('zoombar');
    if (!minimapOn()) { box.style.display = 'none'; zb.style.bottom = ''; return; }
    box.style.display = '';
    const cv = $('mm-canvas');
    const b = layout.bounds;
    const W = 172;
    const H = Math.round(Math.min(150, W * b.h / b.w));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
    const ctx = cv.getContext('2d');
    const cs = getComputedStyle(app);
    const tok = (n) => cs.getPropertyValue(n).trim();
    const pad = 4;
    mm.scale = Math.min((W - pad * 2) / b.w, (H - pad * 2) / b.h);
    mm.ox = pad + ((W - pad * 2) - b.w * mm.scale) / 2;
    mm.oy = pad + ((H - pad * 2) - b.h * mm.scale) / 2;
    mm.w = W; mm.h = H;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = tok('--canvas');
    ctx.fillRect(0, 0, W, H);
    const fa = filterActive();
    const lensColor = tok('--lens') || tok('--ink');
    nodes.forEach((n) => {
      if (n.gone) return;
      const x = mm.ox + n.tx * mm.scale, y = mm.oy + n.ty * mm.scale, w = Math.max(1, n.w * mm.scale), h = Math.max(1, n.h * mm.scale);
      ctx.globalAlpha = 1;
      if (n.type === 'root') { ctx.fillStyle = tok('--root-bg'); ctx.fillRect(x, y, w, h); }
      else if (n.type === 'domain') { ctx.fillStyle = tok('--rule-2'); ctx.fillRect(x, y, w, h); }
      else if (n.type === 'module') {
        ctx.fillStyle = tok('--paper'); ctx.fillRect(x, y, w, h);
        ctx.fillStyle = lensColor; ctx.globalAlpha = 0.15 + 0.85 * rollVal(BP.moduleRollup(n.data.id), state.lens); ctx.fillRect(x, y, w, h);
      } else {
        const dim = (fa && !matchesFilter(n.data)) || (state.trust && !QUEUE_SET.has(n.data.id));
        ctx.globalAlpha = dim ? 0.22 : 1;
        ctx.fillStyle = tok('--' + n.data.status);
        ctx.fillRect(x, y, Math.max(1, w - 0.6), Math.max(1, h - 0.6));
      }
    });
    ctx.globalAlpha = 1;
    zb.style.bottom = (box.offsetHeight + 26) + 'px';
    updateMinimapView();
  }
  function updateMinimapView() {
    if (!layout || !minimapOn()) return;
    const v = $('mm-view');
    const x0 = (-cam.x) / cam.k, y0 = (-cam.y) / cam.k, x1 = (stageW - cam.x) / cam.k, y1 = (stageH - cam.y) / cam.k;
    let l = mm.ox + x0 * mm.scale, t = mm.oy + y0 * mm.scale, r = mm.ox + x1 * mm.scale, b = mm.oy + y1 * mm.scale;
    l = clamp(l, 0, mm.w); r = clamp(r, 0, mm.w); t = clamp(t, 0, mm.h); b = clamp(b, 0, mm.h);
    v.style.left = (6 + l) + 'px'; v.style.top = (6 + t) + 'px';
    v.style.width = Math.max(4, r - l) + 'px'; v.style.height = Math.max(4, b - t) + 'px';
  }
  (function bindMinimap() {
    const cv = $('mm-canvas');
    let dragging = false;
    const moveTo = (e) => {
      const rect = cv.getBoundingClientRect();
      const wx = (e.clientX - rect.left - mm.ox) / mm.scale, wy = (e.clientY - rect.top - mm.oy) / mm.scale;
      const r = viewRect();
      setCam(r.x + r.w / 2 - wx * cam.k, r.y + r.h / 2 - wy * cam.k, cam.k);
      state.touched = true;
    };
    cv.addEventListener('pointerdown', (e) => { dragging = true; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } moveTo(e); });
    cv.addEventListener('pointermove', (e) => { if (dragging) moveTo(e); });
    const stop = () => { dragging = false; };
    cv.addEventListener('pointerup', stop);
    cv.addEventListener('pointercancel', stop);
  })();

  /* ── sizing and boot ── */
  function measureStage() {
    const r = wrap.getBoundingClientRect();
    stageW = r.width; stageH = r.height;
  }
  function onResize() {
    const pw = stageW, ph = stageH;
    measureStage();
    if (!stageW || !stageH) return;
    const mode = stageW / stageH < 0.9 ? 'tall' : 'wide';
    if (mode !== state.mode) {
      state.mode = mode;
      relayout(false);
      renderAll();
      applyClasses();
      fitAll(false);
      return;
    }
    drawMinimap();
    if (!state.touched) { fitAll(false); return; }
    // keep the world point at the view center steady
    const cx = (pw / 2 - cam.x) / cam.k, cy = (ph / 2 - cam.y) / cam.k;
    setCam(stageW / 2 - cx * cam.k, stageH / 2 - cy * cam.k, cam.k);
  }

  function boot() {
    try { const t = localStorage.getItem('atlas-theme'); if (t === 'light' || t === 'dark' || t === 'system') state.theme = t; } catch (err) { /* storage unavailable */ }
    applyTheme();
    readFamilies();
    buildChrome();
    renderLegend();
    measureStage();
    state.mode = stageW / Math.max(1, stageH) < 0.9 ? 'tall' : 'wide';
    createNodes();
    layout = computeLayout();
    app.classList.toggle('is-tall', layout.tall);
    nodes.forEach((n) => { const p = layout.pos.get(n.id); n.x = n.tx = p.x; n.y = n.ty = p.y; n.w = p.w; n.h = p.h; n.gone = !!p.gone; n.el.classList.toggle('gone', n.gone); placeNode(n); });
    renderAll();
    drawTree();
    applyClasses();
    renderCrumbs();
    fitAll(false);
    applyCamera();
    drawMinimap();
    if (window.ResizeObserver) new ResizeObserver(() => onResize()).observe(wrap);
    else window.addEventListener('resize', onResize);
    darkQuery.addEventListener && darkQuery.addEventListener('change', () => drawMinimap());
    if (doc.fonts && doc.fonts.ready) {
      Promise.all([doc.fonts.load('600 13px Geist'), doc.fonts.load('500 12px "Geist Mono"')]).catch(() => null).then(() => doc.fonts.ready).then(() => {
        readFamilies(); renderAll(); applyClasses();
      }).catch(() => { /* fallback fonts stay */ });
    }
  }

  // Scenario and debugging hooks (read-only helpers for the screenshot harness).
  window.__atlas = {
    select: (id, zoom) => select(id.indexOf(':') > 0 ? id : 'f:' + id, { open: true, fly: true, zoom: zoom || 1.1 }),
    focus: (id) => setFocus(id, true),
    zoom: (k) => { const r = viewRect(); zoomAt(r.x + r.w / 2, r.y + r.h / 2, k, false); },
    flyTo: (id, k) => flyToNode(id.indexOf(':') > 0 ? id : 'f:' + id, k),
    lens: setLens,
    state: () => ({ lens: state.lens, level: state.level, k: Math.round(cam.k * 1000) / 1000, sel: state.sel, mode: state.mode, focus: state.focus }),
  };

  boot();
})();
</script>
</body>
</html>
