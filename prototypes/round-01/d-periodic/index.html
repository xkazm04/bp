<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Periodic Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap">
<style>
/* Layout concept: a periodic table of features. 20 module columns of element tiles stacked Live > Blocked under black domain bands, a "how to read a tile" key in the sheet's open space, a ruled toolbar above and a numeral HUD strip below; the inspector docks right (bottom sheet on phone). */
:root {
  /* palette: white sheet, black ink, one signal */
  --paper: #fcfcfa;
  --paper-2: #f1f1ee;
  --paper-3: #e6e6e2;
  --ink: #101113;
  --ink-2: #3d3f44;
  --ink-3: #686b71;
  --ink-4: #a2a5aa;
  --rule: #cbccce;
  --rule-2: #e2e2df;
  --signal: #f0520c;
  --signal-ink: #b23b04;
  --signal-wash: #fde6da;
  --on-signal: #101113;
  --band: #101113;
  --on-band: #fcfcfa;
  --on-band-2: #a9abb0;
  --clear: rgba(0, 0, 0, 0);
  --scrim: rgba(16, 17, 19, 0.24);
  --shadow: rgba(16, 17, 19, 0.14);
  /* status: subdued inks for glyphs, pale tints for tile fills */
  --st-live: #2b6a4b;
  --st-ready: #36608c;
  --st-build: #8f650f;
  --st-plan: #7f8288;
  --st-block: #f0520c;
  --tn-live: #dbeadf;
  --tn-ready: #dce5f0;
  --tn-build: #f2e6c8;
  --tn-plan: #fcfcfa;
  --tn-block: #fcebe2;
  /* lens ramp: amount of ink, 0-19 % ... 80-100 % */
  --r0: #f0f0ed;
  --r1: #d2d3d3;
  --r2: #a1a3a7;
  --r3: #5b5e64;
  --r4: #17181b;
  /* type roles */
  --f-grot: 'Archivo', 'Archivo Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-mono: 'Martian Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  /* shell metrics */
  --bar-h: 56px;
  --hud-h: 64px;
  --insp-w: 408px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b0b0c;
    --paper-2: #151517;
    --paper-3: #1f2023;
    --ink: #f3f3ef;
    --ink-2: #c6c7ca;
    --ink-3: #8f9197;
    --ink-4: #5a5c61;
    --rule: #393a3e;
    --rule-2: #232427;
    --signal: #ff6a1f;
    --signal-ink: #ff8f55;
    --signal-wash: #33170a;
    --on-signal: #0b0b0c;
    --band: #ecece7;
    --on-band: #0b0b0c;
    --on-band-2: #55575c;
    --scrim: rgba(0, 0, 0, 0.5);
    --shadow: rgba(0, 0, 0, 0.55);
    --st-live: #74c294;
    --st-ready: #87acdc;
    --st-build: #d8a945;
    --st-plan: #8f9197;
    --st-block: #ff6a1f;
    --tn-live: #13281b;
    --tn-ready: #132136;
    --tn-build: #2d230e;
    --tn-plan: #0b0b0c;
    --tn-block: #2b1308;
    --r0: #1a1a1c;
    --r1: #38393d;
    --r2: #6b6d72;
    --r3: #b3b5b9;
    --r4: #f3f3ef;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b0b0c;
  --paper-2: #151517;
  --paper-3: #1f2023;
  --ink: #f3f3ef;
  --ink-2: #c6c7ca;
  --ink-3: #8f9197;
  --ink-4: #5a5c61;
  --rule: #393a3e;
  --rule-2: #232427;
  --signal: #ff6a1f;
  --signal-ink: #ff8f55;
  --signal-wash: #33170a;
  --on-signal: #0b0b0c;
  --band: #ecece7;
  --on-band: #0b0b0c;
  --on-band-2: #55575c;
  --scrim: rgba(0, 0, 0, 0.5);
  --shadow: rgba(0, 0, 0, 0.55);
  --st-live: #74c294;
  --st-ready: #87acdc;
  --st-build: #d8a945;
  --st-plan: #8f9197;
  --st-block: #ff6a1f;
  --tn-live: #13281b;
  --tn-ready: #132136;
  --tn-build: #2d230e;
  --tn-plan: #0b0b0c;
  --tn-block: #2b1308;
  --r0: #1a1a1c;
  --r1: #38393d;
  --r2: #6b6d72;
  --r3: #b3b5b9;
  --r4: #f3f3ef;
  color-scheme: dark;
}

/* ── Shell ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-grot); font-size: 13px; line-height: 1.35; overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: var(--clear); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-mono); font-stretch: 75%; }
kbd { font-family: var(--f-mono); font-stretch: 75%; font-size: 9.5px; font-weight: 500; color: var(--ink-3); border: 1px solid var(--rule); padding: 0 3px; line-height: 14px; min-width: 15px; text-align: center; display: inline-block; }

#app { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }

/* ── Toolbar ───────────────────────────────────────────────────────────── */
#bar { position: relative; z-index: 6; display: flex; align-items: center; gap: 18px; height: var(--bar-h); padding: 0 16px; border-bottom: 2px solid var(--ink); background: var(--paper); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; flex: none; min-width: 0; }
.logo { width: 34px; height: 38px; flex: none; }
.brand-t { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.brand-t b { font-weight: 800; font-stretch: 112.5%; font-size: 14px; letter-spacing: -0.005em; white-space: nowrap; }
.brand-t span { font-family: var(--f-mono); font-stretch: 75%; font-size: 10.5px; color: var(--ink-3); white-space: nowrap; margin-top: 3px; }
.brand-t span em { font-style: normal; color: var(--ink); font-weight: 600; }
.tb-mid { display: flex; align-items: center; gap: 14px; flex: 1 1 auto; min-width: 0; justify-content: center; }
.seg { display: flex; align-items: stretch; border: 1.5px solid var(--ink); height: 34px; flex: none; }
.seg button { display: flex; align-items: center; gap: 6px; padding: 0 11px; font-weight: 600; font-stretch: 87.5%; font-size: 13px; white-space: nowrap; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button kbd { border: 0; padding: 0; min-width: 0; font-size: 10px; }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
.seg button[aria-checked="true"] kbd { color: var(--ink-4); }
.seg button:not([aria-checked="true"]):hover { background: var(--paper-2); }
.seg-cap { font-family: var(--f-mono); font-stretch: 75%; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-right: -6px; }
.srch { position: relative; display: flex; align-items: center; height: 34px; border: 1.5px solid var(--ink); width: 250px; flex: none; background: var(--paper); }
.srch svg { width: 15px; height: 15px; margin: 0 6px 0 9px; flex: none; color: var(--ink-2); }
.srch input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 13px; font-weight: 500; padding: 0; }
.srch input::placeholder { color: var(--ink-3); }
.srch input::-webkit-search-cancel-button { -webkit-appearance: none; }
.srch:focus-within { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink); }
#qn { font-family: var(--f-mono); font-stretch: 75%; font-size: 10.5px; color: var(--ink-3); padding: 0 6px; white-space: nowrap; }
#qn.none { color: var(--signal-ink); }
.srch kbd { margin-right: 8px; }
.tb-right { display: flex; align-items: center; gap: 8px; flex: none; }
.tbtn { height: 34px; min-width: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 10px; border: 1.5px solid var(--ink); font-weight: 600; font-stretch: 87.5%; font-size: 13px; white-space: nowrap; }
.tbtn svg { width: 16px; height: 16px; flex: none; }
.tbtn[aria-pressed="true"], .tbtn[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
.tbtn:hover:not([aria-pressed="true"]):not([aria-expanded="true"]) { background: var(--paper-2); }
.icon-only { padding: 0; width: 34px; }
#b-search { display: none; }
#phone-row { display: none; }

/* ── Stage ─────────────────────────────────────────────────────────────── */
#stage { position: relative; overflow: hidden; background: var(--paper); min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#cv.grabbing { cursor: grabbing; }
#cv:focus, #cv:focus-visible { outline: none; }
#zoom { position: absolute; right: 14px; bottom: 14px; z-index: 3; display: flex; flex-direction: column; align-items: stretch; width: 46px; border: 1.5px solid var(--ink); background: var(--paper); transition: right .28s cubic-bezier(.3, .7, .1, 1); }
#zoom button { height: 38px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--rule); }
#zoom button:last-child { border-bottom: 0; font-weight: 700; font-stretch: 87.5%; font-size: 12px; }
#zoom button:hover { background: var(--paper-2); }
#zoom svg { width: 14px; height: 14px; }
#zl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 0; border-bottom: 1px solid var(--rule); font-family: var(--f-mono); font-stretch: 75%; line-height: 1; }
#zl b { font-size: 11px; font-weight: 600; }
#zl span { font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
#app.insp-open:not(.phone) #zoom { right: calc(var(--insp-w) + 16px); }

/* ── Tile set (canvas, key, inspector, card) ───────────────────────────── */
.tset text { fill: var(--tf, var(--ink)); }
.tile { --tb: var(--paper); --tf: var(--ink); --gc: var(--ink); --gk: var(--tb); outline: none; cursor: pointer; }
.tile[data-st="live"] { --tb: var(--tn-live); --gc: var(--st-live); }
.tile[data-st="ready"] { --tb: var(--tn-ready); --gc: var(--st-ready); }
.tile[data-st="building"] { --tb: var(--tn-build); --gc: var(--st-build); }
.tile[data-st="planned"] { --tb: var(--tn-plan); --gc: var(--st-plan); --tf: var(--ink-2); }
.tile[data-st="blocked"] { --tb: var(--tn-block); --gc: var(--st-block); }
.tset[data-lens="dev"] .tile[data-qd="0"], .tset[data-lens="ops"] .tile[data-qo="0"], .tset[data-lens="biz"] .tile[data-qb="0"] { --tb: var(--r0); --tf: var(--ink); --gc: var(--ink); }
.tset[data-lens="dev"] .tile[data-qd="1"], .tset[data-lens="ops"] .tile[data-qo="1"], .tset[data-lens="biz"] .tile[data-qb="1"] { --tb: var(--r1); --tf: var(--ink); --gc: var(--ink); }
.tset[data-lens="dev"] .tile[data-qd="2"], .tset[data-lens="ops"] .tile[data-qo="2"], .tset[data-lens="biz"] .tile[data-qb="2"] { --tb: var(--r2); --tf: var(--ink); --gc: var(--ink); }
.tset[data-lens="dev"] .tile[data-qd="3"], .tset[data-lens="ops"] .tile[data-qo="3"], .tset[data-lens="biz"] .tile[data-qb="3"] { --tb: var(--r3); --tf: var(--paper); --gc: var(--paper); }
.tset[data-lens="dev"] .tile[data-qd="4"], .tset[data-lens="ops"] .tile[data-qo="4"], .tset[data-lens="biz"] .tile[data-qb="4"] { --tb: var(--r4); --tf: var(--paper); --gc: var(--paper); }
.tile .bg { fill: var(--tb); transition: fill .45s ease; }
.tile .hatch { pointer-events: none; }
.tile .fr { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.tile .fr2 { fill: none; stroke: var(--ink); stroke-width: 0.7; }
.tile .fr-h { fill: none; stroke: var(--ink-4); stroke-width: 0.7; }
.tile .fr-brk { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: square; }
.tile .fr-dash { stroke-width: 1.3; stroke-dasharray: 5 3.5; stroke: var(--ink-3); }
.tile .fr-heavy { stroke: var(--signal); stroke-width: 3; }
.tile .att { fill: none; stroke: var(--signal); stroke-width: 3.2; }
.tile .nchip { fill: var(--signal); }
.tile[data-att="1"] .tx-num { fill: var(--on-signal); font-weight: 700; }
.tile .ring { fill: none; stroke: var(--ink); stroke-width: 2.4; display: none; }
.tile .selr { fill: none; stroke: var(--ink); stroke-width: 3.4; display: none; }
.tile .glw { color: var(--gc); transition: transform .3s ease; }
.tile .fold { display: none; }
.fold-cut { fill: var(--paper); }
.fold-flap { fill: var(--ink); }
.tile[data-chg="1"] .fold-flap { fill: var(--signal); }
.tset.trust .tile[data-trust="1"] .fold, .ktile .fold { display: inline; }
.tset.trust .tile[data-trust="1"] .glw, .ktile[data-trust="1"] .glw { transform: translateX(-12px); }
.tx-num { font-family: var(--f-mono); font-stretch: 75%; font-weight: 500; font-size: 13px; }
.tx-sym0 { font-weight: 800; font-stretch: 112.5%; font-size: 42px; letter-spacing: -0.01em; }
.tx-sym1 { font-weight: 800; font-stretch: 112.5%; font-size: 29px; letter-spacing: -0.01em; }
.tx-name { font-weight: 600; font-stretch: 75%; font-size: 13px; }
.tile .trk { fill: var(--tf); opacity: .13; }
.tile .bf { fill: var(--tf); }
.pip-f { fill: var(--tf); }
.pip-o { fill: none; stroke: var(--tf); stroke-width: 1.3; }
.pip-n { fill: none; stroke: var(--tf); stroke-width: 1; stroke-dasharray: 2 2; opacity: .5; }
.pip-b { fill: var(--signal); }
.pip-x { stroke: var(--on-signal); stroke-width: 1.6; }
.pl { font-weight: 800; font-stretch: 87.5%; font-size: 9.5px; text-anchor: middle; }
.tset text.pl-on { fill: var(--tb); }
.tset text.pl-b { fill: var(--on-signal); }
.tset text.pl-h { paint-order: stroke; stroke: var(--tb); stroke-width: 2.4px; }
.tset text.pl-n { opacity: .5; }
.tx-dst { font-weight: 700; font-stretch: 87.5%; font-size: 7px; letter-spacing: .06em; text-transform: uppercase; }
.tx-dsym { font-weight: 800; font-stretch: 112.5%; font-size: 19px; }
.tx-dmeta { font-family: var(--f-mono); font-stretch: 75%; font-size: 6.6px; font-weight: 500; }
.tx-dname { font-weight: 700; font-stretch: 75%; font-size: 9.6px; }
.tx-down { font-weight: 500; font-stretch: 75%; font-size: 6.4px; }
.tx-ddim { font-weight: 800; font-stretch: 100%; font-size: 6.6px; }
.tx-dlab { font-weight: 500; font-stretch: 75%; font-size: 5.3px; }
.det .dpip-f { fill: var(--tf); }
.det .dpip-o { fill: none; stroke: var(--tf); stroke-width: .8; }
.det .dpip-b { fill: var(--signal); }
.det .dpip-n { fill: none; stroke: var(--tf); stroke-width: .6; stroke-dasharray: 1.2 1.2; opacity: .55; }
.det .drow { transition: opacity .3s; }
.tset[data-lens="dev"] .det .drow:not(.dr-dev), .tset[data-lens="ops"] .det .drow:not(.dr-ops), .tset[data-lens="biz"] .det .drow:not(.dr-biz) { opacity: .3; }

/* lens switching inside tiles */
.tset .pips { display: none; }
.tset[data-lens="dev"] .pips.p-dev, .tset[data-lens="ops"] .pips.p-ops, .tset[data-lens="biz"] .pips.p-biz { display: inline; }
.tset:not([data-lens="overall"]) .bars { display: none; }

/* semantic zoom: lod 0 table, 1 tile, 2 detail */
.tset .tx-sym1, .tset .tx-name, .tset .det, .tset .pl { display: none; }
.tset[data-lod="1"] .tx-sym0 { display: none; }
.tset[data-lod="1"] .tx-sym1, .tset[data-lod="1"] .tx-name, .tset[data-lod="1"] .pl { display: inline; }
.tset[data-lod="2"] .l01 { display: none; }
.tset[data-lod="2"] .det { display: inline; }
.tset .ktile.ktile .tx-sym0 { display: none; }
.tset .ktile.ktile .tx-sym1, .tset .ktile.ktile .tx-name, .tset .ktile.ktile .pl, .tset .ktile.ktile .l01 { display: inline; }
.tset .ktile.ktile .det { display: none; }
.tset[data-z="0"] .z1, .tset[data-z="0"] .z2, .tset[data-z="0"] .z3, .tset[data-z="1"] .z2, .tset[data-z="1"] .z3, .tset[data-z="2"] .z3 { display: none; }

/* tile states driven by filters, selection, overlays */
#cv .tile { transition: transform .7s cubic-bezier(.3, .7, .1, 1), opacity .25s ease; }
#cv.notr .tile { transition: none; }
#cv .tile.dim { opacity: .14; }
#cv.trust .tile:not([data-trust="1"]) { opacity: .3; }
#cv.trust .tile.dim:not([data-trust="1"]) { opacity: .1; }
#cv.selecting .tile.far { opacity: .2; }
#cv .tile.hit .ring { display: inline; }
#cv .tile.cur .selr { display: inline; }
#cv .tile.cur .att { display: none; }
#cv .tile.sel .selr { display: inline; }
#cv .tile.sel .att { display: none; }
#cv .tile:focus-visible .selr { display: inline; stroke-dasharray: 6 4; }
#cv .tile:hover .fr { stroke-width: 2.4; }

/* ── Heads (world-space chrome) ───────────────────────────────────────── */
.heads { transition: opacity .4s ease, visibility 0s linear 0s; }
.heads.off { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s ease, visibility 0s linear .3s; }
.h-rule { fill: var(--ink); }
.h-hair { fill: var(--rule); }
.h-band { fill: var(--band); }
.h-hit { fill: var(--clear); cursor: pointer; }
.hd:hover .h-hit { fill: var(--paper-2); }
.hd-dom:hover .h-band { opacity: .88; }
.tset text.on-band { fill: var(--on-band); }
.tset text.on-band-2 { fill: var(--on-band-2); }
.tx-code { font-weight: 800; font-stretch: 112.5%; font-size: 18px; letter-spacing: .01em; }
.tx-hname { font-weight: 600; font-stretch: 75%; font-size: 15px; }
.tx-pct { font-weight: 750; font-stretch: 112.5%; font-size: 27px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tx-pcts { font-size: 15px; font-weight: 600; }
.tx-bcode { font-weight: 800; font-stretch: 112.5%; font-size: 17px; letter-spacing: .02em; }
.tx-bname { font-weight: 600; font-stretch: 75%; font-size: 15px; }
.tx-bpct { font-family: var(--f-mono); font-stretch: 75%; font-weight: 600; font-size: 14px; }
.tx-ft { font-family: var(--f-mono); font-stretch: 75%; font-weight: 600; font-size: 11.5px; text-anchor: middle; }
.tset text.tx-ft0 { fill: var(--ink-4); }
.ft-c { stroke: var(--ink); stroke-width: .8; }
.ft-live { fill: var(--tn-live); } .ft-ready { fill: var(--tn-ready); } .ft-building { fill: var(--tn-build); }
.ft-planned { fill: var(--tn-plan); stroke-dasharray: 2.5 2; } .ft-blocked { fill: var(--tn-block); stroke: var(--signal); stroke-width: 1.4; }
.ft-zero { fill: none; stroke: var(--rule); }
.tset .ftv { display: none; }
.tset[data-lens="overall"] .ftv-overall, .tset[data-lens="dev"] .ftv-dev, .tset[data-lens="ops"] .ftv-ops, .tset[data-lens="biz"] .ftv-biz { display: inline; }
.tx-big { font-weight: 800; font-stretch: 112.5%; font-size: 30px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tx-lab { font-weight: 800; font-stretch: 112.5%; font-size: 21px; }
.tx-sub { font-weight: 500; font-stretch: 75%; font-size: 14px; }
.tset text.c3 { fill: var(--ink-3); }
.tset text.c2 { fill: var(--ink-2); }
.tx-mono { font-family: var(--f-mono); font-stretch: 75%; font-weight: 500; font-size: 12.5px; }
.tx-caps { font-weight: 700; font-stretch: 87.5%; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; }
.today { stroke: var(--ink); stroke-width: 2.4; stroke-dasharray: 9 6; fill: none; }
.next-wash { fill: var(--paper-2); }
.badge { fill: var(--signal); }
.tset text.on-signal { fill: var(--on-signal); }
.gk { color: var(--ink); }
.g-live { color: var(--st-live); } .g-ready { color: var(--st-ready); } .g-building { color: var(--st-build); } .g-planned { color: var(--st-plan); } .g-blocked { color: var(--st-block); }
.on-band-g { color: var(--on-band); }

/* key ("How to read a tile") */

<script src="../../shared/blueprint-model.js"></script>
<script>
(function () {
  'use strict';

  // ════════════════════════════════════════════════════════════════════════
  // STATE
  // ════════════════════════════════════════════════════════════════════════
  const BP = window.BP;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  const phoneMQ = window.matchMedia('(max-width: 760px)');

  const S = {
    lens: 'overall', arr: 'table', statuses: new Set(), query: '', trust: false, attn: false,
    sel: null, mod: null, legend: false, portrait: false, phone: phoneMQ.matches,
    hits: [], hitIdx: -1, theme: 'system',
  };
  const cam = { k: 0.5, x: 0, y: 0 };

  // tile grid (world units)
  const TW = 96, TH = 112, GAP = 8, PX = TW + GAP, PY = TH + GAP, M = 36;
  const DIMS = BP.DIMENSIONS;
  const DIM_IDS = DIMS.map((d) => d.id);
  const LENS_NAME = { overall: 'Overall', dev: 'Development', ops: 'Operations', biz: 'Business' };
  const ST_LABEL = {};
  const ST_DESC = {};
  BP.STATUSES.forEach((s) => { ST_LABEL[s.id] = s.label; ST_DESC[s.id] = s.description; });
  const SORDER = BP.STATUS_ORDER;
  const FACET_SHORT = { spec: 'Spec', backend: 'Back', frontend: 'Front', tests: 'Tests', deploy: 'Deploy', observe: 'Observ', secure: 'Secur', runbook: 'Runbk', value: 'Value', docs: 'Docs', package: 'Pack', adoption: 'Adopt' };
  const PIP_LETTER = { dev: ['S', 'B', 'F', 'T'], ops: ['D', 'O', 'S', 'R'], biz: ['V', 'D', 'P', 'A'] };
  const STATE_LABEL = { done: 'Done', partial: 'Partial', todo: 'To do', blocked: 'Blocked', na: 'n/a' };
  const BUILT = { agent: 'AI agent crew', pair: 'Agent + human pair', human: 'Human squad' };
  const REVIEW = { approved: 'Approved', pending: 'Awaiting review', changes: 'Changes requested', none: 'Not reviewed' };
  const AS_OF = BP.data.meta.asOf;

  // display order: domain > module > status order (the "atomic number")
  const byMod = new Map();
  BP.modules.forEach((m) => {
    const list = BP.featuresOf(m.id).map((f, i) => [f, i]);
    list.sort((a, b) => SORDER.indexOf(a[0].status) - SORDER.indexOf(b[0].status) || a[1] - b[1]);
    byMod.set(m.id, list.map((x) => x[0]));
  });
  const ORDER = [];
  BP.domains.forEach((d) => BP.modulesOf(d.id).forEach((m) => byMod.get(m.id).forEach((f) => ORDER.push(f))));
  const NUM = new Map(ORDER.map((f, i) => [f.id, i + 1]));
  const SYM = makeSymbols(ORDER);
  const modOf = (f) => BP.module(f.moduleId);
  const domOf = (f) => BP.domain(modOf(f).domainId);
  const isTrust = (f) => (f.builtBy === 'agent' || f.builtBy === 'pair') && (f.review === 'pending' || f.review === 'changes');
  const TRUST_COUNT = ORDER.filter(isTrust).length;
  const q5 = (v) => (v == null ? 0 : Math.min(4, Math.floor(v * 5 + 1e-9)));
  const pct = (v) => Math.round((v || 0) * 100);
  const lensOf = (r, lens) => (lens === 'overall' ? r.overall : r.dims[lens]);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return d + ' ' + MONTHS[m - 1] + ' ' + y; };
  const daysAgo = (iso) => Math.round((Date.parse(AS_OF) - Date.parse(iso)) / 864e5);

  /** Two-letter, element-style symbols, unique across the table (capital + lower case). */
  function makeSymbols(list) {
    const STOP = new Set(['and', 'of', 'the', 'for', 'to', 'a', 'an', 'in', 'on', 'with', 'by']);
    const cons = (c) => /[bcdfghjklmnpqrstvwxz]/.test(c);
    const used = new Set();
    const out = new Map();
    list.forEach((f) => {
      const words = f.name.replace(/\(.*?\)/g, ' ').split(/[\s\-/,]+/).map((w) => w.replace(/[^A-Za-z]/g, '')).filter(Boolean);
      const sig = words.filter((w, i) => i === 0 || !STOP.has(w.toLowerCase()));
      const c = [];
      const add = (a, b) => { const s = a.toUpperCase() + b.toLowerCase(); if (c.indexOf(s) < 0) c.push(s); };
      const w1 = sig[0];
      if (sig[1]) add(w1[0], sig[1][0]);
      for (const ch of w1.slice(1).toLowerCase()) if (cons(ch) && ch !== w1[0].toLowerCase()) add(w1[0], ch);
      for (let k = 2; k < sig.length; k++) add(w1[0], sig[k][0]);
      for (let k = 1; k < sig.length; k++) for (const ch of sig[k].slice(1)) if (cons(ch)) add(w1[0], ch);
      for (let k = 1; k < sig.length; k++) {
        for (let j = k + 1; j < sig.length; j++) add(sig[k][0], sig[j][0]);
        for (const ch of sig[k].slice(1)) if (cons(ch)) add(sig[k][0], ch);
      }
      for (const ch of w1.slice(1)) add(w1[0], ch);
      'abcdefghijklmnopqrstuvwxyz'.split('').forEach((ch) => add(w1[0], ch));
      const pick = c.find((s) => !used.has(s)) || w1.slice(0, 2);
      used.add(pick);
      out.set(f.id, pick);
    });
    return out;
  }

  // text measurement (canvas metrics match SVG text with the same font)
  const mctx = document.createElement('canvas').getContext('2d');
  const GROT = "'Archivo', 'Archivo Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif";
  function meas(text, size, weight, stretch) {
    mctx.font = weight + ' ' + size + 'px ' + GROT;
    if ('fontStretch' in mctx) mctx.fontStretch = stretch || 'normal';
    return mctx.measureText(text).width;
  }
  /** Splits a label into at most two balanced lines that fit maxW (squeezed slightly if a word is too long). */
  function wrap2(text, size, weight, stretch, maxW) {
    const m = (t) => meas(t, size, weight, stretch);
    if (m(text) <= maxW) return [text];
    const words = text.split(' ');
    let best = null;
    for (let i = 1; i < words.length; i++) {
      const a = words.slice(0, i).join(' ');
      const b = words.slice(i).join(' ');
      const w = Math.max(m(a), m(b));
      if (!best || w < best.w - 0.5) best = { lines: [a, b], w };
    }
    if (!best) {
      const hy = text.indexOf('-');
      if (hy > 0) return [text.slice(0, hy + 1), text.slice(hy + 1)];
      return [text];
    }
    return best.lines;
  }
  /** SVG <text> with one tspan per line; lines wider than maxW get textLength so they never spill. */
  function textLines(lines, x, y, lead, cls, size, weight, stretch, maxW, extra) {
    let s = '<text class="' + cls + '" x="' + x + '" y="' + y + '"' + (extra || '') + '>';
    lines.forEach((ln, i) => {
      const w = meas(ln, size, weight, stretch);
      const fit = w > maxW ? ' textLength="' + maxW.toFixed(1) + '" lengthAdjust="spacingAndGlyphs"' : '';
      s += '<tspan x="' + x + '"' + (i ? ' dy="' + lead + '"' : '') + fit + '>' + esc(ln) + '</tspan>';
    });
    return s + '</text>';
  }
  function fitText(str, x, y, cls, size, weight, stretch, maxW, extra) {
    const w = meas(str, size, weight, stretch);
    const fit = w > maxW ? ' textLength="' + maxW.toFixed(1) + '" lengthAdjust="spacingAndGlyphs"' : '';
    return '<text class="' + cls + '" x="' + x + '" y="' + y + '"' + fit + (extra || '') + '>' + esc(str) + '</text>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // RENDER: shared marks (glyphs, pips, tiles)
  // ════════════════════════════════════════════════════════════════════════
  function pie(r, p) {
    const a = p * 2 * Math.PI;
    return 'M0 0V' + (-r) + 'A' + r + ' ' + r + ' 0 ' + (p > 0.5 ? 1 : 0) + ' 1 ' + (r * Math.sin(a)).toFixed(2) + ' ' + (-r * Math.cos(a)).toFixed(2) + 'Z';
  }
  /** Status glyph centred on 0,0: filled disc, three-quarter, half, dashed ring, slashed square. */
  function glyph(st, r) {
    const sw = Math.max(1, r * 0.24).toFixed(2);
    const ring = '<circle r="' + (r - sw / 2).toFixed(2) + '" style="fill:none;stroke:currentColor;stroke-width:' + sw + '"/>';
    if (st === 'live') return '<circle r="' + r + '" style="fill:currentColor"/>';
    if (st === 'ready') return ring + '<path d="' + pie(r, 0.75) + '" style="fill:currentColor"/>';
    if (st === 'building') return ring + '<path d="' + pie(r, 0.5) + '" style="fill:currentColor"/>';
    if (st === 'planned') return '<circle r="' + (r - sw / 2).toFixed(2) + '" style="fill:none;stroke:currentColor;stroke-width:' + sw + ';stroke-dasharray:' + (r * 0.62).toFixed(2) + ' ' + (r * 0.46).toFixed(2) + '"/>';
    const b = (r * 0.92).toFixed(2);
    return '<rect x="' + (-b) + '" y="' + (-b) + '" width="' + 2 * b + '" height="' + 2 * b + '" style="fill:currentColor"/><path d="M' + (-r * 0.5) + ' ' + r * 0.5 + 'L' + r * 0.5 + ' ' + (-r * 0.5) + '" style="stroke:var(--gk, var(--paper));stroke-width:' + (r * 0.34).toFixed(2) + '"/>';
  }
  function glyphHTML(st, cls) {
    return '<svg class="g g-' + st + (cls ? ' ' + cls : '') + '" viewBox="-8 -8 16 16" aria-hidden="true">' + glyph(st, 7) + '</svg>';
  }
  function foldIcon() {
    return '<svg class="fi" viewBox="0 0 16 18" aria-hidden="true"><path d="M1 1H10L15 6V17H1Z" style="fill:none;stroke:currentColor;stroke-width:1.5"/><path d="M10 1V6H15Z" style="fill:currentColor"/></svg>';
  }

  /** Frame shape encodes status: solid, double, corner brackets, dashed, heavy signal. */
  function frame(st) {
    const w = TW, h = TH;
    if (st === 'live') return '<rect class="fr" x=".7" y=".7" width="' + (w - 1.4) + '" height="' + (h - 1.4) + '"/>';
    if (st === 'ready') return '<rect class="fr" x=".7" y=".7" width="' + (w - 1.4) + '" height="' + (h - 1.4) + '"/><rect class="fr2" x="3.8" y="3.8" width="' + (w - 7.6) + '" height="' + (h - 7.6) + '"/>';
    if (st === 'building') {
      const L = 17, a = 1.2, r = w - 1.2, b = h - 1.2;
      return '<rect class="fr-h" x=".5" y=".5" width="' + (w - 1) + '" height="' + (h - 1) + '"/>' +
        '<path class="fr-brk" d="M' + a + ' ' + (a + L) + 'V' + a + 'H' + (a + L) + 'M' + (r - L) + ' ' + a + 'H' + r + 'V' + (a + L) +
        'M' + r + ' ' + (b - L) + 'V' + b + 'H' + (r - L) + 'M' + (a + L) + ' ' + b + 'H' + a + 'V' + (b - L) + '"/>';
    }
    if (st === 'planned') return '<rect class="fr fr-dash" x=".7" y=".7" width="' + (w - 1.4) + '" height="' + (h - 1.4) + '"/>';
    return '<rect class="fr fr-heavy" x="1.5" y="1.5" width="' + (w - 3) + '" height="' + (h - 3) + '"/>';
  }

  /** One facet pip for the lens views (letters appear from the tile zoom level). */
  function pip(state, x, y, w, h, letter) {
    let s = '';
    let lc = '';
    if (state === 'done') { s = '<rect class="pip-f" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>'; lc = ' pl-on'; }
    else if (state === 'partial') { s = '<rect class="pip-o" x="' + (x + 0.65) + '" y="' + (y + 0.65) + '" width="' + (w - 1.3) + '" height="' + (h - 1.3) + '"/><rect class="pip-f" x="' + x + '" y="' + (y + h / 2) + '" width="' + w + '" height="' + h / 2 + '"/>'; lc = ' pl-h'; }
    else if (state === 'todo') s = '<rect class="pip-o" x="' + (x + 0.65) + '" y="' + (y + 0.65) + '" width="' + (w - 1.3) + '" height="' + (h - 1.3) + '"/>';
    else if (state === 'blocked') { s = '<rect class="pip-b" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>'; lc = ' pl-b'; }
    else { s = '<rect class="pip-n" x="' + (x + 0.5) + '" y="' + (y + 0.5) + '" width="' + (w - 1) + '" height="' + (h - 1) + '"/>'; lc = ' pl-n'; }
    return s + '<text class="pl' + lc + '" x="' + (x + w / 2) + '" y="' + (y + h / 2 + 3.4) + '">' + letter + '</text>';
  }
  function dpip(state, x, y, sz) {
    if (state === 'done') return '<rect class="dpip-f" x="' + x + '" y="' + y + '" width="' + sz + '" height="' + sz + '"/>';
    if (state === 'partial') return '<rect class="dpip-o" x="' + (x + 0.4) + '" y="' + (y + 0.4) + '" width="' + (sz - 0.8) + '" height="' + (sz - 0.8) + '"/><rect class="dpip-f" x="' + x + '" y="' + (y + sz / 2) + '" width="' + sz + '" height="' + sz / 2 + '"/>';
    if (state === 'todo') return '<rect class="dpip-o" x="' + (x + 0.4) + '" y="' + (y + 0.4) + '" width="' + (sz - 0.8) + '" height="' + (sz - 0.8) + '"/>';
    if (state === 'blocked') return '<rect class="dpip-b" x="' + x + '" y="' + y + '" width="' + sz + '" height="' + sz + '"/>';
    return '<rect class="dpip-n" x="' + (x + 0.3) + '" y="' + (y + 0.3) + '" width="' + (sz - 0.6) + '" height="' + (sz - 0.6) + '"/>';
  }

  /** Full element tile. opt.key renders a static copy (key, inspector, card) without id or focus. */
  function tileSVG(f, opt) {
    const o = opt || {};
    const n = NUM.get(f.id);
    const sym = SYM.get(f.id);
    const st = f.status;
    const sc = { dev: BP.dimScore(f, 'dev'), ops: BP.dimScore(f, 'ops'), biz: BP.dimScore(f, 'biz') };
    const att = BP.needsAttention(f);
    const tr = isTrust(f);
    let a = ' data-id="' + f.id + '" data-st="' + st + '" data-qd="' + q5(sc.dev) + '" data-qo="' + q5(sc.ops) + '" data-qb="' + q5(sc.biz) + '"';
    if (att) a += ' data-att="1"';
    if (tr) a += ' data-trust="1"';
    if (f.review === 'changes') a += ' data-chg="1"';
    let s;
    if (o.key) s = '<g class="tile ktile"' + a + ' transform="translate(' + (o.x || 0) + ',' + (o.y || 0) + ') scale(' + (o.s || 1) + ')">';
    else s = '<g class="tile" id="t' + n + '"' + a + ' tabindex="0" role="button" aria-label="' + esc(n + ' ' + sym + ', ' + f.name + ', ' + ST_LABEL[st] + (att ? ', needs attention' : '')) + '">';
    s += '<rect class="bg" width="' + TW + '" height="' + TH + '"/>';
    if (st === 'blocked') s += '<rect class="hatch" width="' + TW + '" height="' + TH + '" fill="url(#hatch)"/>';
    s += frame(st);
    if (att) s += '<rect class="att" x="-3.1" y="-3.1" width="' + (TW + 6.2) + '" height="' + (TH + 6.2) + '"/>';
    s += '<rect class="ring" x="3.2" y="3.2" width="' + (TW - 6.4) + '" height="' + (TH - 6.4) + '"/>';
    s += '<rect class="selr" x="-3.4" y="-3.4" width="' + (TW + 6.8) + '" height="' + (TH + 6.8) + '"/>';
    if (att) s += '<rect class="nchip" x="3.5" y="4.5" width="' + (String(n).length * 7.9 + 6).toFixed(1) + '" height="17"/>';
    s += '<text class="tx-num z2" x="6.5" y="17.6">' + n + '</text>';
    s += '<g class="glw z1"><g transform="translate(' + (TW - 14) + ',13)">' + glyph(st, 6.2) + '</g></g>';
    // tile and table levels
    s += '<g class="l01">';
    s += fitText(sym, 6, 75, 'tx-sym0', 42, 800, 'semi-expanded', TW - 12);
    s += fitText(sym, 6, 50, 'tx-sym1', 29, 800, 'semi-expanded', TW - 12);
    s += textLines(wrap2(f.name, 13, 600, 'condensed', TW - 13), 7, 66.5, 13.8, 'tx-name', 13, 600, 'condensed', TW - 13);
    s += '<g class="bars">';
    DIM_IDS.forEach((k, i) => {
      const y = 90 + i * 6.1;
      s += '<rect class="trk" x="7" y="' + y + '" width="' + (TW - 14) + '" height="4"/><rect class="bf" x="7" y="' + y + '" width="' + ((TW - 14) * (sc[k] || 0)).toFixed(1) + '" height="4"/>';
    });
    s += '</g>';
    DIMS.forEach((dim) => {
      s += '<g class="pips p-' + dim.id + '">';
      dim.facets.forEach((fc, i) => { s += pip(f.dims[dim.id][fc.id], 7 + i * 21, 88.5, 19, 17, PIP_LETTER[dim.id][i]); });
      s += '</g>';
    });
    s += '</g>';
    // detail level
    s += detail(f, sym, sc);
    if (tr) s += '<g class="fold"><path class="fold-cut" d="M' + (TW - 17) + ' -2H' + (TW + 2) + 'V17Z"/><path class="fold-flap" d="M' + (TW - 17) + ' 0V17H' + TW + 'Z"/></g>';
    return s + '</g>';
  }

  function detail(f, sym, sc) {
    const rel = f.release ? BP.release(f.release) : null;
    const team = BP.team(f.owner);
    let s = '<g class="det">';
    s += '<text class="tx-dst" x="' + (TW - 25) + '" y="15.6" text-anchor="end">' + esc(ST_LABEL[f.status]) + '</text>';
    s += fitText(sym, 6.5, 40, 'tx-dsym', 19, 800, 'semi-expanded', 50);
    s += '<text class="tx-dmeta" x="' + (TW - 7) + '" y="31" text-anchor="end">' + f.priority + '</text>';
    s += '<text class="tx-dmeta" x="' + (TW - 7) + '" y="40" text-anchor="end">' + (rel ? rel.label : 'Unsched.') + '</text>';
    s += textLines(wrap2(f.name, 9.6, 700, 'condensed', TW - 13), 7, 51.5, 9.8, 'tx-dname', 9.6, 700, 'condensed', TW - 13);
    s += fitText(team.name + ' · ' + f.builtBy + ' · ' + REVIEW[f.review].toLowerCase(), 7, 71, 'tx-down', 6.4, 500, 'condensed', TW - 13);
    DIMS.forEach((dim, r) => {
      const y = 76 + r * 11.3;
      s += '<g class="drow dr-' + dim.id + '">';
      s += '<text class="tx-ddim" x="7" y="' + (y + 6.6) + '">' + dim.short[0] + '</text>';
      dim.facets.forEach((fc, i) => {
        const x = 14.5 + i * 19.3;
        s += dpip(f.dims[dim.id][fc.id], x, y + 1.6, 5.4);
        s += fitText(FACET_SHORT[fc.id], x + 6.8, y + 6.4, 'tx-dlab', 5.3, 500, 'condensed', 11.6);
      });
      s += '</g>';
    });
    return s + '</g>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // LAYOUT: Table, Status, Release (landscape and portrait)
  // ════════════════════════════════════════════════════════════════════════
  const MAXROWS = Math.max.apply(null, BP.modules.map((m) => byMod.get(m.id).length));
  const rollCache = new Map();
  function groupRoll(key, list) { if (!rollCache.has(key)) rollCache.set(key, BP.rollup(list)); return rollCache.get(key); }
  function rollFor(key) {
    const [kind, id] = key.split(':');
    if (kind === 'mod') return BP.moduleRollup(id);
    if (kind === 'dom') return BP.domainRollup(id);
    if (kind === 'all') return BP.productRollup();
    if (kind === 'st') return groupRoll(key, ORDER.filter((f) => f.status === id));
    if (kind === 'rel') return groupRoll(key, ORDER.filter((f) => (f.release || 'none') === id));
    return BP.productRollup();
  }
  const pv = (key, extra) => '<tspan data-pv="' + key + '"' + (extra || '') + '>' + pct(lensOf(rollFor(key), S.lens)) + '</tspan>';

  function attBadge(x, y, n) {
    const w = 10 + String(n).length * 7;
    return '<g class="z1"><rect class="badge" x="' + (x - w) + '" y="' + y + '" width="' + w + '" height="17"/><text class="tx-mono on-signal" x="' + (x - w / 2) + '" y="' + (y + 12.6) + '" text-anchor="middle" style="font-weight:700">' + n + '</text></g>';
  }

  /** Column header for a module: rule, code, name, lens %. */
  function colHead(m, x, y, w, h) {
    const r = BP.moduleRollup(m.id);
    let s = '<g class="hd hd-mod" data-mod="' + m.id + '" role="button" aria-label="' + esc(m.name + ' module') + '">';
    s += '<rect class="h-hit" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>';
    s += '<rect class="h-rule" x="' + x + '" y="' + y + '" width="' + w + '" height="2.5"/>';
    s += fitText(m.code, x, y + 23, 'tx-code z1', 18, 800, 'semi-expanded', w - (r.attention ? 26 : 0));
    if (r.attention) s += attBadge(x + w, y + 8, r.attention);
    s += textLines(wrap2(m.name, 15, 600, 'condensed', w), x, y + 42, 15, 'tx-hname z2', 15, 600, 'condensed', w);
    s += '<text class="tx-pct" x="' + x + '" y="' + (y + h - 4) + '">' + pv('mod:' + m.id) + '<tspan class="tx-pcts">%</tspan></text>';
    return s + '</g>';
  }
  /** Footer cell: counts per status (Overall) or per facet state (lens views). */
  function colFoot(m, x, y, w) {
    const list = byMod.get(m.id);
    let s = '<g class="ftv ftv-overall z1">';
    const cw = w / 5;
    SORDER.forEach((st, i) => {
      const n = list.filter((f) => f.status === st).length;
      const cx = x + i * cw;
      s += '<rect class="ft-c ' + (n ? 'ft-' + st : 'ft-zero') + '" x="' + (cx + 0.8).toFixed(1) + '" y="' + y + '" width="' + (cw - 1.6).toFixed(1) + '" height="20"/>';
      s += '<text class="tx-ft z2' + (n ? '' : ' tx-ft0') + '" x="' + (cx + cw / 2).toFixed(1) + '" y="' + (y + 14.2) + '">' + (n || '·') + '</text>';
    });
    s += '</g>';
    DIM_IDS.forEach((d) => {
      const c = BP.facetCounts(list, d);
      const cw4 = w / 4;
      s += '<g class="ftv ftv-' + d + ' z1">';
      ['done', 'partial', 'todo', 'blocked'].forEach((k, i) => {
        const cx = x + i * cw4;
        s += dpipCell(k, cx + 0.8, y, cw4 - 1.6, 20);
        const dark = k === 'done';
        s += '<text class="tx-ft z2' + (c[k] ? '' : ' tx-ft0') + '" x="' + (cx + cw4 / 2).toFixed(1) + '" y="' + (y + 14.2) + '"' + (dark ? ' style="fill:var(--paper)"' : k === 'blocked' && c[k] ? ' style="fill:var(--on-signal)"' : '') + '>' + (c[k] || '·') + '</text>';
      });
      s += '</g>';
    });
    return s;
  }
  function dpipCell(k, x, y, w, h) {
    const a = 'x="' + x.toFixed(1) + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + h + '"';
    if (k === 'done') return '<rect ' + a + ' style="fill:var(--ink)"/>';
    if (k === 'partial') return '<rect ' + a + ' style="fill:var(--paper);stroke:var(--ink);stroke-width:.8"/><rect x="' + x.toFixed(1) + '" y="' + (y + h / 2) + '" width="' + w.toFixed(1) + '" height="' + h / 2 + '" style="fill:var(--ink-4)"/>';
    if (k === 'todo') return '<rect ' + a + ' style="fill:var(--paper);stroke:var(--ink);stroke-width:.8"/>';
    return '<rect ' + a + ' style="fill:var(--signal)"/>';
  }
  /** Black domain band spanning its module columns. */
  function domBand(d, x, y, w, h) {
    const r = BP.domainRollup(d.id);
    let s = '<g class="hd hd-dom" data-dom="' + d.id + '" role="button" aria-label="' + esc(d.name + ' domain') + '">';
    s += '<rect class="h-band" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>';
    s += '<text class="tx-bcode on-band z1" x="' + (x + 9) + '" y="' + (y + 22) + '">' + d.code + '</text>';
    s += '<text class="tx-bpct on-band z1" x="' + (x + w - 9) + '" y="' + (y + 21) + '" text-anchor="end"><tspan class="on-band-2">' + r.count + ' ·</tspan> ' + pv('dom:' + d.id) + '%</text>';
    s += fitText(d.name, x + 9, y + 42, 'tx-bname on-band z2', 15, 600, 'condensed', w - 18);
    return s + '</g>';
  }

  function layTable(P) {
    const pos = new Map();
    let s = '';
    if (!P) {
      const bandY = M, bandH = 52, hdrY = bandY + bandH + 8, hdrH = 94, tilesY = hdrY + hdrH + 10;
      const footY = tilesY + MAXROWS * PY + 4;
      const DG = 26;
      let x = M;
      BP.domains.forEach((d) => {
        const x0 = x;
        BP.modulesOf(d.id).forEach((m) => {
          byMod.get(m.id).forEach((f, i) => pos.set(f.id, [x, tilesY + i * PY]));
          s += colHead(m, x, hdrY, TW, hdrH) + colFoot(m, x, footY, TW);
          x += PX;
        });
        s += domBand(d, x0, bandY, x - GAP - x0, bandH);
        x += DG;
      });
      const right = x - DG - GAP;
      const keyY = footY + 20 + 46;
      const key = keyFlow('table', M, keyY, right - M);
      s += key.svg;
      return { pos, svg: s, w: right + M, h: keyY + key.h + M };
    }
    // portrait: modules become rows, tiles run left to right
    const HW = 236;
    const W = HW + 14 + MAXROWS * PX - GAP;
    let y = M;
    BP.domains.forEach((d) => {
      const r = BP.domainRollup(d.id);
      s += '<g class="hd hd-dom" data-dom="' + d.id + '"><rect class="h-band" x="' + M + '" y="' + y + '" width="' + W + '" height="58"/>';
      s += '<text class="tx-bcode on-band" x="' + (M + 12) + '" y="' + (y + 40) + '" style="font-size:30px">' + d.code + '</text>';
      s += fitText(d.name, M + 100, y + 38, 'tx-bname on-band z1', 24, 600, 'condensed', W - 280, ' style="font-size:24px"');
      s += '<text class="tx-bpct on-band" x="' + (M + W - 12) + '" y="' + (y + 39) + '" text-anchor="end" style="font-size:24px"><tspan class="on-band-2">' + r.count + ' ·</tspan> ' + pv('dom:' + d.id) + '%</text></g>';
      y += 70;
      BP.modulesOf(d.id).forEach((m) => {
        const mr = BP.moduleRollup(m.id);
        s += '<g class="hd hd-mod" data-mod="' + m.id + '" role="button" aria-label="' + esc(m.name + ' module') + '">';
        s += '<rect class="h-hit" x="' + M + '" y="' + y + '" width="' + HW + '" height="' + TH + '"/><rect class="h-rule" x="' + M + '" y="' + y + '" width="' + HW + '" height="3"/>';
        s += '<text class="tx-code" x="' + M + '" y="' + (y + 36) + '" style="font-size:30px">' + m.code + '</text>';
        s += '<text class="tx-pct" x="' + (M + HW - 4) + '" y="' + (y + 36) + '" text-anchor="end" style="font-size:30px">' + pv('mod:' + m.id) + '<tspan class="tx-pcts">%</tspan></text>';
        s += textLines(wrap2(m.name, 19, 600, 'condensed', HW - 10), M, y + 64, 20, 'tx-hname z2', 19, 600, 'condensed', HW - 10, ' style="font-size:19px"');
        if (mr.attention) s += attBadge(M + HW - 4, y + 88, mr.attention);
        s += '</g>';
        byMod.get(m.id).forEach((f, i) => pos.set(f.id, [M + HW + 14 + i * PX, y]));
        y += PY;
      });
      y += 22;
    });
    return { pos, svg: s, w: W + 2 * M, h: y - 22 - GAP + M };
  }

  function stHead(st, x, y, w, h) {
    const n = ORDER.filter((f) => f.status === st).length;
    let s = '<g class="hd hd-st" data-st="' + st + '" role="button" aria-label="' + esc('Filter ' + ST_LABEL[st]) + '">';
    s += '<rect class="h-hit" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>';
    s += '<rect class="h-rule" x="' + x + '" y="' + y + '" width="' + w + '" height="2.5"/>';
    s += '<g class="g-' + st + '" transform="translate(' + (x + 11) + ',' + (y + 27) + ')">' + glyph(st, 10.5) + '</g>';
    s += fitText(ST_LABEL[st], x + 30, y + 35, 'tx-lab', 22, 800, 'semi-expanded', w - 80);
    s += '<text class="tx-big" x="' + (x + w) + '" y="' + (y + 38) + '" text-anchor="end">' + n + '</text>';
    s += fitText(ST_DESC[st], x, y + 58, 'tx-sub c3 z2', 14, 500, 'condensed', w);
    s += '<text class="tx-pct" x="' + x + '" y="' + (y + h - 4) + '">' + pv('st:' + st) + '<tspan class="tx-pcts">%</tspan><tspan class="tx-mono c3 lens-word" dx="8" style="font-size:13px">' + LENS_NAME[S.lens].toLowerCase() + '</tspan></text>';
    return s + '</g>';
  }

  function layStatus(P) {
    const pos = new Map();
    let s = '';
    const total = ORDER.length;
    if (!P) {
      const K = {};
      SORDER.forEach((st) => {
        const per = BP.domains.map((d) => ORDER.filter((f) => f.status === st && domOf(f).id === d.id).length);
        K[st] = Math.max(2, Math.ceil(Math.max.apply(null, per) / 2));
      });
      const RH = 228, SG = 30, DGv = 26, hdrY = M, hdrH = 96, top = hdrY + hdrH + 16;
      const colX = {};
      let x = M + RH + 18;
      SORDER.forEach((st) => { colX[st] = x; x += K[st] * PX - GAP + SG; });
      const right = x - SG;
      SORDER.forEach((st) => { s += stHead(st, colX[st], hdrY, K[st] * PX - GAP, hdrH); });
      let y = top;
      BP.domains.forEach((d, di) => {
        const fs = ORDER.filter((f) => domOf(f).id === d.id);
        let rows = 1;
        SORDER.forEach((st) => { rows = Math.max(rows, Math.ceil(fs.filter((f) => f.status === st).length / K[st])); });
        const h = rows * PY - GAP;
        if (di) s += '<rect class="h-hair" x="' + M + '" y="' + (y - DGv / 2 - 0.5) + '" width="' + (right - M) + '" height="1"/>';
        const r = BP.domainRollup(d.id);
        s += '<g class="hd hd-dom" data-dom="' + d.id + '"><rect class="h-band" x="' + M + '" y="' + y + '" width="' + RH + '" height="' + h + '"/>';
        s += '<text class="tx-bcode on-band" x="' + (M + 12) + '" y="' + (y + 38) + '" style="font-size:30px">' + d.code + '</text>';
        s += textLines(h > 140 ? wrap2(d.name, 19, 600, 'condensed', RH - 24) : [d.name], M + 12, y + 64, 20, 'tx-bname on-band z1', 19, 600, 'condensed', RH - 24, ' style="font-size:19px"');
        s += '<text class="tx-bpct on-band z2" x="' + (M + 12) + '" y="' + (y + h - 12) + '" style="font-size:15px">' + r.count + ' features</text>';
        s += '<text class="tx-pct on-band" x="' + (M + RH - 12) + '" y="' + (y + h - 10) + '" text-anchor="end" style="font-size:28px">' + pv('dom:' + d.id) + '<tspan class="tx-pcts">%</tspan></text></g>';
        SORDER.forEach((st) => {
          fs.filter((f) => f.status === st).forEach((f, i) => pos.set(f.id, [colX[st] + (i % K[st]) * PX, y + Math.floor(i / K[st]) * PY]));
        });
        y += h + DGv;
      });
      const footY = y - DGv + 18;
      s += '<rect class="h-rule" x="' + M + '" y="' + footY + '" width="' + (right - M) + '" height="2.5"/>';
      s += '<text class="tx-caps z1" x="' + M + '" y="' + (footY + 30) + '">Share of ' + total + ' features</text>';
      SORDER.forEach((st) => {
        const n = ORDER.filter((f) => f.status === st).length;
        const w = K[st] * PX - GAP;
        s += '<rect class="h-hair" x="' + colX[st] + '" y="' + (footY + 16) + '" width="' + w + '" height="10"/><rect x="' + colX[st] + '" y="' + (footY + 16) + '" width="' + (w * n / total).toFixed(1) + '" height="10" style="fill:var(--ink)"/>';
        s += '<text class="tx-pct" x="' + colX[st] + '" y="' + (footY + 60) + '">' + Math.round((n / total) * 100) + '<tspan class="tx-pcts">%</tspan></text>';
      });
      const bottom = footY + 70;
      return { pos, svg: s, w: right + M, h: bottom + M };
    }
    return laySections(SORDER.map((st) => ({
      key: 'st:' + st, glyph: st, label: ST_LABEL[st], sub: ST_DESC[st], items: ORDER.filter((f) => f.status === st), st,
    })));
  }

  function relGroups() {
    const g = BP.releases.map((r) => ({ id: r.id, label: r.label, date: r.date, state: r.state, items: ORDER.filter((f) => f.release === r.id) }));
    g.push({ id: 'none', label: 'Unscheduled', date: null, state: 'none', items: ORDER.filter((f) => !f.release) });
    return g;
  }
  const REL_STATE = { shipped: 'Shipped', next: 'Next release', future: 'Future', none: 'No release yet' };

  function layRelease(P) {
    const pos = new Map();
    let s = '';
    const groups = relGroups();
    if (!P) {
      const K = 3, RG = 40, gw = K * PX - GAP, labelH = 70;
      const L = Math.max.apply(null, groups.map((g) => Math.ceil(g.items.length / K)));
      const shipped = groups.filter((g) => g.state === 'shipped');
      const shipW = shipped.length * (gw + RG) - RG;
      const key = keyFlow('release', M, M, shipW);
      const shipMax = Math.max.apply(null, shipped.map((g) => Math.ceil(g.items.length / K)));
      const baseY = Math.max(M + labelH + L * PY, M + key.h + 36 + labelH + shipMax * PY);
      s += key.svg;
      let x = M;
      let todayX = null;
      groups.forEach((g, gi) => {
        const lv = Math.ceil(g.items.length / K);
        if (g.state === 'next') {
          s += '<rect class="next-wash" x="' + (x - 14) + '" y="' + (baseY - L * PY - labelH + 6) + '" width="' + (gw + 28) + '" height="' + (L * PY + labelH + 118) + '"/>';
          if (todayX == null) todayX = x - RG / 2 - 14 / 2;
        }
        g.items.forEach((f, i) => pos.set(f.id, [x + (i % K) * PX, baseY - (Math.floor(i / K) + 1) * PY + GAP]));
        const topY = baseY - lv * PY + GAP;
        s += '<text class="tx-big" x="' + x + '" y="' + (topY - 22) + '">' + g.items.length + '</text>';
        s += '<text class="tx-mono c3 z2" x="' + (x + gw) + '" y="' + (topY - 24) + '" text-anchor="end">' + pv('rel:' + g.id) + '% <tspan class="lens-word">' + LENS_NAME[S.lens].toLowerCase() + '</tspan></text>';
        s += '<g class="hd-rel">';
        s += '<text class="tx-lab" x="' + x + '" y="' + (baseY + 44) + '" style="font-size:30px">' + esc(g.label) + '</text>';
        if (g.date) s += '<text class="tx-mono c2 z1" x="' + x + '" y="' + (baseY + 70) + '" style="font-size:16px">' + fmtDate(g.date) + '</text>';
        s += '<text class="tx-caps z1' + (g.state === 'next' ? '' : ' c3') + '" x="' + x + '" y="' + (baseY + 94) + '" style="font-size:15px">' + REL_STATE[g.state] + '</text>';
        s += '</g>';
        x += gw + RG;
        if (gi === groups.length - 1) x -= RG;
      });
      s += '<rect class="h-rule" x="' + M + '" y="' + (baseY + 6) + '" width="' + (x - M) + '" height="3"/>';
      if (todayX != null) {
        s += '<path class="today" d="M' + todayX + ' ' + M + 'V' + (baseY + 100) + '"/>';
        s += '<rect class="h-band" x="' + (todayX - 190) + '" y="' + M + '" width="190" height="36"/>';
        s += '<text class="tx-caps on-band" x="' + (todayX - 95) + '" y="' + (M + 24) + '" text-anchor="middle" style="font-size:17px">Today ' + fmtDate(AS_OF).replace(/ \d{4}$/, '') + '</text>';
      }
      return { pos, svg: s, w: x + M, h: baseY + 100 + M };
    }
    return laySections(groups.map((g) => ({
      key: 'rel:' + g.id, label: g.label, sub: (g.date ? fmtDate(g.date) + ' · ' : '') + REL_STATE[g.state], items: g.items,
    })));
  }

  /** Portrait sections: a black header band per group, tiles flowing seven to a row. */
  function laySections(sections) {
    const pos = new Map();
    let s = '';
    const COLS = 7;
    const W = COLS * PX - GAP;
    let y = M;
    sections.forEach((sec) => {
      s += '<g class="hd' + (sec.st ? ' hd-st" data-st="' + sec.st : '') + '"><rect class="h-band" x="' + M + '" y="' + y + '" width="' + W + '" height="62"/>';
      let lx = M + 14;
      if (sec.glyph) { s += '<g class="on-band-g" transform="translate(' + (M + 30) + ',' + (y + 31) + ')">' + glyph(sec.glyph, 14) + '</g>'; lx = M + 56; }
      s += '<text class="tx-bcode on-band" x="' + lx + '" y="' + (y + 42) + '" style="font-size:30px">' + esc(sec.label) + '</text>';
      s += '<text class="tx-bpct on-band" x="' + (M + W - 14) + '" y="' + (y + 42) + '" text-anchor="end" style="font-size:30px">' + sec.items.length + '<tspan class="on-band-2" dx="12" style="font-size:20px">' + pv(sec.key) + '%</tspan></text>';
      s += '</g>';
      y += 74;

  // dependency links for the selection
  function tileCenter(id) {
    const p = LAY[S.arr].pos.get(id);
    return p ? [p[0] + TW / 2, p[1] + TH / 2] : null;
  }
  function edgePoint(c, toward) {
    const dx = toward[0] - c[0], dy = toward[1] - c[1];
    const sx = dx === 0 ? Infinity : (TW / 2 + 3) / Math.abs(dx);
    const sy = dy === 0 ? Infinity : (TH / 2 + 3) / Math.abs(dy);
    const t = Math.min(sx, sy);
    return [c[0] + dx * t, c[1] + dy * t];
  }
  function drawLinks() {
    linksG.innerHTML = '';
    if (!S.sel) return;
    const c0 = tileCenter(S.sel);
    if (!c0) return;
    let halo = '', ln = '', dots = '';
    const path = (a, b, bend) => {
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      const off = Math.min(140, len * 0.16) * bend;
      const cx = mx - (dy / len) * off, cy = my + (dx / len) * off;
      return 'M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + 'Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + b[0].toFixed(1) + ' ' + b[1].toFixed(1);
    };
    let li = 0;
    const bendOf = () => { const i = li++; return (i % 2 ? -1 : 1) * (0.55 + 0.3 * Math.floor(i / 2)); };
    BP.dependencies(S.sel).forEach((d) => {
      const c1 = tileCenter(d.id);
      if (!c1) return;
      const a = edgePoint(c0, c1), b = edgePoint(c1, c0);
      const p = path(a, b, bendOf());
      halo += '<path class="halo" d="' + p + '"/>';
      ln += '<path class="ln" d="' + p + '" marker-end="url(#ah)"/>';
      dots += '<circle cx="' + a[0].toFixed(1) + '" cy="' + a[1].toFixed(1) + '" r="3.4"/>';
    });
    BP.dependents(S.sel).forEach((d) => {
      const c1 = tileCenter(d.id);
      if (!c1) return;
      const a = edgePoint(c1, c0), b = edgePoint(c0, c1);
      const p = path(a, b, bendOf());
      halo += '<path class="halo" d="' + p + '"/>';
      ln += '<path class="ln ln-up" d="' + p + '" marker-end="url(#ah2)"/>';
    });
    linksG.innerHTML = halo + ln + dots;
  }

  function applyCam() {

  let fitK = 0.5;

  function ensureVisible(id, minK) {
    const p = LAY[S.arr].pos.get(id);

    const k = Math.max(cam.k, minK || 0);
    const sx = p[0] * k + (k === cam.k ? cam.x : 0), sy = p[1] * k + (k === cam.k ? cam.y : 0);

    if (!inside) flyTo({ k, x: v.w / 2 - (p[0] + TW / 2) * k, y: v.h / 2 - (p[1] + TH / 2) * k }, 600);
  }

  /** Keeps the selection and its dependency neighbours in view, never zooming in unless asked to fly. */
  function revealSelection(id, fly) {
    const L = LAY[S.arr];
    const ids = [id].concat(BP.dependencies(id).map((d) => d.id), BP.dependents(id).map((d) => d.id));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    ids.forEach((k) => { const p = L.pos.get(k); if (!p) return; x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0] + TW); y1 = Math.max(y1, p[1] + TH); });
    const v = view();
    const pad = 36;
    let k = fly ? Math.max(cam.k, 0.95) : cam.k;
    const kFit = Math.min((v.w - 2 * pad) / (x1 - x0), (v.h - 2 * pad) / (y1 - y0));
    if (kFit < k) k = Math.max(kFit, fitK * 0.9);

    if (k === cam.k && sx0 >= pad && sy0 >= pad && sx0 + bw <= v.w - pad && sy0 + bh <= v.h - pad) return;

    let ty = k === cam.k ? cam.y : v.h / 2 - ((y0 + y1) / 2) * k;

    if (x1 * k + tx > v.w - pad) tx = v.w - pad - x1 * k;
    if (y0 * k + ty < pad) ty = pad - y0 * k;

  // pointer: drag to pan, two fingers to pinch, tap to select
  const ptrs = new Map();
  let drag = null, pinch = null;
  function localPt(e) { const r = svg.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  svg.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;

    } else if (ptrs.size === 2) {
      const [a, b] = Array.from(ptrs.values());

    }

    ptrs.set(e.pointerId, localPt(e));

      const [a, b] = Array.from(ptrs.values());
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;

      const wx = (pinch.mx - pinch.x0) / pinch.k0, wy = (pinch.my - pinch.y0) / pinch.k0;

    if (drag) {

    } else if (ptrs.size === 1 && drag) {

  });

  function handleTap(target) {

      const id = tile.getAttribute('data-id');

      return;

  function zoomToDomain(id) {

    h += '<div class="cd-sym">' + SYM.get(id) + '</div><p class="cd-name">' + esc(f.name) + '</p>';
    h += '<div class="cd-meta">' + esc(m.code + ' · ' + m.name) + '<br>' + f.priority + ' · ' + rel + ' · ' + esc(BP.team(f.owner).name) + '</div>';
    h += '<div class="cd-grid">';
    DIMS.forEach((d) => {
      const cur = S.lens === d.id;

  // keyboard
  document.addEventListener('keydown', (e) => {
    const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');

      if (typing) { const q = $('#q'); if (q.value) { q.value = ''; S.query = ''; refreshFilters(); } else q.blur(); app.classList.remove('searching'); return; }

      if (S.legend) { toggleLegend(false); return; }
      if (S.sel || S.mod) { deselect(); return; }
      if (filtersActive()) { clearFilters(); return; }
      return;

    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;

    else if (k === '+' || k === '=') { zoomBy(1.3); e.preventDefault(); }

    else if (k === '/') { e.preventDefault(); openSearch(); }

  // search

  // theme: system > light > dark

      light: '<circle cx="8" cy="8" r="3.4" style="fill:none;stroke:currentColor;stroke-width:1.5"/><path d="M8 .8v2.4M8 12.8v2.4M.8 8h2.4M12.8 8h2.4M2.9 2.9l1.7 1.7M11.4 11.4l1.7 1.7M2.9 13.1l1.7-1.7M11.4 4.6l1.7-1.7" style="stroke:currentColor;stroke-width:1.4"/>',

  // ════════════════════════════════════════════════════════════════════════
  // PANELS: inspector, module inspector, legend
  // ════════════════════════════════════════════════════════════════════════
  const insp = $('#insp');
  const ibody = $('#insp-body');
  const closeBtn = '<button type="button" class="p-close" id="i-close" aria-label="Close inspector (Esc)"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" style="stroke:currentColor;stroke-width:1.8"/></svg></button>';
  function openPanel() {

  }
  function select(id, opts) {
    const f = BP.feature(id);

    TILE.forEach((el, k) => el.classList.toggle('sel', k === id));
    const rel = new Set([id].concat(BP.dependencies(id).map((d) => d.id), BP.dependents(id).map((d) => d.id)));
    TILE.forEach((el, k) => el.classList.toggle('far', !rel.has(k)));
    svg.classList.add('selecting');
    ibody.innerHTML = inspFeature(f);
    ibody.scrollTop = 0;
    openPanel();
    drawLinks();
    requestAnimationFrame(() => revealSelection(id, opts && opts.fly));
  }
  function deselect() {
    S.sel = null; S.mod = null;
    TILE.forEach((el) => { el.classList.remove('sel'); el.classList.remove('far'); });
    svg.classList.remove('selecting');
    linksG.innerHTML = '';
    insp.classList.remove('open');
    app.classList.remove('insp-open');
  }
  function dimSection(f) {
    return DIMS.map((d) => {
      const sc = BP.dimScore(f, d.id);
      let h = '<div class="dimx' + (S.lens === d.id ? ' cur' : '') + '" data-dim="' + d.id + '"><div class="dimx-h"><b>' + d.label + '</b><span>' + esc(d.question) + '</span><em>' + pct(sc) + '%</em></div><div class="fgrid">';
      d.facets.forEach((fc) => {
        const st = f.dims[d.id][fc.id];
        h += '<div class="fcell st-' + st + '"><svg aria-hidden="true">' + facetBar(st) + '</svg><b>' + esc(fc.label) + '</b><span>' + STATE_LABEL[st] + '</span></div>';
      });
      return h + '</div></div>';
    }).join('');
  }
  function refreshInspectorDims() {
    $$('.dimx', ibody).forEach((d) => d.classList.toggle('cur', d.getAttribute('data-dim') === S.lens));
    $$('svg.tset', ibody).forEach((s) => s.setAttribute('data-lens', S.lens));
  }
  function depItem(d) {
    const att = BP.needsAttention(d);
    return '<li><button type="button" class="dep' + (att ? ' att' : '') + '" data-goto="' + d.id + '"><span class="dn">' + NUM.get(d.id) + '</span><span class="ds">' + SYM.get(d.id) + '</span><span class="dnm">' + esc(d.name) + '</span>' + glyphHTML(d.status) + '<small>' + modOf(d).code + '</small></button></li>';
  }
  function inspFeature(f) {
    const m = modOf(f), d = domOf(f), team = BP.team(f.owner);
    const rel = f.release ? BP.release(f.release) : null;
    const deps = BP.dependencies(f), dents = BP.dependents(f);
    const ago = daysAgo(f.updatedAt);
    let h = '<header class="ih"><svg class="ih-tile tset" data-lens="' + S.lens + '" data-lod="1" viewBox="-5 -5 106 122" aria-hidden="true">' + tileSVG(f, { key: true }) + '</svg>';
    h += '<div class="ih-t"><nav class="crumb" aria-label="Location"><button type="button" data-goto-dom="' + d.id + '">' + esc(d.name) + '</button><span aria-hidden="true">›</span><button type="button" data-goto-mod="' + m.id + '">' + esc(m.name) + '</button></nav>';
    h += '<h2 id="insp-title">' + esc(f.name) + '</h2><p class="ih-id mono">' + esc(f.id) + '</p></div>' + closeBtn + '</header>';
    h += '<p class="sum">' + esc(f.summary) + '</p>';
    if (f.blockedReason) h += '<div class="callout att"><b>Blocked</b>' + esc(f.blockedReason) + '</div>';
    if (f.note) h += '<div class="callout' + (f.review === 'changes' ? ' att' : '') + '"><b>' + (f.review === 'changes' ? 'Changes requested' : 'Note') + '</b>' + esc(f.note) + '</div>';
    if (isTrust(f)) h += '<div class="callout ai">' + foldIcon() + '<div><b>Verify AI work</b>' + (f.builtBy === 'agent' ? 'Built by the ' + esc(team.name) : 'Built by an agent and human pair') + ' and not yet approved by a human reviewer.</div></div>';
    h += '<dl class="facts">';
    h += '<div><dt>Status</dt><dd>' + glyphHTML(f.status) + esc(ST_LABEL[f.status]) + '</dd></div>';
    h += '<div><dt>Priority</dt><dd>' + f.priority + '</dd></div>';
    h += '<div><dt>Release</dt><dd>' + (rel ? rel.label + ' <small>' + (rel.state === 'shipped' ? 'shipped ' : rel.state === 'next' ? 'next · ' : 'planned · ') + fmtDate(rel.date) + '</small>' : 'Unscheduled') + '</dd></div>';
    h += '<div><dt>Owner</dt><dd>' + esc(team.name) + ' <small>' + (team.kind === 'agent' ? 'agent crew' : 'human squad') + '</small></dd></div>';
    h += '<div><dt>Built by</dt><dd>' + BUILT[f.builtBy] + '</dd></div>';
    h += '<div><dt>Review</dt><dd class="rv-' + f.review + '">' + REVIEW[f.review] + '</dd></div>';
    h += '<div><dt>Updated</dt><dd>' + fmtDate(f.updatedAt) + ' <small>' + (ago === 0 ? 'today' : ago === 1 ? 'yesterday' : ago + ' days ago') + '</small></dd></div>';
    h += '<div><dt>Number</dt><dd><span class="mono">' + NUM.get(f.id) + '</span> ' + SYM.get(f.id) + '</dd></div>';
    h += '</dl>';
    h += '<section class="isec" aria-label="Dimensions">' + dimSection(f) + '</section>';
    const mt = f.metrics || {};
    const met = (lab, v, unit, why) => '<div class="met"><b>' + lab + '</b>' + (v == null ? '<em class="na">—</em><small>' + why + '</small>' : '<em>' + v + unit + '</em>') + '</div>';
    h += '<section class="mets" aria-label="Metrics">' + met('Coverage', mt.coverage, '%', 'not built yet') + met('Uptime 30d', mt.uptime, '%', 'not live') + met('Adoption', mt.adoption, '%', 'not live') + '</section>';
    h += '<section class="isec"><h3 class="cap">Depends on <span>' + deps.length + '</span></h3>' + (deps.length ? '<ul class="dlist">' + deps.map(depItem).join('') + '</ul>' : '<p class="empty">No dependencies.</p>') + '</section>';
    h += '<section class="isec"><h3 class="cap">Used by <span>' + dents.length + '</span></h3>' + (dents.length ? '<ul class="dlist">' + dents.map(depItem).join('') + '</ul>' : '<p class="empty">Nothing depends on this yet.</p>') + '</section>';
    return h;
  }
  function openModule(id) {
    const m = BP.module(id);
    if (!m) return;
    S.mod = id; S.sel = null;
    hideCard();
    TILE.forEach((el) => el.classList.remove('sel'));
    const ids = new Set(byMod.get(id).map((f) => f.id));
    TILE.forEach((el, k) => el.classList.toggle('far', !ids.has(k)));
    svg.classList.add('selecting');
    linksG.innerHTML = '';
    ibody.innerHTML = inspModule(m);
    ibody.scrollTop = 0;
    openPanel();
  }
  function inspModule(m) {
    const r = BP.moduleRollup(m.id), d = BP.domain(m.domainId), list = byMod.get(m.id), team = BP.team(m.owner);
    let h = '<header class="ih"><svg class="ih-tile" viewBox="-3 -3 102 118" aria-hidden="true"><rect width="96" height="112" style="fill:var(--band)"/><text x="7" y="18" style="font-family:var(--f-mono);font-stretch:75%;font-size:12px;fill:var(--on-band)">' + list.length + ' features</text><text x="7" y="74" style="font-weight:800;font-stretch:112.5%;font-size:' + (m.code.length > 3 ? 25 : 31) + 'px;fill:var(--on-band)">' + m.code + '</text><text x="7" y="100" style="font-weight:750;font-stretch:112.5%;font-size:17px;fill:var(--on-band)">' + pct(lensOf(r, S.lens)) + '%</text></svg>';
    h += '<div class="ih-t"><nav class="crumb" aria-label="Location"><button type="button" data-goto-dom="' + d.id + '">' + esc(d.name) + '</button><span aria-hidden="true">›</span><span>Module</span></nav><h2 id="insp-title">' + esc(m.name) + '</h2><p class="ih-id mono">Owner: ' + esc(team.name) + '</p></div>' + closeBtn + '</header>';
    h += '<p class="sum">' + esc(m.summary) + '</p>';
    h += '<div class="surf" aria-label="Surfaces">' + m.surfaces.map((s) => '<span>' + s + '</span>').join('') + '</div>';
    h += '<section class="mstat" aria-label="Features by status">' + SORDER.map((st) => '<div><em>' + r.byStatus[st] + '</em><span>' + glyphHTML(st) + esc(ST_LABEL[st]) + '</span></div>').join('') + '</section>';
    if (r.attention) h += '<div class="callout att"><b>' + r.attention + ' need attention</b>' + list.filter((f) => BP.needsAttention(f)).map((f) => esc(f.name)).join(' · ') + '</div>';
    h += '<section class="isec"><h3 class="cap">Completion by dimension <span>facets done · partial · to do · blocked</span></h3><div class="mroll">';
    DIMS.forEach((dd) => {
      const c = BP.facetCounts(list, dd.id);
      const tot = c.done + c.partial + c.todo + c.blocked || 1;
      h += '<b>' + dd.label + '</b><em>' + pct(r.dims[dd.id]) + '%</em><div class="stack">' + ['done', 'partial', 'todo', 'blocked'].map((k) => '<i class="s-' + k + '" style="width:' + ((c[k] / tot) * 100).toFixed(1) + '%"></i>').join('') + '</div>';
      h += '<span class="stack-l">' + c.done + ' · ' + c.partial + ' · ' + c.todo + ' · ' + c.blocked + (c.na ? '  (' + c.na + ' n/a)' : '') + '</span>';
    });
    h += '</div></section>';
    h += '<section class="isec"><h3 class="cap">Features <span>' + list.length + '</span></h3><ul class="dlist">' + list.map(depItem).join('') + '</ul></section>';
    return h;
  }

  // legend
  const legend = $('#legend');
  function renderLegend() {
    const r = BP.productRollup();
    let h = '<div class="p-head"><div><h2>Legend</h2><p>How the periodic table encodes Larkspur.</p></div><button type="button" class="p-close" id="lg-close" aria-label="Close legend (L)"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" style="stroke:currentColor;stroke-width:1.8"/></svg></button></div>';
    h += '<div class="lg"><h3 class="cap">Status <span>tint, frame and glyph</span></h3>';
    SORDER.forEach((st) => { h += '<div class="lg-row"><svg class="sw tset" viewBox="-2 -2 31 34" aria-hidden="true">' + miniTile(st, 0, 0, 27, 30) + '</svg><div><b>' + esc(ST_LABEL[st]) + '</b><small>' + esc(ST_DESC[st]) + '</small></div><span class="n">' + r.byStatus[st] + '</span></div>'; });
    h += '</div><div class="lg"><h3 class="cap">Overall lens <span>three bars</span></h3><p>Top bar Development, middle Operations, bottom Business. Length is the share of the four facets that are done; partial counts half.</p></div>';
    h += '<div class="lg"><h3 class="cap">Dimension lens <span>keys 2 to 4</span></h3><p>Tile fill turns into the score of that dimension, more ink means more complete. Status stays visible in the frame and glyph.</p><div class="lg-ramp">' + [0, 1, 2, 3, 4].map((i) => '<span style="background:var(--r' + i + ')"></span>').join('') + '</div><div class="lg-ramp-l"><span>0–19</span><span>20–39</span><span>40–59</span><span>60–79</span><span>80–100%</span></div>';
    h += '<p>Four pips show the facets of that dimension: filled is done, half-filled partial, empty to do, signal colour blocked, dotted not applicable.</p></div>';
    h += '<div class="lg"><h3 class="cap">Marks</h3>';
    const markRow = (ex, title, sub, n) => '<div class="lg-row"><svg class="sw tset" viewBox="-5 -5 37 40" aria-hidden="true">' + miniTile('live', 0, 0, 27, 30, ex) + '</svg><div><b>' + title + '</b><small>' + sub + '</small></div><span class="n">' + (n == null ? '' : n) + '</span></div>';
    h += markRow('<rect x="-2.6" y="-2.6" width="32.2" height="35.2" style="fill:none;stroke:var(--signal);stroke-width:2.6"/>', 'Needs attention', 'Blocked, a blocked facet, or a reviewer asked for changes. The only use of the signal colour.', r.attention);
    h += markRow('<path d="M18 -1H28V9Z" style="fill:var(--paper)"/><path d="M18 0V9H27Z" style="fill:var(--ink)"/>', 'Awaiting human review', 'Built by an agent crew or an agent and human pair, review pending or changes requested. Press V.', TRUST_COUNT);
    h += markRow('<rect x="3" y="3" width="21" height="24" style="fill:none;stroke:var(--ink);stroke-width:2.2"/>', 'Search match', 'Inner frame. Non-matching tiles fade back.', null);
    h += markRow('<rect x="-2.6" y="-2.6" width="32.2" height="35.2" style="fill:none;stroke:var(--ink);stroke-width:2.6"/>', 'Selected', 'Solid line with arrow: depends on. Dashed line: used by.', null);
    h += '</div><div class="lg"><h3 class="cap">Margins</h3><p>Column head: module code, name and the lens score in %. Black band: domain with its score and feature count. Column foot: features per status, or facets per state in a dimension lens. Orange badge: features needing attention.</p></div>';
    h += '<div class="lg"><h3 class="cap">Zoom levels</h3><p>Table: symbols and glyphs. Tile: names appear. Detail: all twelve facets, owner, release and priority.</p></div>';
    h += '<div class="lg"><h3 class="cap">Keys</h3><div class="lg-keys"><kbd>1–4</kbd><span>Lens: Overall, Development, Operations, Business</span><kbd>T S R</kbd><span>Arrange: Table, Status, Release</span><kbd>+ − 0</kbd><span>Zoom in, out, fit</span><kbd>/</kbd><span>Search; Enter jumps to the next match</span><kbd>V</kbd><span>Verify AI overlay</span><kbd>A</kbd><span>Attention only</span><kbd>L</kbd><span>Legend</span><kbd>M</kbd><span>Theme: system, light, dark</span><kbd>Esc</kbd><span>Close, deselect</span></div></div>';
    legend.innerHTML = h;
  }
  function toggleLegend(force) {
    S.legend = force == null ? !S.legend : force;
    legend.hidden = !S.legend;
    $('#b-legend').setAttribute('aria-expanded', String(S.legend));
  }

  // persistence (optional)
  function store() {
    try { localStorage.setItem('periodic-blueprint', JSON.stringify({ theme: S.theme })); } catch (e) { /* storage unavailable */ }
  }
  function restore() {
    try {
      const v = JSON.parse(localStorage.getItem('periodic-blueprint') || '{}');
      if (THEMES.indexOf(v.theme) >= 0) S.theme = v.theme;
    } catch (e) { /* storage unavailable */ }
  }

  // ════════════════════════════════════════════════════════════════════════
  // BOOT and resize
  // ════════════════════════════════════════════════════════════════════════
  function orientation() {
    const r = stage.getBoundingClientRect();
    return r.width / Math.max(1, r.height) < 0.9;
  }
  function rebuild(animate) {
    buildLayouts();
    placeTiles(animate);
    setLens(S.lens);
  }
  function boot() {
    restore();
    applyTheme();
    S.phone = phoneMQ.matches;
    app.classList.toggle('phone', S.phone);
    S.portrait = orientation();
    buildTiles();
    rebuild(false);
    renderHUD();
    renderLegend();
    refreshFilters();
    fit(false);
    applyCam();
    let rT = 0;
    let lastW = stage.clientWidth, lastH = stage.clientHeight;
    new ResizeObserver(() => {
      clearTimeout(rT);
      rT = setTimeout(() => {
        const w = stage.clientWidth, h = stage.clientHeight;
        if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
        const wasFit = Math.abs(cam.k - fitK) < 0.002;
        lastW = w; lastH = h;
        S.phone = phoneMQ.matches;
        app.classList.toggle('phone', S.phone);
        const P = orientation();
        if (P !== S.portrait) { S.portrait = P; rebuild(true); fit(true); if (S.sel) setTimeout(drawLinks, 900); return; }
        if (wasFit) fit(false); else { fitK = fitTarget().k; schedule(); }
      }, 90);
    }).observe(stage);
    // re-measure names once web fonts are in
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        const sel = S.sel, mod = S.mod;
        buildTiles();
        rebuild(false);
        refreshFilters();
        setTrust(S.trust);
        if (sel) { S.sel = null; select(sel); } else if (mod) openModule(mod);
      });
    }
  }
  boot();
  window.__pb = { S, cam, select, openModule, setLens, setArrangement, fit, zoomAt, flyToRect, LAY: () => LAY, NUM, SYM };
})();
</script>
</body>
</html>
